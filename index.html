<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YachtSpotter Majorca</title>

<link rel="manifest" href="manifest.json" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#07182f;
  --navy-dark:#020812;
  --gold:#d4af37;
  --brass:#b9932e;
  --mist:#b8c3d6;
  --glass:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.11);
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Inter,sans-serif;
  background:radial-gradient(circle at top,#102748 0%,#020812 75%);
  color:white;
}

.header{
  padding:18px 18px 8px;
  text-align:center;
}

.brand{
  font-family:"Cormorant Garamond",serif;
  font-size:36px;
  color:var(--gold);
  line-height:1;
}

.edition{
  margin-top:4px;
  font-size:10px;
  letter-spacing:3px;
  color:var(--mist);
  text-transform:uppercase;
}

.binocular-shell{
  position:relative;
  width:min(94vw,760px);
  margin:12px auto 6px;
  display:flex;
  justify-content:center;
  gap:2px;
  align-items:flex-start;
}

.binocular-shell::before{
  content:"";
  position:absolute;
  width:92px;
  height:52px;
  border-radius:999px;
  background:
    radial-gradient(circle at 30% 25%,rgba(255,255,255,.35),transparent 22%),
    linear-gradient(145deg,#f0d36f,#d4af37 35%,#9b7624 70%,#4f3b12);
  top:calc(min(42vw,310px) / 2 - 4px);
  left:50%;
  transform:translate(-50%,-50%);
  z-index:0;
  box-shadow:
    0 12px 28px rgba(0,0,0,.38),
    inset 0 3px 5px rgba(255,255,255,.35),
    inset 0 -6px 9px rgba(0,0,0,.42);
}

.scope-column{
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:min(45vw,335px);
}

.scope{
  width:min(42vw,310px);
  height:min(42vw,310px);
  border-radius:50%;
  padding:13px;
  background:
    radial-gradient(circle at 29% 20%,rgba(255,255,255,.45),transparent 14%),
    radial-gradient(circle at 70% 78%,rgba(0,0,0,.22),transparent 25%),
    linear-gradient(145deg,#f7dc7b 0%,#d4af37 30%,#b9932e 58%,#5e4614 100%);
  box-shadow:
    0 24px 50px rgba(0,0,0,.48),
    inset 0 3px 6px rgba(255,255,255,.42),
    inset 0 -7px 12px rgba(0,0,0,.42);
}

.scope::after{
  content:"";
  display:block;
  width:100%;
  height:100%;
  border-radius:50%;
  pointer-events:none;
}

.scope-inner{
  width:100%;
  height:100%;
  border-radius:50%;
  overflow:hidden;
  background:#06101f;
  border:2px solid rgba(255,255,255,.14);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    inset 0 0 28px rgba(0,0,0,.75),
    inset 0 0 4px rgba(212,175,55,.45);
}

video,.preview{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.preview{display:none;}

#diagramViewer{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,rgba(212,175,55,.08),transparent 55%),
    #06101f;
}

#diagramViewer img{
  width:86%;
  height:86%;
  object-fit:contain;
}

.fallback-yacht{
  width:82%;
  height:82%;
}

button{
  border:none;
  cursor:pointer;
  font-family:"Cormorant Garamond",serif;
  font-weight:700;
  letter-spacing:1px;
}

.pill{
  margin-top:10px;
  padding:9px 16px;
  border-radius:999px;
  background:linear-gradient(145deg,#f0d36f,#d4af37 36%,#b9932e 70%,#674d17);
  color:#05101d;
  font-size:15px;
  box-shadow:0 8px 18px rgba(0,0,0,.22);
  white-space:nowrap;
}

.search{
  width:min(38vw,280px);
  margin-top:10px;
  padding:9px 13px;
  border-radius:999px;
  border:1px solid rgba(212,175,55,.28);
  background:rgba(2,8,18,.76);
  color:white;
  font-size:12px;
  outline:none;
  text-align:center;
}

.search::placeholder{color:rgba(184,195,214,.72);}

.info-card{
  width:min(88vw,520px);
  margin:12px auto;
  padding:13px;
  border-radius:22px;
  background:var(--glass);
  border:1px solid var(--line);
  text-align:center;
}

.info-links{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  align-items:center;
}

.info-link{
  display:block;
  padding:10px 8px;
  border-radius:18px;
  border:1px solid rgba(212,175,55,.34);
  background:rgba(6,16,31,.54);
  text-decoration:none;
  color:white;
}

.info-main{
  font-family:"Cormorant Garamond",serif;
  font-size:21px;
  color:var(--gold);
  line-height:1.05;
}

.got-button{
  width:100%;
  margin-top:12px;
  padding:10px;
  font-size:18px;
}

.fleet-title{
  width:min(88vw,520px);
  margin:22px auto 9px;
  font-family:"Cormorant Garamond",serif;
  font-size:21px;
  letter-spacing:3px;
  color:var(--gold);
}

.fleet-row{
  display:flex;
  gap:11px;
  overflow-x:auto;
  padding:0 14px 24px;
}

.fleet-card{min-width:96px;}

.fleet-porthole{
  width:86px;
  height:86px;
  border-radius:50%;
  padding:6px;
  background:linear-gradient(145deg,#f0d36f,#d4af37,#b9932e,#674d17);
}

.fleet-porthole img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
}

.fleet-name{
  margin-top:7px;
  text-align:center;
  font-family:"Cormorant Garamond",serif;
  font-size:15px;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(2,8,18,.9);
  backdrop-filter:blur(10px);
  display:none;
  z-index:50;
  padding:18px;
}

.overlay-card{
  max-width:420px;
  margin:40px auto;
  border-radius:26px;
  background:linear-gradient(180deg,#0a1d37,#020812);
  border:1px solid rgba(212,175,55,.3);
  padding:15px;
}

.overlay-img{
  width:100%;
  border-radius:20px;
  margin-top:13px;
}

.overlay-close{
  width:100%;
  margin-top:12px;
  padding:9px;
  border-radius:999px;
  background:rgba(6,16,31,.74);
  color:white;
  border:1px solid rgba(212,175,55,.55);
  font-size:12px;
}

.install{
  text-align:center;
  margin:18px auto 32px;
  color:var(--mist);
  font-family:"Cormorant Garamond",serif;
  font-size:16px;
  letter-spacing:.6px;
}

.binocular-icon{
  width:52px;
  height:34px;
  margin:0 auto 8px;
  position:relative;
}

.binocular-icon::before,
.binocular-icon::after{
  content:"";
  position:absolute;
  width:25px;
  height:30px;
  border-radius:50%;
  background:
    radial-gradient(circle at 30% 22%,rgba(255,255,255,.4),transparent 18%),
    linear-gradient(145deg,#f0d36f,#d4af37,#b9932e,#674d17);
  top:2px;
  box-shadow:0 8px 14px rgba(0,0,0,.28), inset 0 -4px 6px rgba(0,0,0,.28);
}

.binocular-icon::before{left:0;}
.binocular-icon::after{right:0;}

.binocular-bridge{
  position:absolute;
  width:18px;
  height:11px;
  border-radius:999px;
  background:#d4af37;
  left:17px;
  top:12px;
  z-index:2;
}

.retake{
  margin-top:7px;
  color:var(--mist);
  font-size:12px;
  cursor:pointer;
}

canvas{display:none;}

@media(max-width:560px){
  .brand{font-size:32px;}
  .binocular-shell{gap:0;}
  .scope{padding:9px;}
  .pill{font-size:13px;padding:8px 11px;}
  .search{width:min(40vw,180px);font-size:11px;padding:8px 10px;}
  .info-main{font-size:18px;}
}
</style>
</head>

<body>

<div class="header">
  <div class="brand">YachtSpotter</div>
  <div class="edition">Majorca</div>
</div>

<div class="binocular-shell">
  <div class="scope-column">
    <div class="scope">
      <div class="scope-inner">
        <video id="video" autoplay playsinline muted></video>
        <img id="preview" class="preview" alt="Captured yacht">
      </div>
    </div>

    <button class="pill" onclick="spotYacht()">SPOT YACHT</button>
    <div id="retakeButton" class="retake" onclick="retakePhoto()" style="display:none;">Retake</div>
  </div>

  <div class="scope-column">
    <div class="scope">
      <div class="scope-inner">
        <div id="diagramViewer"></div>
      </div>
    </div>

    <input id="searchBox" class="search" placeholder="Type yacht name..." oninput="searchYacht()" />
  </div>
</div>

<div id="infoCard" class="info-card"></div>
<div id="fleetArea"></div>

<div class="install">
  <div class="binocular-icon">
    <div class="binocular-bridge"></div>
  </div>
  Add YachtSpotter to Home Screen
</div>

<div id="overlay" class="overlay" onclick="closeOverlay(event)">
  <div class="overlay-card" onclick="event.stopPropagation()">
    <div id="overlayContent"></div>
    <button class="overlay-close" onclick="hideOverlay()">Close</button>
  </div>
</div>

<canvas id="canvas"></canvas>

<script src="data.js"></script>

<script>
const video = document.getElementById("video");
const preview = document.getElementById("preview");
const canvas = document.getElementById("canvas");

let currentIndex = 0;
let selectedYacht = yachts[0];
let capturedImage = null;

navigator.mediaDevices.getUserMedia({
  video:{facingMode:{ideal:"environment"}},
  audio:false
})
.then(stream=>{video.srcObject=stream;})
.catch(()=>{alert("Camera unavailable.");});

function fallbackYacht(){
  return `
    <svg class="fallback-yacht" viewBox="0 0 500 160" xmlns="http://www.w3.org/2000/svg">
      <line x1="30" y1="124" x2="470" y2="124" stroke="#d4af37" stroke-width="1" opacity=".45"/>
      <path d="M48 112 L386 112 L452 88 L423 127 L84 131 Z" fill="none" stroke="#f0d36f" stroke-width="4"/>
      <path d="M122 96 C165 66 246 68 302 92 L365 92" fill="none" stroke="#f0d36f" stroke-width="4"/>
      <line x1="250" y1="32" x2="250" y2="74" stroke="#f0d36f" stroke-width="4"/>
      <circle cx="268" cy="50" r="8" fill="none" stroke="#f0d36f" stroke-width="2"/>
    </svg>
  `;
}

function showFallbackDiagram(){
  document.getElementById("diagramViewer").innerHTML = fallbackYacht();
}

function renderDiagram(){
  const viewer = document.getElementById("diagramViewer");

  if(selectedYacht && selectedYacht.thumb){
    viewer.innerHTML = `
      <img
        src="${selectedYacht.thumb}"
        alt="${selectedYacht.name}"
        onerror="showFallbackDiagram()"
      >
    `;
  } else {
    showFallbackDiagram();
  }

  renderInfo();
}

function renderInfo(){
  document.getElementById("infoCard").innerHTML = `
    <div class="info-links">
      <a class="info-link" href="${selectedYacht.yachtLink}" target="_blank">
        <div class="info-main">${selectedYacht.name}</div>
      </a>

      <a class="info-link" href="${selectedYacht.ownerLink}" target="_blank">
        <div class="info-main">${selectedYacht.deepPockets}</div>
      </a>
    </div>

    <button class="pill got-button" onclick="gotYacht()">GOT YACHT</button>
  `;
}

function searchYacht(){
  const q = document.getElementById("searchBox").value.toLowerCase().trim();
  if(!q) return;

  let index = yachts.findIndex(y => y.name.toLowerCase() === q);

  if(index < 0){
    index = yachts.findIndex(y => y.name.toLowerCase().startsWith(q));
  }

  if(index < 0){
    index = yachts.findIndex(y =>
      y.name.toLowerCase().includes(q) ||
      y.deepPockets.toLowerCase().includes(q)
    );
  }

  if(index >= 0){
    currentIndex = index;
    selectedYacht = yachts[index];
    renderDiagram();
  }
}

function spotYacht(){
  if(!video.videoWidth){
    alert("Camera loading.");
    return;
  }

  const ctx = canvas.getContext("2d");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video,0,0,canvas.width,canvas.height);

  capturedImage = canvas.toDataURL("image/jpeg",0.7);
  preview.src = capturedImage;
  preview.style.display = "block";
  video.style.display = "none";
  document.getElementById("retakeButton").style.display = "block";
}

function retakePhoto(){
  capturedImage = null;
  preview.src = "";
  preview.style.display = "none";
  video.style.display = "block";
  document.getElementById("retakeButton").style.display = "none";
}

function gotYacht(){
  if(!capturedImage){
    alert("Capture yacht photo first.");
    return;
  }

  const sightings = JSON.parse(localStorage.getItem("fleet") || "[]");

  sightings.unshift({
    name:selectedYacht.name,
    deepPockets:selectedYacht.deepPockets,
    yachtLink:selectedYacht.yachtLink,
    ownerLink:selectedYacht.ownerLink,
    image:capturedImage
  });

  localStorage.setItem("fleet",JSON.stringify(sightings));
  renderFleet();
}

function renderFleet(){
  const sightings = JSON.parse(localStorage.getItem("fleet") || "[]");

  if(!sightings.length){
    document.getElementById("fleetArea").innerHTML = "";
    return;
  }

  let html = `<div class="fleet-title">FLEET</div><div class="fleet-row">`;

  sightings.forEach((s,index)=>{
    html += `
      <div class="fleet-card" onclick="openFleet(${index})">
        <div class="fleet-porthole"><img src="${s.image}" alt="${s.name}"></div>
        <div class="fleet-name">${s.name}</div>
      </div>
    `;
  });

  html += `</div>`;
  document.getElementById("fleetArea").innerHTML = html;
}

function openFleet(index){
  const sightings = JSON.parse(localStorage.getItem("fleet") || "[]");
  const s = sightings[index];

  document.getElementById("overlayContent").innerHTML = `
    <div class="info-links">
      <a class="info-link" href="${s.yachtLink}" target="_blank">
        <div class="info-main">${s.name}</div>
      </a>

      <a class="info-link" href="${s.ownerLink}" target="_blank">
        <div class="info-main">${s.deepPockets}</div>
      </a>
    </div>

    <img class="overlay-img" src="${s.image}" alt="${s.name}">
  `;

  document.getElementById("overlay").style.display = "block";
}

function hideOverlay(){
  document.getElementById("overlay").style.display = "none";
}

function closeOverlay(e){
  if(e.target.id === "overlay") hideOverlay();
}

renderDiagram();
renderFleet();
</script>

</body>
</html>
