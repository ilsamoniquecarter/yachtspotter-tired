<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YachtSpotter Majorca</title>

<link rel="manifest" href="manifest.json" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#07182f;
  --gold:#d4af37;
  --brass:#b9932e;
  --mist:#b8c3d6;
  --glass:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.11);
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Inter,sans-serif;
  background:radial-gradient(circle at top,#102748 0%,#020812 75%);
  color:white;
}

.instrument{
  width:min(96vw,780px);
  margin:22px auto 8px;
  position:relative;
}

.binocular-svg{
  width:100%;
  display:block;
  filter:drop-shadow(0 28px 34px rgba(0,0,0,.55));
}

.lens-content{
  position:absolute;
  top:18.5%;
  width:34.5%;
  aspect-ratio:1/1;
  border-radius:50%;
  overflow:hidden;
  background:#06101f;
  border:2px solid rgba(255,255,255,.14);
  box-shadow:
    inset 0 0 34px rgba(0,0,0,.85),
    inset 0 0 8px rgba(212,175,55,.5);
  display:flex;
  align-items:center;
  justify-content:center;
}

.left-lens{left:9.4%;}
.right-lens{right:9.4%;}

video,.preview{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.preview{display:none;}

#diagramViewer{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,rgba(212,175,55,.08),transparent 55%),
    #06101f;
}

.fallback-yacht{
  width:82%;
  height:82%;
}

.controls{
  width:min(88vw,520px);
  margin:0 auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  align-items:start;
}

.camera-button{
  margin:0 auto;
  width:42px;
  height:42px;
  border-radius:50%;
  border:none;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 30% 22%,rgba(255,255,255,.44),transparent 18%),
    linear-gradient(145deg,#f0d36f,#d4af37 36%,#b9932e 70%,#674d17);
  color:#06101f;
  font-size:18px;
  box-shadow:0 8px 18px rgba(0,0,0,.28);
  cursor:pointer;
}

.search{
  width:100%;
  padding:9px 13px;
  border-radius:999px;
  border:1px solid rgba(212,175,55,.28);
  background:rgba(2,8,18,.76);
  color:white;
  font-size:12px;
  outline:none;
  text-align:center;
}

.search::placeholder{color:rgba(184,195,214,.72);}

.retake{
  margin-top:7px;
  color:var(--mist);
  font-size:12px;
  cursor:pointer;
  text-align:center;
}

.info-card{
  width:min(88vw,520px);
  margin:13px auto;
  padding:13px;
  border-radius:22px;
  background:var(--glass);
  border:1px solid var(--line);
  text-align:center;
}

.info-links{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  align-items:center;
}

.info-link{
  display:block;
  padding:10px 8px;
  border-radius:18px;
  border:1px solid rgba(212,175,55,.34);
  background:rgba(6,16,31,.54);
  text-decoration:none;
  color:white;
}

.info-main{
  font-family:"Cormorant Garamond",serif;
  font-size:21px;
  color:var(--gold);
  line-height:1.05;
}

.got-button{
  width:100%;
  margin-top:12px;
  padding:10px;
  border-radius:999px;
  border:none;
  background:linear-gradient(145deg,#f0d36f,#d4af37 36%,#b9932e 70%,#674d17);
  color:#06101f;
  font-family:"Cormorant Garamond",serif;
  font-weight:700;
  font-size:18px;
  letter-spacing:1px;
  box-shadow:0 8px 18px rgba(0,0,0,.22);
  cursor:pointer;
}

.fleet-title{
  width:min(88vw,520px);
  margin:22px auto 9px;
  font-family:"Cormorant Garamond",serif;
  font-size:21px;
  letter-spacing:3px;
  color:var(--gold);
}

.fleet-row{
  display:flex;
  gap:11px;
  overflow-x:auto;
  padding:0 14px 24px;
}

.fleet-card{min-width:96px;}

.fleet-porthole{
  width:86px;
  height:86px;
  border-radius:50%;
  padding:6px;
  background:linear-gradient(145deg,#f0d36f,#d4af37,#b9932e,#674d17);
}

.fleet-porthole img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
}

.fleet-name{
  margin-top:7px;
  text-align:center;
  font-family:"Cormorant Garamond",serif;
  font-size:15px;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(2,8,18,.9);
  backdrop-filter:blur(10px);
  display:none;
  z-index:50;
  padding:18px;
}

.overlay-card{
  max-width:420px;
  margin:40px auto;
  border-radius:26px;
  background:linear-gradient(180deg,#0a1d37,#020812);
  border:1px solid rgba(212,175,55,.3);
  padding:15px;
}

.overlay-img{
  width:100%;
  border-radius:20px;
  margin-top:13px;
}

.overlay-close{
  width:100%;
  margin-top:12px;
  padding:9px;
  border-radius:999px;
  background:rgba(6,16,31,.74);
  color:white;
  border:1px solid rgba(212,175,55,.55);
  font-size:12px;
}

.install{
  text-align:center;
  margin:18px auto 32px;
  color:var(--mist);
  font-family:"Cormorant Garamond",serif;
  font-size:16px;
  letter-spacing:.6px;
}

.mini-binocular-svg{
  width:92px;
  margin:0 auto 6px;
  display:block;
  filter:drop-shadow(0 12px 14px rgba(0,0,0,.45));
}

canvas{display:none;}

@media(max-width:560px){
  .instrument{margin-top:18px;}
  .controls{gap:12px;}
  .camera-button{width:39px;height:39px;font-size:17px;}
  .search{font-size:11px;padding:8px 10px;}
  .info-main{font-size:18px;}
}
</style>
</head>

<body>

<div class="instrument">

  <svg class="binocular-svg" viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <radialGradient id="shine" cx="30%" cy="20%" r="70%">
        <stop offset="0%" stop-color="#fff3ad"/>
        <stop offset="28%" stop-color="#d4af37"/>
        <stop offset="62%" stop-color="#9b7624"/>
        <stop offset="100%" stop-color="#3f2d0c"/>
      </radialGradient>
      <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffe58a"/>
        <stop offset="35%" stop-color="#d4af37"/>
        <stop offset="70%" stop-color="#8d6a1f"/>
        <stop offset="100%" stop-color="#3f2d0c"/>
      </linearGradient>
    </defs>

    <path d="M332 164 C360 118 540 118 568 164 L606 260 C620 306 585 350 535 350 L365 350 C315 350 280 306 294 260 Z"
      fill="url(#rim)" opacity=".96"/>
    <ellipse cx="450" cy="218" rx="76" ry="58" fill="#705219" opacity=".75"/>
    <ellipse cx="450" cy="205" rx="48" ry="34" fill="#d4af37" opacity=".9"/>

    <circle cx="285" cy="215" r="180" fill="url(#shine)"/>
    <circle cx="615" cy="215" r="180" fill="url(#shine)"/>

    <circle cx="285" cy="215" r="142" fill="#06101f" opacity=".92"/>
    <circle cx="615" cy="215" r="142" fill="#06101f" opacity=".92"/>

    <circle cx="226" cy="134" r="34" fill="rgba(255,255,255,.35)"/>
    <circle cx="556" cy="134" r="34" fill="rgba(255,255,255,.35)"/>

    <circle cx="285" cy="215" r="178" fill="none" stroke="#f6d978" stroke-width="10" opacity=".75"/>
    <circle cx="615" cy="215" r="178" fill="none" stroke="#f6d978" stroke-width="10" opacity=".75"/>
    <circle cx="285" cy="215" r="153" fill="none" stroke="#3b2a0b" stroke-width="14" opacity=".55"/>
    <circle cx="615" cy="215" r="153" fill="none" stroke="#3b2a0b" stroke-width="14" opacity=".55"/>
  </svg>

  <div class="lens-content left-lens">
    <video id="video" autoplay playsinline muted></video>
    <img id="preview" class="preview" alt="Captured yacht">
  </div>

  <div class="lens-content right-lens">
    <div id="diagramViewer"></div>
  </div>
</div>

<div class="controls">
  <div>
    <button class="camera-button" onclick="spotYacht()">📷</button>
    <div id="retakeButton" class="retake" onclick="retakePhoto()" style="display:none;">Retake</div>
  </div>

  <input
    id="searchBox"
    class="search"
    placeholder="Type yacht name..."
    oninput="searchYacht()"
    autocorrect="off"
    autocapitalize="none"
    spellcheck="false"
    autocomplete="off"
  />
</div>

<div id="infoCard" class="info-card"></div>
<div id="fleetArea"></div>

<div class="install">
  <svg class="mini-binocular-svg" viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <radialGradient id="miniShine" cx="30%" cy="20%" r="70%">
        <stop offset="0%" stop-color="#fff3ad"/>
        <stop offset="28%" stop-color="#d4af37"/>
        <stop offset="62%" stop-color="#9b7624"/>
        <stop offset="100%" stop-color="#3f2d0c"/>
      </radialGradient>
      <linearGradient id="miniRim" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffe58a"/>
        <stop offset="35%" stop-color="#d4af37"/>
        <stop offset="70%" stop-color="#8d6a1f"/>
        <stop offset="100%" stop-color="#3f2d0c"/>
      </linearGradient>
    </defs>
    <path d="M332 164 C360 118 540 118 568 164 L606 260 C620 306 585 350 535 350 L365 350 C315 350 280 306 294 260 Z" fill="url(#miniRim)"/>
    <ellipse cx="450" cy="218" rx="76" ry="58" fill="#705219" opacity=".75"/>
    <circle cx="285" cy="215" r="180" fill="url(#miniShine)"/>
    <circle cx="615" cy="215" r="180" fill="url(#miniShine)"/>
    <circle cx="285" cy="215" r="142" fill="#06101f" opacity=".92"/>
    <circle cx="615" cy="215" r="142" fill="#06101f" opacity=".92"/>
    <circle cx="226" cy="134" r="34" fill="rgba(255,255,255,.35)"/>
    <circle cx="556" cy="134" r="34" fill="rgba(255,255,255,.35)"/>
    <circle cx="285" cy="215" r="178" fill="none" stroke="#f6d978" stroke-width="10" opacity=".75"/>
    <circle cx="615" cy="215" r="178" fill="none" stroke="#f6d978" stroke-width="10" opacity=".75"/>
  </svg>
  Add to Home Screen
</div>

<div id="overlay" class="overlay" onclick="closeOverlay(event)">
  <div class="overlay-card" onclick="event.stopPropagation()">
    <div id="overlayContent"></div>
    <button class="overlay-close" onclick="hideOverlay()">Close</button>
  </div>
</div>

<canvas id="canvas"></canvas>

<script src="data.js?v=20"></script>

<script>
const video = document.getElementById("video");
const preview = document.getElementById("preview");
const canvas = document.getElementById("canvas");

let currentIndex = 0;
let selectedYacht = yachts[0];
let capturedImage = null;

navigator.mediaDevices.getUserMedia({
  video:{facingMode:{ideal:"environment"}},
  audio:false
})
.then(stream=>{video.srcObject=stream;})
.catch(()=>{alert("Camera unavailable.");});

function fallbackYacht(){
  return `
    <svg class="fallback-yacht" viewBox="0 0 500 160" xmlns="http://www.w3.org/2000/svg">
      <line x1="30" y1="124" x2="470" y2="124" stroke="#d4af37" stroke-width="1" opacity=".45"/>
      <path d="M48 112 L386 112 L452 88 L423 127 L84 131 Z" fill="none" stroke="#f0d36f" stroke-width="4"/>
      <path d="M122 96 C165 66 246 68 302 92 L365 92" fill="none" stroke="#f0d36f" stroke-width="4"/>
      <line x1="250" y1="32" x2="250" y2="74" stroke="#f0d36f" stroke-width="4"/>
      <circle cx="268" cy="50" r="8" fill="none" stroke="#f0d36f" stroke-width="2"/>
    </svg>
  `;
}

function renderDiagram(){
  document.getElementById("diagramViewer").innerHTML = fallbackYacht();
  renderInfo();
}

function renderInfo(){
  document.getElementById("infoCard").innerHTML = `
    <div class="info-links">
      <a class="info-link" href="${selectedYacht.yachtLink}" target="_blank">
        <div class="info-main">${selectedYacht.name}</div>
      </a>

      <a class="info-link" href="${selectedYacht.ownerLink}" target="_blank">
        <div class="info-main">${selectedYacht.deepPockets}</div>
      </a>
    </div>

    <button class="got-button" onclick="gotYacht()">GOT YACHT</button>
  `;
}

function searchYacht(){
  const q = document.getElementById("searchBox").value.toLowerCase().trim();
  if(!q) return;

  let index = yachts.findIndex(y => y.name.toLowerCase() === q);

  if(index < 0){
    index = yachts.findIndex(y => y.name.toLowerCase().startsWith(q));
  }

  if(index < 0){
    index = yachts.findIndex(y =>
      y.name.toLowerCase().includes(q) ||
      y.deepPockets.toLowerCase().includes(q)
    );
  }

  if(index >= 0){
    currentIndex = index;
    selectedYacht = yachts[index];
    renderDiagram();
  }
}

function spotYacht(){
  if(!video.videoWidth){
    alert("Camera loading.");
    return;
  }

  const ctx = canvas.getContext("2d");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video,0,0,canvas.width,canvas.height);

  capturedImage = canvas.toDataURL("image/jpeg",0.7);
  preview.src = capturedImage;
  preview.style.display = "block";
  video.style.display = "none";
  document.getElementById("retakeButton").style.display = "block";
}

function retakePhoto(){
  capturedImage = null;
  preview.src = "";
  preview.style.display = "none";
  video.style.display = "block";
  document.getElementById("retakeButton").style.display = "none";
}

function gotYacht(){
  if(!capturedImage){
    alert("Capture yacht photo first.");
    return;
  }

  const sightings = JSON.parse(localStorage.getItem("fleet") || "[]");

  sightings.unshift({
    name:selectedYacht.name,
    deepPockets:selectedYacht.deepPockets,
    yachtLink:selectedYacht.yachtLink,
    ownerLink:selectedYacht.ownerLink,
    image:capturedImage
  });

  localStorage.setItem("fleet",JSON.stringify(sightings));
  renderFleet();
}

function renderFleet(){
  const sightings = JSON.parse(localStorage.getItem("fleet") || "[]");

  if(!sightings.length){
    document.getElementById("fleetArea").innerHTML = "";
    return;
  }

  let html = `<div class="fleet-title">FLEET</div><div class="fleet-row">`;

  sightings.forEach((s,index)=>{
    html += `
      <div class="fleet-card" onclick="openFleet(${index})">
        <div class="fleet-porthole"><img src="${s.image}" alt="${s.name}"></div>
        <div class="fleet-name">${s.name}</div>
      </div>
    `;
  });

  html += `</div>`;
  document.getElementById("fleetArea").innerHTML = html;
}

function openFleet(index){
  const sightings = JSON.parse(localStorage.getItem("fleet") || "[]");
  const s = sightings[index];

  document.getElementById("overlayContent").innerHTML = `
    <div class="info-links">
      <a class="info-link" href="${s.yachtLink}" target="_blank">
        <div class="info-main">${s.name}</div>
      </a>

      <a class="info-link" href="${s.ownerLink}" target="_blank">
        <div class="info-main">${s.deepPockets}</div>
      </a>
    </div>

    <img class="overlay-img" src="${s.image}" alt="${s.name}">
  `;

  document.getElementById("overlay").style.display = "block";
}

function hideOverlay(){
  document.getElementById("overlay").style.display = "none";
}

function closeOverlay(e){
  if(e.target.id === "overlay") hideOverlay();
}

renderDiagram();
renderFleet();
</script>

</body>
</html>
