<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YachtSpotter Majorca</title>

<link rel="manifest" href="manifest.json" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght=600;700&family=Inter:wght=400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#051122;
  --navy-dark:#02070f;
  --gold:#d4af37;
  --brass:#b9932e;
  --mist:#b8c3d6;
  --panel-bg:#0a192f;
  --panel-border:#1e3557;
  --error:#ff3b30;
  --success:#00ff66;
}

*{box-sizing:border-box;}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter,sans-serif;
  background:radial-gradient(circle at top,#112746 0%,#051122 60%,#01050a 100%);
  color:white;
  padding-bottom: 40px;
}

/* MAIN BINOCULARS */
.binocular-stage{
  width:min(96vw,760px);
  margin:40px auto 0;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
}

.binoculars{
  width:min(94vw,720px);
  height:min(48vw,330px);
  position:relative;
}

.bridge{
  position:absolute;
  left:50%;
  top:44%;
  width:18%;
  height:22%;
  transform:translate(-50%,-50%);
  border-radius:999px;
  background:
    radial-gradient(circle at 28% 24%,rgba(255,255,255,.42),transparent 22%),
    linear-gradient(145deg,#f8df83 0%,#d4af37 34%,#9d7624 70%,#47320c 100%);
  box-shadow:
    0 16px 32px rgba(0,0,0,.48),
    inset 0 4px 7px rgba(255,255,255,.36),
    inset 0 -8px 13px rgba(0,0,0,.45);
  z-index:1;
}

.barrel{
  position:absolute;
  top:0;
  width:48%;
  height:100%;
  border-radius:50%;
  padding:3.3%;
  background:
    radial-gradient(circle at 27% 17%,rgba(255,255,255,.55),transparent 13%),
    radial-gradient(circle at 72% 82%,rgba(0,0,0,.36),transparent 30%),
    linear-gradient(145deg,#ffe990 0%,#d4af37 30%,#a57b23 58%,#47320c 100%);
  box-shadow:
    0 28px 60px rgba(0,0,0,.54),
    inset 0 5px 9px rgba(255,255,255,.44),
    inset 0 -11px 16px rgba(0,0,0,.48);
  z-index:2;
}

.barrel-left{left:1.5%;}
.barrel-right{right:1.5%;}

.lens{
  width:100%;
  height:100%;
  border-radius:50%;
  overflow:hidden;
  background:#06101f;
  border:2px solid rgba(255,255,255,.15);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    inset 0 0 36px rgba(0,0,0,.86),
    inset 0 0 7px rgba(212,175,55,.48);
}

video,.preview{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.preview{display:none;}

#diagramViewer{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,rgba(212,175,55,.08),transparent 55%),
    #06101f;
}

.dynamic-yacht-svg{
  width:90%;
  height:90%;
}

/* TWIN TELEMETRY GAUGES (Replaces old text bars) */
.telemetry-dashboard {
  width: min(92vw, 560px);
  margin: 24px auto 0;
  display: flex;
  justify-content: space-between;
  gap: 20px;
}

.round-gauge {
  flex: 1;
  background: radial-gradient(circle at center, #0a1b35 0%, #030a14 100%);
  border: 4px solid var(--brass);
  border-radius: 50%;
  aspect-ratio: 1 / 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 15px;
  box-shadow: 0 12px 24px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.8);
  position: relative;
  text-align: center;
}

.round-gauge::before {
  content: '';
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  border: 1px dashed rgba(212, 175, 55, 0.25);
  pointer-events: none;
}

.gauge-title {
  font-family: monospace;
  font-size: 9px;
  color: var(--mist);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 4px;
  opacity: 0.7;
}

.gauge-link {
  text-decoration: none;
  color: var(--gold);
  font-family: "Cormorant Garamond", serif;
  font-weight: 700;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.1;
}

.gauge-link.vessel-name-text {
  font-size: 20px;
  letter-spacing: 0.5px;
}

.gauge-link.owner-name-text {
  font-size: 16px;
  color: #e0cf9b;
}

/* INSTRUMENT PANEL / SHIP DASHBOARD */
.dashboard-console{
  width:min(92vw,560px);
  margin:24px auto;
  background:linear-gradient(180deg, var(--panel-bg) 0%, #050d1a 100%);
  border:3px solid var(--panel-border);
  border-radius:24px;
  padding:24px;
  box-shadow:0 20px 45px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
  text-align:center;
}

.console-heading{
  font-family:monospace;
  font-size:11px;
  color:var(--panel-border);
  letter-spacing:3px;
  text-transform:uppercase;
  margin-bottom:20px;
}

.dial-grid{
  display:flex;
  justify-content:space-around;
  align-items:center;
  gap:10px;
  margin-bottom:25px;
}

.dial-wrapper{
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* Round Dial Interface Elements */
.nautical-dial{
  width:76px;
  height:76px;
  border-radius:50%;
  border:4px solid var(--brass);
  background:radial-gradient(circle at center, #0e223d 0%, #050f1c 100%);
  box-shadow:0 8px 16px rgba(0,0,0,0.4), inset 0 4px 8px rgba(0,0,0,0.6);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  position:relative;
  transition:transform 0.1s ease, border-color 0.2s;
}

.nautical-dial:not(.locked-dial):active{
  transform:scale(0.95);
}

.nautical-dial::before {
  content:'';
  position:absolute;
  inset:2px;
  border-radius:50%;
  border:1px dashed rgba(212, 175, 55, 0.3);
}

/* System Arm Status Node Indicator light */
.dial-status-light {
  position: absolute;
  top: 4px;
  right: 12px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background-color: var(--error);
  box-shadow: 0 0 6px var(--error);
  transition: background-color 0.2s, box-shadow 0.2s;
}

.dial-status-light.armed {
  background-color: var(--success);
  box-shadow: 0 0 8px var(--success);
}

.locked-dial {
  border-color: #4a3b1a;
  cursor: not-allowed;
  opacity: 0.7;
}

.dial-icon{
  font-size:24px;
  line-height:1;
}

.dial-label{
  font-family:monospace;
  font-size:10px;
  color:var(--gold);
  letter-spacing:1px;
  margin-top:10px;
  text-transform:uppercase;
  font-weight:bold;
  text-align: center;
  width: 90px;
}

.search-field-wrapper {
  position:relative;
  width:100%;
}

.search{
  width:100%;
  height:44px;
  padding:0 15px;
  border-radius:8px;
  border:2px solid var(--panel-border);
  background:#030812;
  color:white;
  font-family:monospace;
  font-size:13px;
  outline:none;
  text-align:center;
  letter-spacing:1px;
}

.search:focus{
  border-color:var(--gold);
}

.search::placeholder{
  color:rgba(184,195,214,0.4);
}

.retake{
  margin-top:12px;
  color:var(--mist);
  font-family:monospace;
  font-size:11px;
  text-decoration:underline;
  cursor:pointer;
}

/* CONSOLE NOTIFICATION TELEPROMPTER banner */
.console-ticker {
  background: #030812;
  border: 1px solid var(--panel-border);
  padding: 6px;
  border-radius: 4px;
  font-family: monospace;
  font-size: 11px;
  color: #4cd964;
  margin-bottom: 16px;
  text-transform: uppercase;
  min-height: 28px;
}
.console-ticker.error-alert {
  color: #ff3b30;
}

/* STORAGE PORTEHOLES ROW */
.spotted-section{
  width:min(92vw,560px);
  margin:30px auto;
  display:none;
  background:rgba(4, 11, 22, 0.4);
  border:1px dashed var(--panel-border);
  border-radius:16px;
  padding:16px;
}

.fleet-row{
  display:flex;
  gap:16px;
  overflow-x:auto;
  padding-bottom:6px;
}

.fleet-card{
  min-width:90px;
  display:flex;
  flex-direction:column;
  align-items:center;
  cursor:pointer;
}

.fleet-porthole{
  width:80px;
  height:80px;
  border-radius:50%;
  padding:5px;
  background:linear-gradient(145deg,#f0d36f,#d4af37,#674d17);
  box-shadow:0 6px 12px rgba(0,0,0,0.4);
}

.fleet-porthole .porthole-asset-frame {
  width:100%;
  height:100%;
  border-radius:50%;
  background:#06101f;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.fleet-porthole img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.fleet-name{
  margin-top:6px;
  text-align:center;
  font-family:"Cormorant Garamond",serif;
  font-size:14px;
  color:var(--mist);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  width:86px;
}

/* POPUP VIEWER OVERLAYS */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(2,8,18,.92);
  backdrop-filter:blur(10px);
  display:none;
  z-index:50;
  padding:18px;
}

.overlay-card{
  max-width:420px;
  margin:40px auto;
  border-radius:26px;
  background:linear-gradient(180deg,#0a1d37,#020812);
  border:1px solid rgba(212,175,55,.3);
  padding:20px;
  text-align:center;
}

.overlay-img-frame{
  width:100%;
  border-radius:16px;
  margin-top:15px;
  overflow:hidden;
  background:#06101f;
  border:1px solid var(--panel-border);
}

.overlay-img-frame img{
  width:100%;
  display:block;
}

.overlay-close,
.home-close{
  width:100%;
  margin-top:20px;
  padding:12px;
  border-radius:999px;
  background:linear-gradient(145deg,#f0d36f,#d4af37 36%,#b9932e 70%,#674d17);
  color:#06101f;
  border:none;
  font-family:"Cormorant Garamond",serif;
  font-weight:700;
  font-size:18px;
  letter-spacing:1px;
  cursor:pointer;
}

.home-title{
  font-family:"Cormorant Garamond",serif;
  font-size:28px;
  color:var(--gold);
  margin-top:10px;
  margin-bottom:16px;
}

.home-steps{
  color:var(--mist);
  font-size:15px;
  line-height:1.8;
}

/* SHIPS LIGHTHOUSE ANCHOR FOOTER */
.install{
  text-align:center;
  margin:50px auto 20px;
  color:var(--mist);
  font-family:"Cormorant Garamond",serif;
  font-size:16px;
  letter-spacing:1px;
  cursor:pointer;
  width:fit-content;
}

.lighthouse-img-icon{
  width:50px;
  height:50px;
  object-fit:contain;
  margin-bottom:8px;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,0.5));
}

canvas{display:none;}

@media (max-width: 480px) {
  .telemetry-dashboard {
    gap: 10px;
  }
  .round-gauge {
    padding: 8px;
  }
  .gauge-link.vessel-name-text {
    font-size: 15px;
  }
  .gauge-link.owner-name-text {
    font-size: 12px;
  }
}
</style>
</head>

<body>

<div class="binocular-stage">
  <div class="binoculars">
    <div class="bridge"></div>

    <div class="barrel barrel-left">
      <div class="lens">
        <video id="video" autoplay playsinline muted></video>
        <img id="preview" class="preview" alt="Captured viewport frame">
      </div>
    </div>

    <div class="barrel barrel-right">
      <div class="lens">
        <div id="diagramViewer"></div>
      </div>
    </div>
  </div>
</div>

<div class="telemetry-dashboard">
  <div class="round-gauge">
    <div class="gauge-title">Target Vessel</div>
    <div id="vesselGaugeContent"></div>
  </div>
  <div class="round-gauge">
    <div class="gauge-title">Registry Owner</div>
    <div id="ownerGaugeContent"></div>
  </div>
</div>

<div class="dashboard-console">
  <div class="console-heading">Bridge Control Console</div>
  
  <div id="consoleTicker" class="console-ticker">System Armed: Photo Required to Log</div>

  <div class="dial-grid">
    <div class="dial-wrapper">
      <div class="nautical-dial" onclick="captureLivePhoto()">
        <span class="dial-icon">📷</span>
      </div>
      <div class="dial-label">Take Photo</div>
    </div>

    <div class="dial-wrapper">
      <div class="nautical-dial" onclick="browseDatabaseNext()">
        <span class="dial-icon">🧭</span>
      </div>
      <div class="dial-label">Browse Boats</div>
    </div>

    <div class="dial-wrapper">
      <div id="logDial" class="nautical-dial locked-dial" onclick="triggerLogCommit()">
        <div id="statusLight" class="dial-status-light"></div>
        <span class="dial-icon">⚓</span>
      </div>
      <div class="dial-label">Log Vessel</div>
    </div>
  </div>

  <div class="search-field-wrapper">
    <input
      id="searchBox"
      class="search"
      placeholder="SYS REGISTRY SEARCH..."
      oninput="searchYacht()"
      autocorrect="off"
      autocapitalize="none"
      spellcheck="false"
      autocomplete="off"
    />
  </div>
  <div id="retakeButton" class="retake" onclick="retakePhoto()" style="display:none;">Clear Snapshot Frame</div>
</div>

<div id="fleetArea" class="spotted-section"></div>

<div id="installFooter" class="install" onclick="showHomeHelp()">
  <img src="lighthouse.png" class="lighthouse-img-icon" alt="Lighthouse"><br>
  ADD TO HOME SCREEN
</div>

<div id="overlay" class="overlay" onclick="closeOverlay(event)">
  <div class="overlay-card" onclick="event.stopPropagation()">
    <div id="overlayContent"></div>
    <button class="overlay-close" onclick="hideOverlay()">Close Sheet</button>
  </div>
</div>

<div id="homeOverlay" class="overlay" onclick="closeHomeHelp(event)">
  <div class="overlay-card" onclick="event.stopPropagation()">
    <img src="lighthouse.png" class="lighthouse-img-icon" alt="Lighthouse">
    <div class="home-title">System Installer</div>
    <div class="home-steps">
      1. Open your browser options menu ⬆<br>
      2. Tap "Add to Home Screen"<br>
      3. Confirm profile link assignment
    </div>
    <button class="home-close" onclick="hideHomeHelp()">Acknowledge</button>
  </div>
</div>

<canvas id="canvas"></canvas>

<script src="data.js?v=22"></script>

<script>
const video = document.getElementById("video");
const preview = document.getElementById("preview");
const canvas = document.getElementById("canvas");

let currentIndex = 0;
let selectedYacht = yachts[0];
let capturedImage = null;

// Clean stream acquisition initializer 
navigator.mediaDevices.getUserMedia({
  video:{facingMode:{ideal:"environment"}},
  audio:false
})
.then(stream=>{
  video.srcObject = stream;
  video.setAttribute("playsinline", true);
  video.play();
})
.catch(()=>{/* Standby state if hardware blocks */});

function generateYachtSVG(name, length = 120) {
  const normalized = name ? name.toUpperCase().trim() : "UNKNOWN";
  const yachtLength = length || 120;
  
  let hullPath = "M 40 115 L 370 115 L 450 88 L 420 122 L 75 125 Z";
  let superstructure = `
    <path d="M 110 115 L 140 82 L 340 82 L 375 115 Z" fill="none" stroke="#f0d36f" stroke-width="1.75"/>
    <path d="M 160 82 L 180 56 L 295 56 L 320 82 Z" fill="none" stroke="#f0d36f" stroke-width="1.5"/>
    <path d="M 200 56 L 210 38 L 265 38 L 275 56 Z" fill="none" stroke="#f0d36f" stroke-width="1.5"/>
  `;
  let details = `
    <rect x="175" y="90" width="130" height="8" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.7"/>
    <circle cx="95" cy="120" r="1.5" fill="none" stroke="#d4af37"/><circle cx="115" cy="120" r="1.5" fill="none" stroke="#d4af37"/>
  `;

  if (normalized === "A" || normalized.includes("MOTOR YACHT A ")) {
    hullPath = "M 45 122 L 105 78 L 340 78 L 440 112 L 455 122 L 70 124 Z";
    superstructure = `
      <path d="M 155 78 L 175 48 L 280 48 L 315 78 Z" fill="none" stroke="#f0d36f" stroke-width="2" />
      <path d="M 195 48 L 205 32 L 255 32 L 265 48 Z" fill="none" stroke="#f0d36f" stroke-width="1.5" />
    `;
    details = `
      <path d="M 210 56 L 240 56 L 255 68 L 225 68 Z" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.8"/>
    `;
  }
  else if (normalized.includes("SAILING YACHT A")) {
    hullPath = "M 50 124 L 80 92 L 390 92 L 445 114 L 435 126 L 70 126 Z";
    superstructure = `
      <path d="M 130 92 L 150 70 L 350 70 L 370 92 Z" fill="none" stroke="#f0d36f" stroke-width="2" />
    `;
    details = `
      <line x1="245" y1="56" x2="240" y2="2" stroke="#f0d36f" stroke-width="2.5"/>
    `;
  } 

  return `
    <svg class="dynamic-yacht-svg" viewBox="0 0 500 160" xmlns="http://www.w3.org/2000/svg">
      <line x1="15" y1="124" x2="485" y2="124" stroke="#f0d36f" stroke-width="1.25" opacity="0.75"/>
      <g fill="none">
        <path d="${hullPath}" stroke="#f0d36f" stroke-width="2"/>
        ${superstructure}
        ${details}
      </g>
    </svg>
  `;
}

function renderDiagram(){
  if (selectedYacht) {
    document.getElementById("diagramViewer").innerHTML = generateYachtSVG(selectedYacht.name, selectedYacht.length);
  } else {
    document.getElementById("diagramViewer").innerHTML = generateYachtSVG("", 120);
  }
  renderInfo();
}

/* Formats live database profiles cleanly inside the circular telemetry gauges */
function renderInfo(){
  if(!selectedYacht) return;

  document.getElementById("vesselGaugeContent").innerHTML = `
    <a class="gauge-link vessel-name-text" href="${selectedYacht.yachtLink}" target="_blank">
      ${selectedYacht.name}
    </a>
  `;

  document.getElementById("ownerGaugeContent").innerHTML = `
    <a class="gauge-link owner-name-text" href="${selectedYacht.ownerLink}" target="_blank">
      ${selectedYacht.deepPockets}
    </a>
  `;
}

function searchYacht(){
  const q = document.getElementById("searchBox").value.toLowerCase().trim();
  if(!q) return;

  let index = yachts.findIndex(y => y.name.toLowerCase() === q);
  if(index < 0){
    index = yachts.findIndex(y => y.name.toLowerCase().startsWith(q));
  }
  if(index < 0){
    index = yachts.findIndex(y =>
      y.name.toLowerCase().includes(q) ||
      y.deepPockets.toLowerCase().includes(q)
    );
  }

  if(index >= 0){
    currentIndex = index;
    selectedYacht = yachts[index];
    renderDiagram();
  }
}

/* Captures photo from left eye lens viewport and unlocks logging hardware */
function captureLivePhoto() {
  if(!video.videoWidth || !video.videoHeight){
    updateTicker("Camera initializing...", true);
    return;
  }
  
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  
  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  capturedImage = canvas.toDataURL("image/jpeg", 0.85);
  
  preview.src = capturedImage;
  preview.style.display = "block";
  video.style.display = "none";
  document.getElementById("retakeButton").style.display = "block";

  // UNLOCK MECHANISM: Arm the Log Dial status configuration
  const logDial = document.getElementById("logDial");
  const light = document.getElementById("statusLight");
  logDial.classList.remove("locked-dial");
  light.classList.add("armed");
  
  updateTicker("Photo Captured. Log Dial Armed.");
}

function browseDatabaseNext(){
  currentIndex = (currentIndex + 1) % yachts.length;
  selectedYacht = yachts[currentIndex];
  
  document.getElementById("searchBox").value = selectedYacht.name;
  renderDiagram();
}

function retakePhoto(){
  capturedImage = null;
  preview.src = "";
  preview.style.display = "none";
  video.style.display = "block";
  document.getElementById("retakeButton").style.display = "none";

  // LOCK MECHANISM: Return log system to safe default state
  const logDial = document.getElementById("logDial");
  const light = document.getElementById("statusLight");
  logDial.classList.add("locked-dial");
  light.classList.remove("armed");
  
  updateTicker("System Armed: Photo Required to Log");
}

function updateTicker(msg, isError = false) {
  const ticker = document.getElementById("consoleTicker");
  ticker.innerText = msg;
  if(isError) {
    ticker.classList.add("error-alert");
  } else {
    ticker.classList.remove("error-alert");
  }
}

/* Execution validation pipeline handles duplicate filtering and hardware blocks */
function triggerLogCommit() {
  // 1. Strict Enforce: Block action if no active photo frame exists
  if (!capturedImage) {
    updateTicker("Capture Locked: Take photo first!", true);
    return;
  }

  // 2. Strict Enforce: Query localStorage array to block double logging
  const currentFleet = JSON.parse(localStorage.getItem("fleet") || "[]");
  const alreadyLogged = currentFleet.some(item => item.name.toLowerCase() === selectedYacht.name.toLowerCase());

  if (alreadyLogged) {
    updateTicker(`Rejected: ${selectedYacht.name} is already logged!`, true);
    return;
  }

  // If validation rules clear, run native logging sequence
  gotYacht();
}

function gotYacht(){
  const sightings = JSON.parse(localStorage.getItem("fleet") || "[]");
  sightings.unshift({
    name: selectedYacht.name,
    deepPockets: selectedYacht.deepPockets,
    yachtLink: selectedYacht.yachtLink,
    ownerLink: selectedYacht.ownerLink,
    asset: capturedImage // Enforced live camera snapshot frame exclusively
  });

  localStorage.setItem("fleet", JSON.stringify(sightings));
  renderFleet();
  updateTicker(`Success: ${selectedYacht.name} logged into fleet.`);
  
  // Clear camera state for next tracking match automatically
  retakePhoto();
}

function renderFleet(){
  const sightings = JSON.parse(localStorage.getItem("fleet") || "[]");
  const area = document.getElementById("fleetArea");

  if(!sightings.length){
    area.style.display = "none";
    area.innerHTML = "";
    return;
  }

  area.style.display = "block";

  let html = `<div class="fleet-row">`;

  sightings.forEach((s,index)=>{
    html += `
      <div class="fleet-card" onclick="openFleet(${index})">
        <div class="fleet-porthole">
          <div class="porthole-asset-frame">
             <img src="${s.asset}" alt="Vessel snapshot photo">
          </div>
        </div>
        <div class="fleet-name">${s.name}</div>
      </div>
    `;
  });

  html += `</div>`;
  area.innerHTML = html;
}

function openFleet(index){
  const sightings = JSON.parse(localStorage.getItem("fleet") || "[]");
  const s = sightings[index];

  document.getElementById("overlayContent").innerHTML = `
    <div style="font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:700; color:var(--gold); margin-bottom:4px;">
      ${s.name}
    </div>
    <div style="font-family:'Cormorant Garamond',serif; font-size:18px; color:var(--mist); margin-bottom:12px;">
      Owner: ${s.deepPockets}
    </div>
    <div class="overlay-img-frame">
       <img src="${s.asset}" alt="Logged vessel snapshot image">
    </div>
  `;

  document.getElementById("overlay").style.display = "block";
}

function hideOverlay(){
  document.getElementById("overlay").style.display = "none";
}

function closeOverlay(e){
  if(e.target.id === "overlay") hideOverlay();
}

function showHomeHelp(){
  document.getElementById("homeOverlay").style.display = "block";
}

function hideHomeHelp(){
  document.getElementById("homeOverlay").style.display = "none";
}

function closeHomeHelp(e){
  if(e.target.id === "homeOverlay") hideHomeHelp();
}

function updateInstallFooter(){
  const standalone =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;

  const footer = document.getElementById("installFooter");
  if(footer){
    footer.style.display = standalone ? "none" : "block";
  }
}

renderDiagram();
renderFleet();
updateInstallFooter();
</script>

</body>
</html>
