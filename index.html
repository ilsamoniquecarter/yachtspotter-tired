<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YachtSpotter Majorca</title>

<link rel="manifest" href="manifest.json" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#07182f;
  --navy-dark:#020812;
  --gold:#d4af37;
  --brass:#b9932e;
  --mist:#b8c3d6;
  --glass:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.11);
}

*{box-sizing:border-box;}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter,sans-serif;
  background:
    radial-gradient(circle at top,#12305a 0%,#07182f 36%,#020812 100%);
  color:white;
}

/* MAIN BINOCULARS */

.binocular-stage{
  width:min(96vw,760px);
  margin:72px auto 0;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
}

.binoculars{
  width:min(94vw,720px);
  height:min(48vw,330px);
  position:relative;
}

.bridge{
  position:absolute;
  left:50%;
  top:44%;
  width:18%;
  height:22%;
  transform:translate(-50%,-50%);
  border-radius:999px;
  background:
    radial-gradient(circle at 28% 24%,rgba(255,255,255,.42),transparent 22%),
    linear-gradient(145deg,#f8df83 0%,#d4af37 34%,#9d7624 70%,#47320c 100%);
  box-shadow:
    0 16px 32px rgba(0,0,0,.48),
    inset 0 4px 7px rgba(255,255,255,.36),
    inset 0 -8px 13px rgba(0,0,0,.45);
  z-index:1;
}

.barrel{
  position:absolute;
  top:0;
  width:48%;
  height:100%;
  border-radius:50%;
  padding:3.3%;
  background:
    radial-gradient(circle at 27% 17%,rgba(255,255,255,.55),transparent 13%),
    radial-gradient(circle at 72% 82%,rgba(0,0,0,.36),transparent 30%),
    linear-gradient(145deg,#ffe990 0%,#d4af37 30%,#a57b23 58%,#47320c 100%);
  box-shadow:
    0 28px 60px rgba(0,0,0,.54),
    inset 0 5px 9px rgba(255,255,255,.44),
    inset 0 -11px 16px rgba(0,0,0,.48);
  z-index:2;
}

.barrel-left{left:1.5%;}
.barrel-right{right:1.5%;}

.lens{
  width:100%;
  height:100%;
  border-radius:50%;
  overflow:hidden;
  background:#06101f;
  border:2px solid rgba(255,255,255,.15);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    inset 0 0 36px rgba(0,0,0,.86),
    inset 0 0 7px rgba(212,175,55,.48);
}

video,.preview{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.preview{display:none;}

#diagramViewer{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,rgba(212,175,55,.08),transparent 55%),
    #06101f;
}

.fallback-yacht{
  width:84%;
  height:84%;
}

/* SPOT / SEARCH */

.spot-section{
  width:min(88vw,520px);
  margin:42px auto 42px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.camera-button{
  width:46px;
  height:46px;
  border-radius:50%;
  border:none;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 30% 22%,rgba(255,255,255,.44),transparent 18%),
    linear-gradient(145deg,#f0d36f,#d4af37 36%,#b9932e 70%,#674d17);
  color:#06101f;
  font-size:19px;
  box-shadow:
    0 9px 18px rgba(0,0,0,.28),
    inset 0 2px 4px rgba(255,255,255,.28),
    inset 0 -4px 7px rgba(0,0,0,.25);
  cursor:pointer;
}

.spot-plaque{
  margin-top:15px;
  padding:10px 28px;
  border-radius:999px;
  font-family:"Cormorant Garamond",serif;
  font-size:19px;
  letter-spacing:1.6px;
  color:#06101f;
  background:
    linear-gradient(145deg,#f0d36f,#d4af37 36%,#b9932e 70%,#674d17);
  box-shadow:0 8px 18px rgba(0,0,0,.22);
}

.search{
  margin-top:18px;
  width:min(72vw,280px);
  height:44px;
  padding:0 15px;
  border-radius:999px;
  border:1px solid rgba(212,175,55,.32);
  background:rgba(2,8,18,.78);
  color:white;
  font-size:12px;
  outline:none;
  text-align:center;
}

.search::placeholder{
  color:rgba(184,195,214,.72);
}

.retake{
  margin-top:8px;
  color:var(--mist);
  font-size:12px;
  cursor:pointer;
  text-align:center;
}

/* IDENTIFICATION */

.info-card{
  width:min(88vw,520px);
  margin:0 auto 44px;
  padding:0;
  background:transparent;
  border:none;
  text-align:center;
}

.vessel-hull{
  display:block;
  width:min(78vw,380px);
  margin:0 auto 16px;
  padding:13px 24px 15px;
  text-decoration:none;
  color:#06101f;
  font-family:"Cormorant Garamond",serif;
  font-size:26px;
  line-height:1;
  letter-spacing:1px;
  background:
    linear-gradient(145deg,#f0d36f,#d4af37 36%,#b9932e 70%,#674d17);
  clip-path:polygon(9% 0%,91% 0%,100% 48%,91% 100%,9% 100%,0% 48%);
  box-shadow:0 10px 22px rgba(0,0,0,.24);
}

.owner-plaque{
  display:inline-block;
  min-width:min(72vw,320px);
  padding:10px 20px;
  border-radius:999px;
  border:1px solid rgba(212,175,55,.42);
  background:rgba(6,16,31,.58);
  color:var(--gold);
  text-decoration:none;
  font-family:"Cormorant Garamond",serif;
  font-size:21px;
  line-height:1.05;
}

.got-button{
  width:min(78vw,380px);
  margin:30px auto 0;
  padding:12px;
  border-radius:999px;
  border:none;
  background:
    linear-gradient(145deg,#f0d36f,#d4af37 36%,#b9932e 70%,#674d17);
  color:#06101f;
  font-family:"Cormorant Garamond",serif;
  font-weight:700;
  font-size:20px;
  letter-spacing:1.2px;
  box-shadow:0 8px 18px rgba(0,0,0,.22);
  cursor:pointer;
}

/* GOT YACHT COLLECTION */

.spotted-section{
  width:min(88vw,520px);
  margin:18px auto 54px;
  display:none;
}

.spotted-heading{
  font-family:"Cormorant Garamond",serif;
  font-size:21px;
  letter-spacing:3px;
  color:var(--gold);
  text-align:center;
  margin-bottom:13px;
}

.fleet-row{
  display:flex;
  gap:13px;
  overflow-x:auto;
  padding:0 6px 8px;
}

.fleet-card{
  min-width:96px;
}

.fleet-porthole{
  width:86px;
  height:86px;
  border-radius:50%;
  padding:6px;
  background:
    linear-gradient(145deg,#f0d36f,#d4af37,#b9932e,#674d17);
}

.fleet-porthole img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
}

.fleet-name{
  margin-top:7px;
  text-align:center;
  font-family:"Cormorant Garamond",serif;
  font-size:15px;
}

/* OVERLAY */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(2,8,18,.9);
  backdrop-filter:blur(10px);
  display:none;
  z-index:50;
  padding:18px;
}

.overlay-card{
  max-width:420px;
  margin:40px auto;
  border-radius:26px;
  background:linear-gradient(180deg,#0a1d37,#020812);
  border:1px solid rgba(212,175,55,.3);
  padding:18px;
  text-align:center;
}

.overlay-img{
  width:100%;
  border-radius:20px;
  margin-top:15px;
}

.overlay-close,
.home-close{
  width:100%;
  margin-top:16px;
  padding:10px;
  border-radius:999px;
  background:
    linear-gradient(145deg,#f0d36f,#d4af37 36%,#b9932e 70%,#674d17);
  color:#06101f;
  border:none;
  font-family:"Cormorant Garamond",serif;
  font-weight:700;
  font-size:16px;
  letter-spacing:1px;
}

.home-title{
  font-family:"Cormorant Garamond",serif;
  font-size:30px;
  color:var(--gold);
  margin-bottom:16px;
}

.home-steps{
  color:var(--mist);
  font-size:15px;
  line-height:1.8;
}

/* LIGHTHOUSE FOOTER */

.install{
  text-align:center;
  margin:82px auto 42px;
  color:var(--mist);
  font-family:"Cormorant Garamond",serif;
  font-size:17px;
  letter-spacing:.6px;
  cursor:pointer;
}

.lighthouse{
  width:58px;
  height:58px;
  margin:0 auto 11px;
  position:relative;
  border-radius:50%;
  background:
    radial-gradient(circle at 30% 22%,rgba(255,255,255,.44),transparent 18%),
    linear-gradient(145deg,#f0d36f,#d4af37 36%,#b9932e 70%,#674d17);
  box-shadow:
    0 13px 24px rgba(0,0,0,.35),
    inset 0 2px 4px rgba(255,255,255,.28),
    inset 0 -5px 8px rgba(0,0,0,.28);
}

.lighthouse::before{
  content:"";
  position:absolute;
  left:22px;
  top:13px;
  width:14px;
  height:30px;
  background:#06101f;
  clip-path:polygon(30% 0%,70% 0%,100% 100%,0% 100%);
  opacity:.9;
}

.lighthouse::after{
  content:"";
  position:absolute;
  left:18px;
  top:9px;
  width:22px;
  height:9px;
  border-radius:2px;
  background:#06101f;
  opacity:.9;
}

canvas{display:none;}

@media(max-width:560px){
  .binocular-stage{
    margin-top:62px;
  }

  .binoculars{
    height:min(49vw,230px);
  }

  .barrel{
    padding:2.8%;
  }

  .spot-section{
    margin-top:38px;
    margin-bottom:42px;
  }

  .vessel-hull{
    font-size:23px;
  }

  .owner-plaque{
    font-size:19px;
  }

  .install{
    margin-top:86px;
  }
}
</style>
</head>

<body>

<div class="binocular-stage">
  <div class="binoculars">
    <div class="bridge"></div>

    <div class="barrel barrel-left">
      <div class="lens">
        <video id="video" autoplay playsinline muted></video>
        <img id="preview" class="preview" alt="Captured yacht">
      </div>
    </div>

    <div class="barrel barrel-right">
      <div class="lens">
        <div id="diagramViewer"></div>
      </div>
    </div>
  </div>
</div>

<div class="spot-section">
  <button class="camera-button" onclick="spotYacht()">📷</button>
  <div id="retakeButton" class="retake" onclick="retakePhoto()" style="display:none;">Retake</div>

  <div class="spot-plaque">SPOT YACHT</div>

  <input
    id="searchBox"
    class="search"
    placeholder="Vessel name"
    oninput="searchYacht()"
    autocorrect="off"
    autocapitalize="none"
    spellcheck="false"
    autocomplete="off"
  />
</div>

<div id="infoCard" class="info-card"></div>
<div id="fleetArea" class="spotted-section"></div>

<div id="installFooter" class="install" onclick="showHomeHelp()">
  <div class="lighthouse"></div>
  Add YachtSpotter<br>to Home Screen
</div>

<div id="overlay" class="overlay" onclick="closeOverlay(event)">
  <div class="overlay-card" onclick="event.stopPropagation()">
    <div id="overlayContent"></div>
    <button class="overlay-close" onclick="hideOverlay()">Close</button>
  </div>
</div>

<div id="homeOverlay" class="overlay" onclick="closeHomeHelp(event)">
  <div class="overlay-card" onclick="event.stopPropagation()">
    <div class="lighthouse"></div>
    <div class="home-title">Add YachtSpotter<br>to Home Screen</div>
    <div class="home-steps">
      1. Tap Share ⬆<br>
      2. Tap Add to Home Screen<br>
      3. Tap Add
    </div>
    <button class="home-close" onclick="hideHomeHelp()">GOT IT</button>
  </div>
</div>

<canvas id="canvas"></canvas>

<script src="data.js?v=22"></script>

<script>
const video = document.getElementById("video");
const preview = document.getElementById("preview");
const canvas = document.getElementById("canvas");

let currentIndex = 0;
let selectedYacht = yachts[0];
let capturedImage = null;

navigator.mediaDevices.getUserMedia({
  video:{facingMode:{ideal:"environment"}},
  audio:false
})
.then(stream=>{video.srcObject=stream;})
.catch(()=>{alert("Camera unavailable.");});

function fallbackYacht(){
  return `
    <svg class="fallback-yacht" viewBox="0 0 500 160" xmlns="http://www.w3.org/2000/svg">
      <line x1="30" y1="124" x2="470" y2="124" stroke="#d4af37" stroke-width="1" opacity=".45"/>
      <path d="M48 112 L386 112 L452 88 L423 127 L84 131 Z" fill="none" stroke="#f0d36f" stroke-width="4"/>
      <path d="M122 96 C165 66 246 68 302 92 L365 92" fill="none" stroke="#f0d36f" stroke-width="4"/>
      <line x1="250" y1="32" x2="250" y2="74" stroke="#f0d36f" stroke-width="4"/>
      <circle cx="268" cy="50" r="8" fill="none" stroke="#f0d36f" stroke-width="2"/>
    </svg>
  `;
}

function renderDiagram(){
  document.getElementById("diagramViewer").innerHTML = fallbackYacht();
  renderInfo();
}

function renderInfo(){
  if(!selectedYacht) return;

  document.getElementById("infoCard").innerHTML = `
    <a class="vessel-hull" href="${selectedYacht.yachtLink}" target="_blank">
      ${selectedYacht.name}
    </a>

    <a class="owner-plaque" href="${selectedYacht.ownerLink}" target="_blank">
      ◇ ${selectedYacht.deepPockets} ◇
    </a>

    <button class="got-button" onclick="gotYacht()">GOT YACHT!</button>
  `;
}

function searchYacht(){
  const q = document.getElementById("searchBox").value.toLowerCase().trim();
  if(!q) return;

  let index = yachts.findIndex(y => y.name.toLowerCase() === q);

  if(index < 0){
    index = yachts.findIndex(y => y.name.toLowerCase().startsWith(q));
  }

  if(index < 0){
    index = yachts.findIndex(y =>
      y.name.toLowerCase().includes(q) ||
      y.deepPockets.toLowerCase().includes(q)
    );
  }

  if(index >= 0){
    currentIndex = index;
    selectedYacht = yachts[index];
    renderDiagram();
  }
}

function spotYacht(){
  if(!video.videoWidth){
    alert("Camera loading.");
    return;
  }

  const ctx = canvas.getContext("2d");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video,0,0,canvas.width,canvas.height);

  capturedImage = canvas.toDataURL("image/jpeg",0.7);
  preview.src = capturedImage;
  preview.style.display = "block";
  video.style.display = "none";
  document.getElementById("retakeButton").style.display = "block";
}

function retakePhoto(){
  capturedImage = null;
  preview.src = "";
  preview.style.display = "none";
  video.style.display = "block";
  document.getElementById("retakeButton").style.display = "none";
}

function gotYacht(){
  if(!capturedImage){
    alert("Capture yacht photo first.");
    return;
  }

  const sightings = JSON.parse(localStorage.getItem("fleet") || "[]");

  sightings.unshift({
    name:selectedYacht.name,
    deepPockets:selectedYacht.deepPockets,
    yachtLink:selectedYacht.yachtLink,
    ownerLink:selectedYacht.ownerLink,
    image:capturedImage
  });

  localStorage.setItem("fleet",JSON.stringify(sightings));
  renderFleet();
}

function renderFleet(){
  const sightings = JSON.parse(localStorage.getItem("fleet") || "[]");
  const area = document.getElementById("fleetArea");

  if(!sightings.length){
    area.style.display = "none";
    area.innerHTML = "";
    return;
  }

  area.style.display = "block";

  let html = `
    <div class="spotted-heading">GOT YACHT!</div>
    <div class="fleet-row">
  `;

  sightings.forEach((s,index)=>{
    html += `
      <div class="fleet-card" onclick="openFleet(${index})">
        <div class="fleet-porthole"><img src="${s.image}" alt="${s.name}"></div>
        <div class="fleet-name">${s.name}</div>
      </div>
    `;
  });

  html += `</div>`;
  area.innerHTML = html;
}

function openFleet(index){
  const sightings = JSON.parse(localStorage.getItem("fleet") || "[]");
  const s = sightings[index];

  document.getElementById("overlayContent").innerHTML = `
    <a class="vessel-hull" href="${s.yachtLink}" target="_blank">
      ${s.name}
    </a>

    <a class="owner-plaque" href="${s.ownerLink}" target="_blank">
      ◇ ${s.deepPockets} ◇
    </a>

    <img class="overlay-img" src="${s.image}" alt="${s.name}">
  `;

  document.getElementById("overlay").style.display = "block";
}

function hideOverlay(){
  document.getElementById("overlay").style.display = "none";
}

function closeOverlay(e){
  if(e.target.id === "overlay") hideOverlay();
}

function showHomeHelp(){
  document.getElementById("homeOverlay").style.display = "block";
}

function hideHomeHelp(){
  document.getElementById("homeOverlay").style.display = "none";
}

function closeHomeHelp(e){
  if(e.target.id === "homeOverlay") hideHomeHelp();
}

function updateInstallFooter(){
  const standalone =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;

  const footer = document.getElementById("installFooter");
  if(footer){
    footer.style.display = standalone ? "none" : "block";
  }
}

renderDiagram();
renderFleet();
updateInstallFooter();
</script>

</body>
</html>
