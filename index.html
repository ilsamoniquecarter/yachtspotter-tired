<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YachtSpotter Majorca</title>

<link rel="manifest" href="manifest.json" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#07182f;
  --navy-dark:#020812;
  --gold:#d4af37;
  --brass:#b9932e;
  --mist:#b8c3d6;
  --glass:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.11);
}

*{box-sizing:border-box;}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter,sans-serif;
  background:
    radial-gradient(circle at top,#12305a 0%,#07182f 36%,#020812 100%);
  color:white;
}

/* MAIN BINOCULARS */

.binocular-stage{
  width:min(96vw,760px);
  margin:72px auto 0;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
}

.binoculars{
  width:min(94vw,720px);
  height:min(48vw,330px);
  position:relative;
}

.bridge{
  position:absolute;
  left:50%;
  top:44%;
  width:18%;
  height:22%;
  transform:translate(-50%,-50%);
  border-radius:999px;
  background:
    radial-gradient(circle at 28% 24%,rgba(255,255,255,.42),transparent 22%),
    linear-gradient(145deg,#f8df83 0%,#d4af37 34%,#9d7624 70%,#47320c 100%);
  box-shadow:
    0 16px 32px rgba(0,0,0,.48),
    inset 0 4px 7px rgba(255,255,255,.36),
    inset 0 -8px 13px rgba(0,0,0,.45);
  z-index:1;
}

.barrel{
  position:absolute;
  top:0;
  width:48%;
  height:100%;
  border-radius:50%;
  padding:3.3%;
  background:
    radial-gradient(circle at 27% 17%,rgba(255,255,255,.55),transparent 13%),
    radial-gradient(circle at 72% 82%,rgba(0,0,0,.36),transparent 30%),
    linear-gradient(145deg,#ffe990 0%,#d4af37 30%,#a57b23 58%,#47320c 100%);
  box-shadow:
    0 28px 60px rgba(0,0,0,.54),
    inset 0 5px 9px rgba(255,255,255,.44),
    inset 0 -11px 16px rgba(0,0,0,.48);
  z-index:2;
}

.barrel-left{left:1.5%;}
.barrel-right{right:1.5%;}

.lens{
  width:100%;
  height:100%;
  border-radius:50%;
  overflow:hidden;
  background:#06101f;
  border:2px solid rgba(255,255,255,.15);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    inset 0 0 36px rgba(0,0,0,.86),
    inset 0 0 7px rgba(212,175,55,.48);
}

video,.preview{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.preview{display:none;}

#diagramViewer{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,rgba(212,175,55,.08),transparent 55%),
    #06101f;
}

.dynamic-yacht-svg{
  width:90%;
  height:90%;
}

/* SPOT / SEARCH */

.spot-section{
  width:min(88vw,520px);
  margin:42px auto 42px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.camera-button{
  width:46px;
  height:46px;
  border-radius:50%;
  border:none;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 30% 22%,rgba(255,255,255,.44),transparent 18%),
    linear-gradient(145deg,#f0d36f,#d4af37 36%,#b9932e 70%,#674d17);
  color:#06101f;
  font-size:19px;
  box-shadow:
    0 9px 18px rgba(0,0,0,.28),
    inset 0 2px 4px rgba(255,255,255,.28),
    inset 0 -4px 7px rgba(0,0,0,.25);
  cursor:pointer;
}

.spot-plaque{
  margin-top:15px;
  padding:10px 28px;
  border-radius:999px;
  font-family:"Cormorant Garamond",serif;
  font-size:19px;
  letter-spacing:1.6px;
  color:#06101f;
  background:
    linear-gradient(145deg,#f0d36f,#d4af37 36%,#b9932e 70%,#674d17);
  box-shadow:0 8px 18px rgba(0,0,0,.22);
}

.search{
  margin-top:18px;
  width:min(72vw,280px);
  height:44px;
  padding:0 15px;
  border-radius:999px;
  border:1px solid rgba(212,175,55,.32);
  background:rgba(2,8,18,.78);
  color:white;
  font-size:12px;
  outline:none;
  text-align:center;
}

.search::placeholder{
  color:rgba(184,195,214,.72);
}

.retake{
  margin-top:8px;
  color:var(--mist);
  font-size:12px;
  cursor:pointer;
  text-align:center;
}

/* IDENTIFICATION */

.info-card{
  width:min(88vw,520px);
  margin:0 auto 44px;
  padding:0;
  background:transparent;
  border:none;
  text-align:center;
}

.vessel-hull{
  display:block;
  width:min(78vw,380px);
  margin:0 auto 16px;
  padding:13px 24px 15px;
  text-decoration:none;
  color:#06101f;
  font-family:"Cormorant Garamond",serif;
  font-size:26px;
  line-height:1;
  letter-spacing:1px;
  background:
    linear-gradient(145deg,#f0d36f,#d4af37 36%,#b9932e 70%,#674d17);
  clip-path:polygon(9% 0%,91% 0%,100% 48%,91% 100%,9% 100%,0% 48%);
  box-shadow:0 10px 22px rgba(0,0,0,.24);
}

.owner-plaque{
  display:inline-block;
  min-width:min(72vw,320px);
  padding:10px 20px;
  border-radius:999px;
  border:1px solid rgba(212,175,55,.42);
  background:rgba(6,16,31,.58);
  color:var(--gold);
  text-decoration:none;
  font-family:"Cormorant Garamond",serif;
  font-size:21px;
  line-height:1.05;
}

.got-button{
  width:min(78vw,380px);
  margin:30px auto 0;
  padding:12px;
  border-radius:999px;
  border:none;
  background:
    linear-gradient(145deg,#f0d36f,#d4af37 36%,#b9932e 70%,#674d17);
  color:#06101f;
  font-family:"Cormorant Garamond",serif;
  font-weight:700;
  font-size:20px;
  letter-spacing:1.2px;
  box-shadow:0 8px 18px rgba(0,0,0,.22);
  cursor:pointer;
}

/* GOT YACHT COLLECTION */

.spotted-section{
  width:min(88vw,520px);
  margin:18px auto 54px;
  display:none;
}

.spotted-heading{
  font-family:"Cormorant Garamond",serif;
  font-size:21px;
  letter-spacing:3px;
  color:var(--gold);
  text-align:center;
  margin-bottom:13px;
}

.fleet-row{
  display:flex;
  gap:13px;
  overflow-x:auto;
  padding:0 6px 8px;
}

.fleet-card{
  min-width:96px;
}

.fleet-porthole{
  width:86px;
  height:86px;
  border-radius:50%;
  padding:6px;
  background:
    linear-gradient(145deg,#f0d36f,#d4af37,#b9932e,#674d17);
}

.fleet-porthole img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
}

.fleet-name{
  margin-top:7px;
  text-align:center;
  font-family:"Cormorant Garamond",serif;
  font-size:15px;
}

/* OVERLAY */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(2,8,18,.9);
  backdrop-filter:blur(10px);
  display:none;
  z-index:50;
  padding:18px;
}

.overlay-card{
  max-width:420px;
  margin:40px auto;
  border-radius:26px;
  background:linear-gradient(180deg,#0a1d37,#020812);
  border:1px solid rgba(212,175,55,.3);
  padding:18px;
  text-align:center;
}

.overlay-img{
  width:100%;
  border-radius:20px;
  margin-top:15px;
}

.overlay-close,
.home-close{
  width:100%;
  margin-top:16px;
  padding:10px;
  border-radius:999px;
  background:
    linear-gradient(145deg,#f0d36f,#d4af37 36%,#b9932e 70%,#674d17);
  color:#06101f;
  border:none;
  font-family:"Cormorant Garamond",serif;
  font-weight:700;
  font-size:16px;
  letter-spacing:1px;
}

.home-title{
  font-family:"Cormorant Garamond",serif;
  font-size:30px;
  color:var(--gold);
  margin-bottom:16px;
}

.home-steps{
  color:var(--mist);
  font-size:15px;
  line-height:1.8;
}

/* LIGHTHOUSE FOOTER */

.install{
  text-align:center;
  margin:82px auto 42px;
  color:var(--mist);
  font-family:"Cormorant Garamond",serif;
  font-size:17px;
  letter-spacing:.6px;
  cursor:pointer;
}

.lighthouse{
  width:58px;
  height:58px;
  margin:0 auto 11px;
  position:relative;
  border-radius:50%;
  background:
    radial-gradient(circle at 30% 22%,rgba(255,255,255,.44),transparent 18%),
    linear-gradient(145deg,#f0d36f,#d4af37 36%,#b9932e 70%,#674d17);
  box-shadow:
    0 13px 24px rgba(0,0,0,.35),
    inset 0 2px 4px rgba(255,255,255,.28),
    inset 0 -5px 8px rgba(0,0,0,.28);
}

.lighthouse::before{
  content:"";
  position:absolute;
  left:22px;
  top:13px;
  width:14px;
  height:30px;
  background:#06101f;
  clip-path:polygon(30% 0%,70% 0%,100% 100%,0% 100%);
  opacity:.9;
}

.lighthouse::after{
  content:"";
  position:absolute;
  left:18px;
  top:9px;
  width:22px;
  height:9px;
  border-radius:2px;
  background:#06101f;
  opacity:.9;
}

canvas{display:none;}

@media(max-width:560px){
  .binocular-stage{
    margin-top:62px;
  }

  .binoculars{
    height:min(49vw,230px);
  }

  .barrel{
    padding:2.8%;
  }

  .spot-section{
    margin-top:38px;
    margin-bottom:42px;
  }

  .vessel-hull{
    font-size:23px;
  }

  .owner-plaque{
    font-size:19px;
  }

  .install{
    margin-top:86px;
  }
}
</style>
</head>

<body>

<div class="binocular-stage">
  <div class="binoculars">
    <div class="bridge"></div>

    <div class="barrel barrel-left">
      <div class="lens">
        <video id="video" autoplay playsinline muted></video>
        <img id="preview" class="preview" alt="Captured yacht">
      </div>
    </div>

    <div class="barrel barrel-right">
      <div class="lens">
        <div id="diagramViewer"></div>
      </div>
    </div>
  </div>
</div>

<div class="spot-section">
  <button class="camera-button" onclick="spotYacht()">📷</button>
  <div id="retakeButton" class="retake" onclick="retakePhoto()" style="display:none;">Retake</div>

  <div class="spot-plaque">SPOT YACHT</div>

  <input
    id="searchBox"
    class="search"
    placeholder="Vessel name"
    oninput="searchYacht()"
    autocorrect="off"
    autocapitalize="none"
    spellcheck="false"
    autocomplete="off"
  />
</div>

<div id="infoCard" class="info-card"></div>
<div id="fleetArea" class="spotted-section"></div>

<div id="installFooter" class="install" onclick="showHomeHelp()">
  <div class="lighthouse"></div>
  Add YachtSpotter<br>to Home Screen
</div>

<div id="overlay" class="overlay" onclick="closeOverlay(event)">
  <div class="overlay-card" onclick="event.stopPropagation()">
    <div id="overlayContent"></div>
    <button class="overlay-close" onclick="hideOverlay()">Close</button>
  </div>
</div>

<div id="homeOverlay" class="overlay" onclick="closeHomeHelp(event)">
  <div class="overlay-card" onclick="event.stopPropagation()">
    <div class="lighthouse"></div>
    <div class="home-title">Add YachtSpotter<br>to Home Screen</div>
    <div class="home-steps">
      1. Tap Share ⬆<br>
      2. Tap Add to Home Screen<br>
      3. Tap Add
    </div>
    <button class="home-close" onclick="hideHomeHelp()">GOT IT</button>
  </div>
</div>

<canvas id="canvas"></canvas>

<script src="data.js?v=22"></script>

<script>
const video = document.getElementById("video");
const preview = document.getElementById("preview");
const canvas = document.getElementById("canvas");

let currentIndex = 0;
let selectedYacht = yachts[0];
let capturedImage = null;

navigator.mediaDevices.getUserMedia({
  video:{facingMode:{ideal:"environment"}},
  audio:false
})
.then(stream=>{video.srcObject=stream;})
.catch(()=>{alert("Camera unavailable.");});

// Path 2: Ultra-Detailed Technical Blueprint Engine
function generateYachtSVG(name, length = 120) {
  const normalized = name ? name.toUpperCase().trim() : "UNKNOWN";
  
  // Safe fallback length if data.js doesn't provide it
  const yachtLength = length || 120;
  
  // Base structural vectors
  let hullPath = "M 40 115 L 370 115 L 450 88 L 420 122 L 75 125 Z";
  let superstructure = `
    <!-- Main Deck House -->
    <path d="M 110 115 L 140 82 L 340 82 L 375 115 Z" fill="none" stroke="#f0d36f" stroke-width="2"/>
    <!-- Bridge Deck -->
    <path d="M 160 82 L 180 58 L 295 58 L 320 82 Z" fill="none" stroke="#f0d36f" stroke-width="1.5"/>
    <!-- Sun Deck & Radar Arch -->
    <path d="M 200 58 L 210 42 L 265 42 L 275 58 Z" fill="none" stroke="#f0d36f" stroke-width="1.5"/>
    <path d="M 255 42 L 265 24 L 275 24 L 270 42" fill="none" stroke="#f0d36f" stroke-width="1"/>
  `;
  let details = `
    <!-- Corporate Window Bands -->
    <rect x="175" y="90" width="130" height="8" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.7"/>
    <rect x="200" y="66" width="65" height="6" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.7"/>
    <!-- Portholes -->
    <circle cx="95" cy="120" r="2" fill="#d4af37"/><circle cx="115" cy="120" r="2" fill="#d4af37"/><circle cx="135" cy="120" r="2" fill="#d4af37"/>
  `;

  // 1. Futuristic Hull Architectures (e.g., Motor Yacht A)
  if (normalized === "A" || normalized.includes("MOTOR YACHT A ")) {
    hullPath = "M 45 122 L 105 78 L 340 78 L 440 112 L 455 122 L 70 124 Z";
    superstructure = `
      <!-- Inverted Superstructure pyramid -->
      <path d="M 155 78 L 175 48 L 280 48 L 315 78 Z" fill="none" stroke="#f0d36f" stroke-width="2" />
      <path d="M 195 48 L 205 32 L 255 32 L 265 48 Z" fill="none" stroke="#f0d36f" stroke-width="1.5" />
    `;
    details = `
      <!-- Angular glass slash patterns -->
      <path d="M 210 58 L 240 58 L 255 70 L 225 70 Z" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.8"/>
      <line x1="105" y1="78" x2="440" y2="112" stroke="#d4af37" stroke-width="1" stroke-dasharray="2,2" opacity="0.4"/>
    `;
  }
  
  // 2. High-Mast Dynarig / Sailing Superyachts (Sailing Yacht A, Maltese Falcon, Black Pearl)
  else if (normalized.includes("SAILING YACHT A")) {
    hullPath = "M 50 124 L 80 92 L 390 92 L 445 114 L 435 126 L 70 126 Z";
    superstructure = `
      <path d="M 130 92 L 150 70 L 350 70 L 370 92 Z" fill="none" stroke="#f0d36f" stroke-width="2" />
    `;
    details = `
      <!-- Three Carbon Freestanding Masts -->
      <line x1="160" y1="70" x2="145" y2="12" stroke="#f0d36f" stroke-width="2.5"/>
      <line x1="245" y1="70" x2="240" y2="6" stroke="#f0d36f" stroke-width="2.5"/>
      <line x1="330" y1="70" x2="325" y2="12" stroke="#f0d36f" stroke-width="2.5"/>
      <!-- Curved structural sail tracks -->
      <path d="M 145 12 Q 180 40 160 70 M 240 6 Q 285 35 245 70 M 325 12 Q 365 40 330 70" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
    `;
  } 
  else if (normalized.includes("MALTESE FALCON") || normalized.includes("BLACK PEARL")) {
    hullPath = "M 42 118 L 58 96 L 410 96 L 452 80 L 415 124 Z";
    superstructure = `<path d="M 160 96 L 175 80 L 340 80 L 360 96 Z" fill="none" stroke="#f0d36f" stroke-width="2"/>`;
    details = `
      <!-- Falcon Dynarig System -->
      <g stroke="#f0d36f" fill="none">
        <line x1="145" y1="96" x2="145" y2="20" stroke-width="2.5" />
        <line x1="245" y1="80" x2="245" y2="10" stroke-width="2.5" />
        <line x1="345" y1="96" x2="345" y2="20" stroke-width="2.5" />
        <!-- Intricate Curved Yards -->
        <path d="M 120 35 Q 145 42 170 35 M 115 55 Q 145 62 175 55 M 110 75 Q 145 82 180 75" stroke-width="1.5" opacity="0.9"/>
        <path d="M 220 25 Q 245 32 270 25 M 215 45 Q 245 52 275 45 M 210 65 Q 245 72 280 65" stroke-width="1.5" opacity="0.9"/>
        <path d="M 320 35 Q 345 42 370 35 M 315 55 Q 345 62 375 55 M 310 75 Q 345 82 380 75" stroke-width="1.5" opacity="0.9"/>
      </g>
    `;
  }

  // 3. Ultra-Long Ultra-Sleek Profiles (Azzam, Eclipse)
  else if (normalized === "AZZAM" || normalized === "ECLIPSE" || normalized === "NORD") {
    hullPath = "M 35 120 L 400 120 L 470 98 L 445 125 L 65 126 Z";
    superstructure = `
      <path d="M 95 120 L 135 92 L 365 92 L 400 120 Z" fill="none" stroke="#f0d36f" stroke-width="2.5" />
      <path d="M 145 92 L 175 72 L 325 72 L 350 92 Z" fill="none" stroke="#f0d36f" stroke-width="2" />
      <path d="M 190 72 L 205 56 L 290 56 L 305 72 Z" fill="none" stroke="#f0d36f" stroke-width="1.5" />
    `;
    details = `
      <!-- Tiered long window segments -->
      <line x1="155" y1="104" x2="340" y2="104" stroke="#d4af37" stroke-width="2" opacity="0.8"/>
      <line x1="190" y1="82" x2="300" y2="82" stroke="#d4af37" stroke-width="1.5" opacity="0.8"/>
    `;
  }

  // 4. Multi-Deck Gigayachts (Dilbar, Blue, Scheherazade)
  else if (["DILBAR", "BLUE", "SCHEHERAZADE", "OPERA", "DUBAI"].includes(normalized)) {
    hullPath = "M 35 122 L 385 122 L 455 92 L 425 125 L 65 127 Z";
    superstructure = `
      <!-- Heavy Commercial Multi-deck Superstructure -->
      <path d="M 85 122 L 115 80 L 355 80 L 390 122 Z" fill="none" stroke="#f0d36f" stroke-width="2.5" />
      <path d="M 130 80 L 155 56 L 325 56 L 345 80 Z" fill="none" stroke="#f0d36f" stroke-width="2" />
      <path d="M 175 56 L 195 38 L 290 38 L 305 56 Z" fill="none" stroke="#f0d36f" stroke-width="1.5" />
    `;
    details = `
      <!-- Helideck Structural Grid Callout -->
      <line x1="395" y1="110" x2="445" y2="110" stroke="#d4af37" stroke-width="1"/>
      <circle cx="420" cy="110" r="8" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="2,2"/>
      <!-- Vertical Bulkhead Accent Lines -->
      <line x1="200" y1="122" x2="200" y2="80" stroke="#d4af37" stroke-width="0.5" opacity="0.5"/>
      <line x1="280" y1="122" x2="280" y2="80" stroke="#d4af37" stroke-width="0.5" opacity="0.5"/>
    `;
  }

  // Assembly of the full Technical Blueprint Layout Frame
  return `
    <svg class="dynamic-yacht-svg" viewBox="0 0 500 160" xmlns="http://www.w3.org/2000/svg">
      <!-- Blueprint Technical Background Grid -->
      <g stroke="#d4af37" stroke-width="0.5" opacity="0.15">
        <line x1="0" y1="20" x2="500" y2="20" />
        <line x1="0" y1="40" x2="500" y2="40" />
        <line x1="0" y1="60" x2="500" y2="60" />
        <line x1="0" y1="80" x2="500" y2="80" />
        <line x1="0" y1="100" x2="500" y2="100" />
        <line x1="0" y1="140" x2="500" y2="140" />
        <line x1="50" y1="0" x2="50" y2="160" />
        <line x1="100" y1="0" x2="100" y2="160" />
        <line x1="150" y1="0" x2="150" y2="160" />
        <line x1="200" y1="0" x2="200" y2="160" />
        <line x1="250" y1="0" x2="250" y2="160" />
        <line x1="300" y1="0" x2="300" y2="160" />
        <line x1="350" y1="0" x2="350" y2="160" />
        <line x1="400" y1="0" x2="400" y2="160" />
        <line x1="450" y1="0" x2="450" y2="160" />
      </g>

      <!-- Technical Crosshairs & Corner Targets -->
      <g stroke="#f0d36f" stroke-width="0.75" opacity="0.4">
        <path d="M 15 15 L 25 15 M 15 15 L 15 25" fill="none"/>
        <path d="M 485 15 L 475 15 M 485 15 L 485 25" fill="none"/>
        <circle cx="250" cy="10" r="3" fill="none" stroke-width="0.5"/>
        <line x1="250" y1="2" x2="250" y2="18" stroke-width="0.5"/>
      </g>

      <!-- Engineering Data Callouts -->
      <g font-family="monospace" font-size="6" fill="#b8c3d6" opacity="0.6">
        <text x="25" y="28">SCALE: 1:750</text>
        <text x="25" y="36">DWG NO: YS-${normalized.substring(0,3)}-2026</text>
        <text x="410" y="28">ELEV: PROFILE_V</text>
        <text x="410" y="36">REF: BALEARICS</text>
      </g>

      <!-- Waterline Primary Baseline -->
      <line x1="15" y1="124" x2="485" y2="124" stroke="#f0d36f" stroke-width="1" opacity="0.7"/>
      <text x="450" y="132" font-family="monospace" font-size="5" fill="#f0d36f" opacity="0.5">L.W.L.</text>

      <!-- Main Render Components -->
      <g fill="none">
        <!-- Main Hull Structure -->
        <path d="${hullPath}" stroke="#f0d36f" stroke-width="2.5"/>
        <!-- Superstructure Complex -->
        ${superstructure}
        <!-- Intricate Window and Panel Work -->
        ${details}
      </g>

      <!-- Dimension Scale Bar Footer -->
      <g fill="none" stroke="#f0d36f" stroke-width="0.75" opacity="0.6">
        <line x1="50" y1="148" x2="440" y2="148" />
        <line x1="50" y1="144" x2="50" y2="152" />
        <line x1="147.5" y1="145" x2="147.5" y2="151" />
        <line x1="245" y1="145" x2="245" y2="151" />
        <line x1="342.5" y1="145" x2="342.5" y2="151" />
        <line x1="440" y1="144" x2="440" y2="152" />
      </g>

      <!-- Dimension Scale Labels -->
      <g font-family="Inter, sans-serif" font-size="7" fill="#d4af37" font-weight="500" text-anchor="middle">
        <text x="50" y="158">0m</text>
        <text x="147.5" y="158">${Math.round(yachtLength * 0.25)}m</text>
        <text x="245" y="158">${Math.round(yachtLength * 0.5)}m</text>
        <text x="342.5" y="158">${Math.round(yachtLength * 0.75)}m</text>
        <text x="440" y="158">${yachtLength}m</text>
      </g>
    </svg>
  `;
}

function renderDiagram(){
  if (selectedYacht) {
    // Passes both the yacht name and its recorded size down to the layout math
    document.getElementById("diagramViewer").innerHTML = generateYachtSVG(selectedYacht.name, selectedYacht.length);
  } else {
    document.getElementById("diagramViewer").innerHTML = generateYachtSVG("", 120);
  }
  renderInfo();
}

function renderInfo(){
  if(!selectedYacht) return;

  document.getElementById("infoCard").innerHTML = `
    <a class="vessel-hull" href="${selectedYacht.yachtLink}" target="_blank">
      ${selectedYacht.name}
    </a>

    <a class="owner-plaque" href="${selectedYacht.ownerLink}" target="_blank">
      ◇ ${selectedYacht.deepPockets} ◇
    </a>

    <button class="got-button" onclick="gotYacht()">GOT YACHT!</button>
  `;
}

function searchYacht(){
  const q = document.getElementById("searchBox").value.toLowerCase().trim();
  if(!q) return;

  let index = yachts.findIndex(y => y.name.toLowerCase() === q);

  if(index < 0){
    index = yachts.findIndex(y => y.name.toLowerCase().startsWith(q));
  }

  if(index < 0){
    index = yachts.findIndex(y =>
      y.name.toLowerCase().includes(q) ||
      y.deepPockets.toLowerCase().includes(q)
    );
  }

  if(index >= 0){
    currentIndex = index;
    selectedYacht = yachts[index];
    renderDiagram();
  }
}

function spotYacht(){
  if(!video.videoWidth){
    alert("Camera loading.");
    return;
  }

  const ctx = canvas.getContext("2d");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video,0,0,canvas.width,canvas.height);

  capturedImage = canvas.toDataURL("image/jpeg",0.7);
  preview.src = capturedImage;
  preview.style.display = "block";
  video.style.display = "none";
  document.getElementById("retakeButton").style.display = "block";
}

function retakePhoto(){
  capturedImage = null;
  preview.src = "";
  preview.style.display = "none";
  video.style.display = "block";
  document.getElementById("retakeButton").style.display = "none";
}

function gotYacht(){
  if(!capturedImage){
    alert("Capture yacht photo first.");
    return;
  }

  const sightings = JSON.parse(localStorage.getItem("fleet") || "[]");

  sightings.unshift({
    name:selectedYacht.name,
    deepPockets:selectedYacht.deepPockets,
    yachtLink:selectedYacht.yachtLink,
    ownerLink:selectedYacht.ownerLink,
    image:capturedImage
  });

  localStorage.setItem("fleet",JSON.stringify(sightings));
  renderFleet();
}

function renderFleet(){
  const sightings = JSON.parse(localStorage.getItem("fleet") || "[]");
  const area = document.getElementById("fleetArea");

  if(!sightings.length){
    area.style.display = "none";
    area.innerHTML = "";
    return;
  }

  area.style.display = "block";

  let html = `
    <div class="spotted-heading">GOT YACHT!</div>
    <div class="fleet-row">
  `;

  sightings.forEach((s,index)=>{
    html += `
      <div class="fleet-card" onclick="openFleet(${index})">
        <div class="fleet-porthole"><img src="${s.image}" alt="${s.name}"></div>
        <div class="fleet-name">${s.name}</div>
      </div>
    `;
  });

  html += `</div>`;
  area.innerHTML = html;
}

function openFleet(index){
  const sightings = JSON.parse(localStorage.getItem("fleet") || "[]");
  const s = sightings[index];

  document.getElementById("overlayContent").innerHTML = `
    <a class="vessel-hull" href="${s.yachtLink}" target="_blank">
      ${s.name}
    </a>

    <a class="owner-plaque" href="${s.ownerLink}" target="_blank">
      ◇ ${s.deepPockets} ◇
    </a>

    <img class="overlay-img" src="${s.image}" alt="${s.name}">
  `;

  document.getElementById("overlay").style.display = "block";
}

function hideOverlay(){
  document.getElementById("overlay").style.display = "none";
}

function closeOverlay(e){
  if(e.target.id === "overlay") hideOverlay();
}

function showHomeHelp(){
  document.getElementById("homeOverlay").style.display = "block";
}

function hideHomeHelp(){
  document.getElementById("homeOverlay").style.display = "none";
}

function closeHomeHelp(e){
  if(e.target.id === "homeOverlay") hideHomeHelp();
}

function updateInstallFooter(){
  const standalone =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;

  const footer = document.getElementById("installFooter");
  if(footer){
    footer.style.display = standalone ? "none" : "block";
  }
}

renderDiagram();
renderFleet();
updateInstallFooter();
</script>

</body>
</html>
