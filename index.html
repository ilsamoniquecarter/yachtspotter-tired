<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YachtSpotter Majorca</title>

<link rel="manifest" href="manifest.json" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#07182f;
  --navy-dark:#020812;
  --gold:#d4af37;
  --brass:#b9932e;
  --mist:#b8c3d6;
  --glass:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.11);
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Inter,sans-serif;
  background:radial-gradient(circle at top,#102748 0%,#020812 75%);
  color:white;
}

.header{
  padding:20px 18px 12px;
  text-align:center;
}

.brand{
  font-family:"Cormorant Garamond",serif;
  font-size:42px;
  color:var(--gold);
  line-height:1;
}

.edition{
  margin-top:4px;
  font-size:11px;
  letter-spacing:3px;
  color:var(--mist);
  text-transform:uppercase;
}

.binocular-wrap{
  display:flex;
  justify-content:center;
  gap:18px;
  padding:10px 14px 0;
  flex-wrap:wrap;
}

.scope-column{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.scope{
  width:min(42vw,320px);
  height:min(42vw,320px);
  border-radius:50%;
  padding:14px;
  background:
    radial-gradient(circle at 30% 22%,rgba(255,255,255,.32),transparent 16%),
    linear-gradient(145deg,#f0d36f,var(--gold) 30%,var(--brass) 65%,#5e4614);
  box-shadow:0 22px 50px rgba(0,0,0,.45);
}

.scope-inner{
  width:100%;
  height:100%;
  border-radius:50%;
  overflow:hidden;
  background:#06101f;
  border:2px solid rgba(255,255,255,.14);
}

video,.preview{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.preview{display:none;}

#diagramViewer{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#06101f;
}

#diagramViewer img{
  width:88%;
  height:88%;
  object-fit:contain;
}

button{
  border:none;
  cursor:pointer;
  font-family:"Cormorant Garamond",serif;
  font-weight:700;
  letter-spacing:1px;
}

.pill{
  margin-top:12px;
  padding:14px 22px;
  border-radius:999px;
  background:linear-gradient(145deg,#f0d36f,var(--gold) 35%,var(--brass) 68%,#674d17);
  color:#05101d;
  font-size:22px;
  box-shadow:0 10px 24px rgba(0,0,0,.25);
}

.search{
  width:min(92vw,720px);
  margin:22px auto 10px;
  display:block;
  padding:14px 18px;
  border-radius:999px;
  border:1px solid rgba(212,175,55,.3);
  background:rgba(2,8,18,.76);
  color:white;
  font-size:15px;
}

.info-card{
  width:min(92vw,720px);
  margin:12px auto;
  padding:18px;
  border-radius:24px;
  background:var(--glass);
  border:1px solid var(--line);
}

.info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.info-title{
  font-family:"Cormorant Garamond",serif;
  font-size:26px;
  color:var(--gold);
  text-align:center;
}

.secondary{
  width:100%;
  margin-top:12px;
  padding:11px;
  border-radius:999px;
  background:rgba(6,16,31,.74);
  color:white;
  border:1px solid rgba(212,175,55,.55);
  font-size:14px;
}

.log-button{
  width:100%;
  margin-top:16px;
  padding:14px;
  font-size:24px;
}

.fleet-title{
  width:min(92vw,720px);
  margin:28px auto 10px;
  font-family:"Cormorant Garamond",serif;
  font-size:24px;
  letter-spacing:3px;
  color:var(--gold);
}

.fleet-row{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:0 14px 28px;
}

.fleet-card{min-width:110px;}

.fleet-porthole{
  width:100px;
  height:100px;
  border-radius:50%;
  padding:7px;
  background:linear-gradient(145deg,#f0d36f,var(--gold),var(--brass),#674d17);
}

.fleet-porthole img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
}

.fleet-name{
  margin-top:8px;
  text-align:center;
  font-family:"Cormorant Garamond",serif;
  font-size:17px;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(2,8,18,.9);
  backdrop-filter:blur(10px);
  display:none;
  z-index:50;
  padding:20px;
}

.overlay-card{
  max-width:420px;
  margin:40px auto;
  border-radius:28px;
  background:linear-gradient(180deg,#0a1d37,#020812);
  border:1px solid rgba(212,175,55,.3);
  padding:16px;
}

.overlay-img{
  width:100%;
  border-radius:22px;
  margin-top:14px;
}

.lighthouse{
  width:54px;
  height:54px;
  margin:22px auto 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:linear-gradient(145deg,#f0d36f,var(--gold),var(--brass),#674d17);
  font-size:28px;
}

.install-text{
  text-align:center;
  color:var(--mist);
  font-size:13px;
  margin-bottom:34px;
}

canvas{display:none;}
</style>
</head>

<body>

<div class="header">
  <div class="brand">YachtSpotter</div>
  <div class="edition">Majorca</div>
</div>

<div class="binocular-wrap">
  <div class="scope-column">
    <div class="scope">
      <div class="scope-inner">
        <video id="video" autoplay playsinline muted></video>
        <img id="preview" class="preview">
      </div>
    </div>
    <button class="pill" onclick="spotYacht()">SPOT YACHT</button>
  </div>

  <div class="scope-column">
    <div class="scope">
      <div class="scope-inner">
        <div id="diagramViewer"></div>
      </div>
    </div>
    <button class="pill" onclick="nextYacht()">SWIPE FLEET</button>
  </div>
</div>

<input id="searchBox" class="search" placeholder="Type yacht name..." oninput="searchYacht()" />

<div id="infoCard" class="info-card"></div>
<div id="fleetArea"></div>

<div class="lighthouse">⚓</div>
<div class="install-text">Add YachtSpotter to your Home Screen</div>

<div id="overlay" class="overlay" onclick="closeOverlay(event)">
  <div class="overlay-card" onclick="event.stopPropagation()">
    <div id="overlayContent"></div>
    <button class="secondary" onclick="hideOverlay()">Close</button>
  </div>
</div>

<canvas id="canvas"></canvas>

<script src="data.js"></script>

<script>
const video = document.getElementById("video");
const preview = document.getElementById("preview");
const canvas = document.getElementById("canvas");

let currentIndex = 0;
let selectedYacht = yachts[0];
let capturedImage = null;

navigator.mediaDevices.getUserMedia({
  video:{facingMode:{ideal:"environment"}},
  audio:false
})
.then(stream=>{video.srcObject=stream;})
.catch(()=>{alert("Camera unavailable.");});

function renderDiagram(){
  document.getElementById("diagramViewer").innerHTML = `
    <img src="${selectedYacht.thumb}" alt="${selectedYacht.name}">
  `;
  renderInfo();
}

function renderInfo(){
  document.getElementById("infoCard").innerHTML = `
    <div class="info-grid">
      <div>
        <div class="info-title">${selectedYacht.name}</div>
        <button class="secondary" onclick="openLink('${selectedYacht.yachtLink}')">BELOW DECK</button>
      </div>
      <div>
        <div class="info-title">${selectedYacht.deepPockets}</div>
        <button class="secondary" onclick="openLink('${selectedYacht.ownerLink}')">DEEP POCKETS</button>
      </div>
    </div>
    <button class="pill log-button" onclick="logYacht()">LOG YACHT</button>
  `;
}

function nextYacht(){
  currentIndex = (currentIndex + 1) % yachts.length;
  selectedYacht = yachts[currentIndex];
  document.getElementById("searchBox").value = selectedYacht.name;
  renderDiagram();
}

function searchYacht(){
  const q = document.getElementById("searchBox").value.toLowerCase().trim();
  if(!q) return;

  const index = yachts.findIndex(y =>
    y.name.toLowerCase().includes(q) ||
    y.deepPockets.toLowerCase().includes(q)
  );

  if(index >= 0){
    currentIndex = index;
    selectedYacht = yachts[index];
    renderDiagram();
  }
}

function spotYacht(){
  if(!video.videoWidth){
    alert("Camera loading.");
    return;
  }

  const ctx = canvas.getContext("2d");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video,0,0,canvas.width,canvas.height);

  capturedImage = canvas.toDataURL("image/jpeg",0.7);
  preview.src = capturedImage;
  preview.style.display = "block";
  video.style.display = "none";
}

function logYacht(){
  if(!capturedImage){
    alert("Capture yacht photo first.");
    return;
  }

  const sightings = JSON.parse(localStorage.getItem("fleet") || "[]");

  sightings.unshift({
    name:selectedYacht.name,
    deepPockets:selectedYacht.deepPockets,
    yachtLink:selectedYacht.yachtLink,
    ownerLink:selectedYacht.ownerLink,
    image:capturedImage
  });

  localStorage.setItem("fleet",JSON.stringify(sightings));
  renderFleet();
}

function renderFleet(){
  const sightings = JSON.parse(localStorage.getItem("fleet") || "[]");

  if(!sightings.length){
    document.getElementById("fleetArea").innerHTML = "";
    return;
  }

  let html = `<div class="fleet-title">FLEET</div><div class="fleet-row">`;

  sightings.forEach((s,index)=>{
    html += `
      <div class="fleet-card" onclick="openFleet(${index})">
        <div class="fleet-porthole"><img src="${s.image}"></div>
        <div class="fleet-name">${s.name}</div>
      </div>
    `;
  });

  html += `</div>`;
  document.getElementById("fleetArea").innerHTML = html;
}

function openFleet(index){
  const sightings = JSON.parse(localStorage.getItem("fleet") || "[]");
  const s = sightings[index];

  document.getElementById("overlayContent").innerHTML = `
    <div class="info-grid">
      <div>
        <div class="info-title">${s.name}</div>
        <button class="secondary" onclick="openLink('${s.yachtLink}')">BELOW DECK</button>
      </div>
      <div>
        <div class="info-title">${s.deepPockets}</div>
        <button class="secondary" onclick="openLink('${s.ownerLink}')">DEEP POCKETS</button>
      </div>
    </div>
    <img class="overlay-img" src="${s.image}">
  `;

  document.getElementById("overlay").style.display = "block";
}

function hideOverlay(){
  document.getElementById("overlay").style.display = "none";
}

function closeOverlay(e){
  if(e.target.id === "overlay") hideOverlay();
}

function openLink(url){
  window.open(url,"_blank");
}

renderDiagram();
renderFleet();
</script>

</body>
</html>
