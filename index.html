<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YachtSpotter</title>

  <link rel="manifest" href="manifest.json">

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>

    :root{
      --navy:#07182f;
      --navy-dark:#020812;
      --gold:#d4af37;
      --brass:#b9932e;
      --brass-dark:#604915;
      --brass-light:#f0d36f;
      --mist:#b8c3d6;
      --glass:rgba(255,255,255,0.055);
      --line:rgba(255,255,255,0.11);
      --control-width:min(88vw,360px);
    }

    body{
      margin:0;
      font-family:Inter,-apple-system,BlinkMacSystemFont,Arial,sans-serif;
      background:linear-gradient(180deg,var(--navy),var(--navy-dark));
      color:white;
    }

    .header{
      padding:18px 18px 12px;
      background:rgba(7,24,47,0.92);
      backdrop-filter:blur(14px);
      border-bottom:1px solid rgba(255,255,255,0.06);
      position:sticky;
      top:0;
      z-index:20;
    }

    .brand{
      font-family:"Cormorant Garamond",serif;
      font-size:34px;
      font-weight:600;
      letter-spacing:.7px;
      color:var(--gold);
      line-height:1;
    }

    .rank{
      margin-top:8px;
      line-height:1.35;
    }

    .rank-main{
      font-family:"Cormorant Garamond",serif;
      font-size:24px;
      color:var(--gold);
      letter-spacing:1px;
      text-transform:uppercase;
    }

    .rank-sub{
      margin-top:2px;
      font-size:12px;
      color:var(--mist);
    }

    .top-stack{
      width:var(--control-width);
      margin:18px auto 10px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .viewer{
      position:relative;
      width:var(--control-width);
      height:var(--control-width);
      border-radius:50%;
      padding:14px;
      box-sizing:border-box;
      background:
      radial-gradient(circle at 32% 24%,rgba(255,255,255,0.38),transparent 15%),
      linear-gradient(145deg,var(--brass-light) 0%,var(--gold) 22%,var(--brass) 52%,var(--brass-dark) 100%);
      box-shadow:
      0 22px 58px rgba(0,0,0,0.45),
      inset 0 2px 5px rgba(255,255,255,0.35),
      inset 0 -5px 8px rgba(0,0,0,0.36);
    }

    .viewer::before,
    .viewer::after{
      content:"";
      position:absolute;
      width:10px;
      height:10px;
      border-radius:50%;
      background:#3f310f;
      border:1px solid rgba(255,255,255,0.22);
      top:50%;
      transform:translateY(-50%);
      z-index:3;
    }

    .viewer::before{left:5px;}
    .viewer::after{right:5px;}

    .viewer-inner{
      width:100%;
      height:100%;
      border-radius:50%;
      overflow:hidden;
      background:#06101f;
      border:2px solid rgba(255,255,255,0.14);
    }

    video,
    .preview{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .preview{
      display:none;
    }

    button{
      border:none;
      cursor:pointer;
      font-family:"Cormorant Garamond",serif;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:1.1px;
    }

    .pill{
      border-radius:999px;
      background:
      linear-gradient(180deg,rgba(255,255,255,0.22),transparent 22%),
      linear-gradient(135deg,var(--brass-light),var(--gold) 28%,var(--brass) 58%,#755817);
      color:#06101f;
      border:1px solid rgba(255,255,255,0.22);
      box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.38),
      inset 0 -3px 7px rgba(0,0,0,0.24),
      0 10px 24px rgba(0,0,0,0.25);
    }

    .secondary{
      background:
      linear-gradient(180deg,rgba(255,255,255,0.10),transparent 28%),
      rgba(6,16,31,0.74);
      color:white;
      border:1px solid rgba(212,175,55,0.55);
    }

    .hero-button{
      width:var(--control-width);
      margin-top:10px;
      font-size:24px;
      padding:15px 18px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }

    .camera-mini{
      width:22px;
      height:14px;
      border-radius:5px;
      border:1px solid rgba(6,16,31,0.65);
      position:relative;
      background:rgba(6,16,31,0.18);
    }

    .camera-mini::before{
      content:"";
      position:absolute;
      width:6px;
      height:6px;
      border-radius:50%;
      border:1px solid rgba(6,16,31,0.72);
      left:6px;
      top:3px;
    }

    .retake{
      margin-top:8px;
      font-size:13px;
      color:var(--mist);
      cursor:pointer;
    }

    input{
      display:block;
      width:var(--control-width);
      margin:10px auto 7px;
      padding:13px 16px;
      border-radius:999px;
      font-family:Inter,sans-serif;
      font-size:15px;
      background:rgba(2,8,18,0.76);
      color:white;
      border:1px solid rgba(212,175,55,0.32);
      outline:none;
      box-sizing:border-box;
    }

    .suggestions{
      width:var(--control-width);
      margin:0 auto 8px;
      border-radius:20px;
      overflow:hidden;
      background:rgba(2,8,18,0.92);
      border:1px solid rgba(212,175,55,0.24);
      display:none;
    }

    .suggestion{
      padding:12px 14px;
      border-bottom:1px solid rgba(255,255,255,0.08);
      cursor:pointer;
    }

    .suggestion:last-child{
      border-bottom:none;
    }

    .suggestion-name{
      font-family:"Cormorant Garamond",serif;
      font-size:21px;
      color:var(--gold);
    }

    .suggestion-person{
      font-size:12px;
      color:var(--mist);
      margin-top:1px;
    }

    .card{
      width:var(--control-width);
      margin:9px auto;
      padding:14px;
      border-radius:22px;
      background:var(--glass);
      border:1px solid var(--line);
      box-sizing:border-box;
    }

    .pair-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      text-align:center;
    }

    .pair-title{
      font-family:"Cormorant Garamond",serif;
      font-size:22px;
      line-height:1.05;
    }

    .pair-grid button{
      width:100%;
      margin-top:10px;
      padding:9px 10px;
      border-radius:999px;
      font-size:14px;
    }

    .hint-line{
      text-align:center;
      margin-top:14px;
      font-size:12px;
      color:var(--mist);
    }

    .hint-hot{
      font-family:"Cormorant Garamond",serif;
      font-size:22px;
      color:var(--gold);
      margin:0 4px;
      vertical-align:middle;
    }

    .got-title{
      width:var(--control-width);
      margin:23px auto 9px;
      font-family:"Cormorant Garamond",serif;
      font-size:22px;
      font-weight:600;
      letter-spacing:3px;
      color:var(--gold);
      text-transform:uppercase;
    }

    .shelf{
      display:flex;
      gap:12px;
      overflow-x:auto;
      padding:0 calc((100vw - min(88vw,360px))/2) 18px;
    }

    .thumb{
      min-width:92px;
      cursor:pointer;
    }

    .thumb-porthole{
      position:relative;
      width:88px;
      height:88px;
      border-radius:50%;
      padding:7px;
      background:
      radial-gradient(circle at 32% 22%,rgba(255,255,255,0.30),transparent 16%),
      linear-gradient(145deg,var(--brass-light),var(--gold) 30%,var(--brass) 58%,var(--brass-dark));
      box-sizing:border-box;
    }

    .thumb-porthole img{
      width:100%;
      height:100%;
      border-radius:50%;
      object-fit:cover;
    }

    .thumb-name{
      margin-top:7px;
      font-family:"Cormorant Garamond",serif;
      font-size:16px;
      text-align:center;
    }

    .overlay{
      display:none;
      position:fixed;
      inset:0;
      z-index:50;
      background:rgba(2,8,18,0.88);
      backdrop-filter:blur(10px);
      padding:18px;
      box-sizing:border-box;
    }

    .overlay-card{
      margin:40px auto;
      max-width:420px;
      border-radius:26px;
      background:linear-gradient(180deg,rgba(7,24,47,0.96),rgba(2,8,18,0.98));
      border:1px solid rgba(212,175,55,0.32);
      padding:16px;
    }

    .overlay-img{
      width:100%;
      border-radius:22px;
      margin-top:12px;
    }

    .close-button{
      margin-top:14px;
      width:100%;
      padding:12px;
      border-radius:999px;
    }

    .home-badge{
      margin:26px auto 36px;
      text-align:center;
      color:rgba(212,175,55,0.86);
      cursor:pointer;
    }

    .home-icon{
      width:54px;
      height:54px;
      border-radius:50%;
      display:block;
      margin:0 auto 8px;
    }

    .home-text{
      font-family:"Cormorant Garamond",serif;
      font-size:17px;
    }

    canvas{
      display:none;
    }

  </style>
</head>

<body>

  <div class="header">
    <div class="brand">YachtSpotter</div>

    <div class="rank" id="rankText"></div>
  </div>

  <div class="top-stack">

    <div class="viewer">
      <div class="viewer-inner">
        <video id="video" autoplay playsinline></video>
        <img id="preview" class="preview">
      </div>
    </div>

    <button class="pill hero-button" onclick="spotYacht()">
      <span class="camera-mini"></span>
      SPOT YACHT
    </button>

    <div class="retake" id="retakeButton" onclick="retakePhoto()" style="display:none;">
      Retake photo
    </div>

  </div>

  <canvas id="canvas"></canvas>

  <input id="searchBox" placeholder="Type yacht name..." oninput="showSuggestions()">

  <div id="suggestions" class="suggestions"></div>

  <div id="yachtInfo"></div>

  <div id="gotYachtShelf"></div>

  <div class="home-badge" onclick="installApp()">
    <img src="icon-192.png" class="home-icon">
    <div class="home-text">Add YachtSpotter to Home Screen</div>
  </div>

  <div id="overlay" class="overlay" onclick="closeOverlay(event)">
    <div class="overlay-card" onclick="event.stopPropagation()">

      <div id="overlayContent"></div>

      <button class="secondary close-button" onclick="hideOverlay()">
        Close
      </button>

    </div>
  </div>

  <script src="data.js"></script>

  <script>

    const video=document.getElementById("video");
    const canvas=document.getElementById("canvas");
    const preview=document.getElementById("preview");

    let capturedImage=null;
    let selectedYacht=null;
    let currentOverlayIndex=null;

    navigator.mediaDevices.getUserMedia({
      video:{facingMode:"environment"}
    })
    .then(function(stream){
      video.srcObject=stream;
    });

    function spotYacht(){

      const ctx=canvas.getContext("2d");

      canvas.width=video.videoWidth;
      canvas.height=video.videoHeight;

      ctx.drawImage(video,0,0);

      capturedImage=canvas.toDataURL("image/jpeg",0.75);

      preview.src=capturedImage;

      preview.style.display="block";
      video.style.display="none";

      document.getElementById("retakeButton").style.display="block";
    }

    function retakePhoto(){

      capturedImage=null;

      preview.style.display="none";
      video.style.display="block";

      document.getElementById("retakeButton").style.display="none";
    }

    function showSuggestions(){

      if(!capturedImage){
        document.getElementById("searchBox").value="";
        alert("First SPOT YACHT.");
        return;
      }

      const q=document.getElementById("searchBox").value.toLowerCase();

      const box=document.getElementById("suggestions");

      if(!q){
        box.style.display="none";
        return;
      }

      const matches=yachts.filter(function(yacht){

        return yacht.name.toLowerCase().includes(q) ||
        yacht.deepPockets.toLowerCase().includes(q);

      }).slice(0,8);

      box.innerHTML="";

      matches.forEach(function(yacht){

        const item=document.createElement("div");

        item.className="suggestion";

        item.innerHTML=`
          <div class="suggestion-name">${yacht.name}</div>
          <div class="suggestion-person">${yacht.deepPockets}</div>
        `;

        item.onclick=function(){
          selectYacht(yacht);
        };

        box.appendChild(item);

      });

      box.style.display=matches.length ? "block" : "none";
    }

    function selectYacht(yacht){

      selectedYacht=yacht;

      document.getElementById("searchBox").value=yacht.name;

      document.getElementById("suggestions").style.display="none";

      document.getElementById("yachtInfo").innerHTML=`

        <div class="card">

          <div class="pair-grid">

            <div>
              <div class="pair-title">${yacht.name}</div>

              <button class="secondary" onclick="openLink('${yacht.yachtLink}')">
                BELOW DECK
              </button>
            </div>

            <div>
              <div class="pair-title">${yacht.deepPockets}</div>

              <button class="secondary" onclick="openLink('${yacht.ownerLink}')">
                DEEP POCKETS
              </button>
            </div>

          </div>

          <div class="hint-line">
            Hint: Hit
            <span class="hint-hot">HOT YACHT</span>
            to save
          </div>

        </div>

      `;
    }

    function hotYacht(){

      if(!capturedImage || !selectedYacht){
        return;
      }

      const sightings=JSON.parse(localStorage.getItem("sightings") || "[]");

      sightings.unshift({
        name:selectedYacht.name,
        deepPockets:selectedYacht.deepPockets,
        ownerLink:selectedYacht.ownerLink,
        yachtLink:selectedYacht.yachtLink,
        image:capturedImage
      });

      localStorage.setItem("sightings",JSON.stringify(sightings));

      document.getElementById("searchBox").value="";
      document.getElementById("yachtInfo").innerHTML="";

      selectedYacht=null;

      retakePhoto();

      updateRank();
      renderGotYachtShelf();
    }

    function renderGotYachtShelf(){

      const sightings=JSON.parse(localStorage.getItem("sightings") || "[]");

      const area=document.getElementById("gotYachtShelf");

      if(!sightings.length){
        area.innerHTML="";
        return;
      }

      let html=`
        <div class="got-title">GOT YACHT</div>
        <div class="shelf">
      `;

      sightings.forEach(function(s,index){

        html+=`
          <div class="thumb" onclick="openSavedYacht(${index})">

            <div class="thumb-porthole">
              <img src="${s.image}">
            </div>

            <div class="thumb-name">
              ${s.name}
            </div>

          </div>
        `;
      });

      html+=`</div>`;

      area.innerHTML=html;
    }

    function openSavedYacht(index){

      currentOverlayIndex=index;

      const sightings=JSON.parse(localStorage.getItem("sightings") || "[]");

      const s=sightings[index];

      document.getElementById("overlayContent").innerHTML=`

        <div class="pair-grid">

          <div>
            <div class="pair-title">${s.name}</div>

            <button class="secondary" onclick="openLink('${s.yachtLink}')">
              BELOW DECK
            </button>
          </div>

          <div>
            <div class="pair-title">${s.deepPockets}</div>

            <button class="secondary" onclick="openLink('${s.ownerLink}')">
              DEEP POCKETS
            </button>
          </div>

        </div>

        <img class="overlay-img" src="${s.image}">

        <button class="secondary close-button" onclick="notYacht()">
          NOT YACHT
        </button>

      `;

      document.getElementById("overlay").style.display="block";
    }

    function notYacht(){

      const sightings=JSON.parse(localStorage.getItem("sightings") || "[]");

      sightings.splice(currentOverlayIndex,1);

      localStorage.setItem("sightings",JSON.stringify(sightings));

      hideOverlay();

      updateRank();
      renderGotYachtShelf();
    }

    function hideOverlay(){
      document.getElementById("overlay").style.display="none";
    }

    function closeOverlay(event){
      if(event.target.id==="overlay"){
        hideOverlay();
      }
    }

    function updateRank(){

      const sightings=JSON.parse(localStorage.getItem("sightings") || "[]");

      const count=sightings.length;

      let rank="Crew";
      let needed=15-count;
      let next="Captain";

      if(count>=15){
        rank="Captain";
        needed=30-count;
        next="Commodore";
      }

      if(count>=30){
        rank="Commodore";
        needed=0;
      }

      document.getElementById("rankText").innerHTML=`

        <div class="rank-main">
          YOUR RANK: ${rank}
        </div>

        <div class="rank-sub">
          ${needed > 0 ? `Log +${needed} for promotion to ${next}` : `Top rank achieved`}
        </div>

      `;
    }

    function openLink(url){
      window.open(url,"_blank");
    }

    function installApp(){

      alert(
        "To add YachtSpotter to your phone:\n\n"+
        "iPhone:\nTap Share → Add to Home Screen\n\n"+
        "Android:\nTap Menu → Add to Home Screen"
      );
    }

    if("serviceWorker" in navigator){
      navigator.serviceWorker.register("service-worker.js");
    }

    updateRank();
    renderGotYachtShelf();

  </script>

</body>
</html>
