<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YachtSpotter Majorca</title>

<link rel="manifest" href="manifest.json" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght=500;600;700&family=Inter:wght=400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#07182f;
  --navy-dark:#020812;
  --gold:#d4af37;
  --brass:#b9932e;
  --mist:#b8c3d6;
  --glass:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.11);
}

*{box-sizing:border-box;}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter,sans-serif;
  background:
    radial-gradient(circle at top,#12305a 0%,#07182f 36%,#020812 100%);
  color:white;
}

/* MAIN BINOCULARS */

.binocular-stage{
  width:min(96vw,760px);
  margin:72px auto 0;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
}

.binoculars{
  width:min(94vw,720px);
  height:min(48vw,330px);
  position:relative;
}

.bridge{
  position:absolute;
  left:50%;
  top:44%;
  width:18%;
  height:22%;
  transform:translate(-50%,-50%);
  border-radius:999px;
  background:
    radial-gradient(circle at 28% 24%,rgba(255,255,255,.42),transparent 22%),
    linear-gradient(145deg,#f8df83 0%,#d4af37 34%,#9d7624 70%,#47320c 100%);
  box-shadow:
    0 16px 32px rgba(0,0,0,.48),
    inset 0 4px 7px rgba(255,255,255,.36),
    inset 0 -8px 13px rgba(0,0,0,.45);
  z-index:1;
}

.barrel{
  position:absolute;
  top:0;
  width:48%;
  height:100%;
  border-radius:50%;
  padding:3.3%;
  background:
    radial-gradient(circle at 27% 17%,rgba(255,255,255,.55),transparent 13%),
    radial-gradient(circle at 72% 82%,rgba(0,0,0,.36),transparent 30%),
    linear-gradient(145deg,#ffe990 0%,#d4af37 30%,#a57b23 58%,#47320c 100%);
  box-shadow:
    0 28px 60px rgba(0,0,0,.54),
    inset 0 5px 9px rgba(255,255,255,.44),
    inset 0 -11px 16px rgba(0,0,0,.48);
  z-index:2;
}

.barrel-left{left:1.5%;}
.barrel-right{right:1.5%;}

.lens{
  width:100%;
  height:100%;
  border-radius:50%;
  overflow:hidden;
  background:#06101f;
  border:2px solid rgba(255,255,255,.15);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    inset 0 0 36px rgba(0,0,0,.86),
    inset 0 0 7px rgba(212,175,55,.48);
}

video,.preview{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.preview{display:none;}

#diagramViewer{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,rgba(212,175,55,.08),transparent 55%),
    #06101f;
}

.dynamic-yacht-svg{
  width:90%;
  height:90%;
}

/* SPOT / SEARCH */

.spot-section{
  width:min(88vw,520px);
  margin:42px auto 42px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.camera-button{
  width:46px;
  height:46px;
  border-radius:50%;
  border:none;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 30% 22%,rgba(255,255,255,.44),transparent 18%),
    linear-gradient(145deg,#f0d36f,#d4af37 36%,#b9932e 70%,#674d17);
  color:#06101f;
  font-size:19px;
  box-shadow:
    0 9px 18px rgba(0,0,0,.28),
    inset 0 2px 4px rgba(255,255,255,.28),
    inset 0 -4px 7px rgba(0,0,0,.25);
  cursor:pointer;
}

.spot-plaque{
  margin-top:15px;
  padding:10px 28px;
  border-radius:999px;
  font-family:"Cormorant Garamond",serif;
  font-size:19px;
  letter-spacing:1.6px;
  color:#06101f;
  background:
    linear-gradient(145deg,#f0d36f,#d4af37 36%,#b9932e 70%,#674d17);
  box-shadow:0 8px 18px rgba(0,0,0,.22);
}

.search{
  margin-top:18px;
  width:min(72vw,280px);
  height:44px;
  padding:0 15px;
  border-radius:999px;
  border:1px solid rgba(212,175,55,.32);
  background:rgba(2,8,18,.78);
  color:white;
  font-size:12px;
  outline:none;
  text-align:center;
}

.search::placeholder{
  color:rgba(184,195,214,.72);
}

.retake{
  margin-top:8px;
  color:var(--mist);
  font-size:12px;
  cursor:pointer;
  text-align:center;
}

/* IDENTIFICATION */

.info-card{
  width:min(88vw,520px);
  margin:0 auto 44px;
  padding:0;
  background:transparent;
  border:none;
  text-align:center;
}

.vessel-hull{
  display:block;
  width:min(78vw,380px);
  margin:0 auto 16px;
  padding:13px 24px 15px;
  text-decoration:none;
  color:#06101f;
  font-family:"Cormorant Garamond",serif;
  font-size:26px;
  line-height:1;
  letter-spacing:1px;
  background:
    linear-gradient(145deg,#f0d36f,#d4af37 36%,#b9932e 70%,#674d17);
  clip-path:polygon(9% 0%,91% 0%,100% 48%,91% 100%,9% 100%,
