<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>YachtSpotter Majorca</title>

  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --navy: #07182f;
      --navy-dark: #020812;
      --gold: #d4af37;
      --brass: #b9932e;
      --brass-dark: #604915;
      --brass-light: #f0d36f;
      --mist: #b8c3d6;
      --glass: rgba(255,255,255,0.055);
      --line: rgba(255,255,255,0.11);
      --control-width: min(88vw, 360px);
    }

    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      background: linear-gradient(180deg, var(--navy), var(--navy-dark));
      color: white;
    }

    .header {
      padding: 18px;
      background: rgba(7,24,47,0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      font-family: "Cormorant Garamond", serif;
      font-size: 34px;
      color: var(--gold);
      letter-spacing: 0.7px;
      line-height: 1;
    }

    .edition {
      margin-top: 3px;
      font-size: 11px;
      color: var(--mist);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .profile {
      margin-top: 8px;
      color: var(--mist);
      font-size: 12px;
      line-height: 1.45;
    }

    .insignia-main {
      font-family: "Cormorant Garamond", serif;
      font-size: 24px;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .top-stack {
      width: var(--control-width);
      margin: 18px auto 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .viewer {
      width: var(--control-width);
      height: var(--control-width);
      border-radius: 50%;
      padding: 14px;
      box-sizing: border-box;
      background:
        radial-gradient(circle at 32% 24%, rgba(255,255,255,0.38), transparent 15%),
        linear-gradient(145deg, var(--brass-light), var(--gold) 22%, var(--brass) 52%, var(--brass-dark));
      box-shadow:
        0 22px 58px rgba(0,0,0,0.45),
        inset 0 2px 5px rgba(255,255,255,0.35),
        inset 0 -5px 8px rgba(0,0,0,0.36);
    }

    .viewer-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background: #06101f;
      border: 2px solid rgba(255,255,255,0.14);
    }

    video,
    .preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .preview { display: none; }

    button {
      border: none;
      cursor: pointer;
      font-family: "Cormorant Garamond", serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.1px;
    }

    .pill {
      border-radius: 999px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.22), transparent 22%),
        linear-gradient(135deg, var(--brass-light), var(--gold) 28%, var(--brass) 58%, #755817);
      color: #06101f;
      border: 1px solid rgba(255,255,255,0.22);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.38),
        inset 0 -3px 7px rgba(0,0,0,0.24),
        0 10px 24px rgba(0,0,0,0.25);
    }

    .secondary {
      background: rgba(6,16,31,0.74);
      color: white;
      border: 1px solid rgba(212,175,55,0.55);
    }

    .hero-button {
      width: var(--control-width);
      margin-top: 10px;
      font-size: 24px;
      padding: 15px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .camera-mini {
      width: 22px;
      height: 14px;
      border-radius: 5px;
      border: 1px solid rgba(6,16,31,0.65);
      position: relative;
      background: rgba(6,16,31,0.18);
    }

    .camera-mini::before {
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      border: 1px solid rgba(6,16,31,0.72);
      left: 6px;
      top: 3px;
    }

    .retake {
      margin-top: 8px;
      font-size: 13px;
      color: var(--mist);
      cursor: pointer;
    }

    input {
      display: block;
      width: var(--control-width);
      margin: 10px auto 10px;
      padding: 13px 16px;
      border-radius: 999px;
      font-family: Inter, sans-serif;
      font-size: 15px;
      background: rgba(2,8,18,0.76);
      color: white;
      border: 1px solid rgba(212,175,55,0.32);
      outline: none;
      box-sizing: border-box;
    }

    input::placeholder {
      color: rgba(184,195,214,0.72);
    }

    .registry-title {
      width: var(--control-width);
      margin: 16px auto 8px;
      font-family: "Cormorant Garamond", serif;
      font-size: 18px;
      letter-spacing: 3px;
      color: var(--gold);
      text-transform: uppercase;
    }

    .fleet-carousel {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 0 calc((100vw - min(88vw,360px))/2) 16px;
      -webkit-overflow-scrolling: touch;
    }

    .fleet-card {
      min-width: var(--control-width);
      scroll-snap-align: center;
      border-radius: 26px;
      background: var(--glass);
      border: 1px solid var(--line);
      box-sizing: border-box;
      padding: 14px;
      cursor: pointer;
      opacity: 0.72;
      transform: scale(0.96);
      transition: 0.2s ease;
    }

    .fleet-card.active {
      opacity: 1;
      transform: scale(1);
      border-color: rgba(212,175,55,0.6);
      box-shadow: 0 18px 40px rgba(0,0,0,0.28);
    }

    .registry-plate {
      height: 150px;
      border-radius: 18px;
      background:
        radial-gradient(circle at 50% 0%, rgba(212,175,55,0.14), transparent 42%),
        linear-gradient(180deg, rgba(255,255,255,0.04), rgba(2,8,18,0.72));
      border: 1px solid rgba(212,175,55,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .silhouette {
      width: 88%;
      height: 92px;
    }

    .card-name {
      font-family: "Cormorant Garamond", serif;
      font-size: 28px;
      color: var(--gold);
      text-align: center;
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1;
    }

    .card-owner {
      text-align: center;
      font-size: 12px;
      color: var(--mist);
      margin-top: 6px;
      min-height: 16px;
    }

    .rarity {
      margin-top: 9px;
      text-align: center;
      font-family: "Cormorant Garamond", serif;
      letter-spacing: 2px;
      font-size: 15px;
    }

    .rarity-classic { color: #cdbb84; }
    .rarity-iconic { color: #f0d36f; }
    .rarity-mythic {
      color: #ffd700;
      text-shadow: 0 0 12px rgba(255,215,0,0.45);
    }

    .details-card {
      width: var(--control-width);
      margin: 0 auto 12px;
      padding: 14px;
      border-radius: 22px;
      background: var(--glass);
      border: 1px solid var(--line);
      box-sizing: border-box;
      display: none;
    }

    .pair-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      text-align: center;
    }

    .pair-title {
      font-family: "Cormorant Garamond", serif;
      font-size: 22px;
      line-height: 1.05;
    }

    .pair-grid button,
    .close-button,
    .not-yacht-button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border-radius: 999px;
      font-size: 14px;
    }

    .hint-line {
      text-align: center;
      margin-top: 14px;
      font-size: 12px;
      color: var(--mist);
    }

    .hint-hot {
      font-family: "Cormorant Garamond", serif;
      font-size: 22px;
      color: var(--gold);
      margin: 0 4px;
    }

    .log-save-button {
      width: 100%;
      margin-top: 12px;
      padding: 13px 18px;
      font-size: 22px;
    }

    .fleet-title {
      width: var(--control-width);
      margin: 23px auto 9px;
      font-family: "Cormorant Garamond", serif;
      font-size: 22px;
      letter-spacing: 3px;
      color: var(--gold);
      text-transform: uppercase;
    }

    .shelf {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 0 calc((100vw - min(88vw,360px))/2) 18px;
    }

    .thumb {
      min-width: 92px;
      cursor: pointer;
    }

    .thumb-porthole {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      padding: 7px;
      background:
        radial-gradient(circle at 32% 22%, rgba(255,255,255,0.30), transparent 16%),
        linear-gradient(145deg, var(--brass-light), var(--gold) 30%, var(--brass) 58%, var(--brass-dark));
      box-sizing: border-box;
    }

    .thumb-porthole img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .thumb-name {
      margin-top: 7px;
      font-family: "Cormorant Garamond", serif;
      font-size: 16px;
      text-align: center;
    }

    .thumb-rarity {
      text-align: center;
      font-size: 10px;
      color: var(--mist);
      margin-top: 2px;
      letter-spacing: 1px;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(2,8,18,0.88);
      backdrop-filter: blur(10px);
      padding: 18px;
      box-sizing: border-box;
    }

    .overlay-card {
      margin: 40px auto;
      max-width: 420px;
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(7,24,47,0.96), rgba(2,8,18,0.98));
      border: 1px solid rgba(212,175,55,0.32);
      padding: 16px;
    }

    .overlay-img {
      width: 100%;
      border-radius: 22px;
      margin-top: 12px;
    }

    .home-badge {
      margin: 26px auto 36px;
      text-align: center;
      color: rgba(212,175,55,0.86);
      cursor: pointer;
    }

    .home-icon {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: block;
      margin: 0 auto 8px;
      background:
        radial-gradient(circle at 32% 24%, rgba(255,255,255,0.38), transparent 16%),
        linear-gradient(145deg, var(--brass-light), var(--gold), var(--brass-dark));
    }

    .home-text {
      font-family: "Cormorant Garamond", serif;
      font-size: 17px;
    }

    .welcome {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: linear-gradient(180deg, var(--navy), var(--navy-dark));
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      box-sizing: border-box;
    }

    .welcome-card {
      width: min(88vw, 380px);
      border-radius: 28px;
      padding: 22px;
      background: rgba(255,255,255,0.055);
      border: 1px solid rgba(212,175,55,0.32);
      text-align: center;
    }

    .welcome-title {
      font-family: "Cormorant Garamond", serif;
      font-size: 38px;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .welcome-sub {
      color: var(--mist);
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 14px;
    }

    .welcome button {
      width: 100%;
      padding: 14px;
      font-size: 21px;
      margin-top: 8px;
    }

    .change-name {
      color: var(--mist);
      text-decoration: underline;
      cursor: pointer;
    }

    canvas { display: none; }
  </style>
</head>

<body>

  <div class="welcome" id="welcomeScreen">
    <div class="welcome-card">
      <div class="welcome-title">YachtSpotter</div>
      <div class="welcome-sub">Enter your spotter name to join the Majorca fleet registry.</div>
      <input id="spotterNameInput" placeholder="Spotter name" />
      <button class="pill" onclick="saveSpotterName()">Begin Spotting</button>
    </div>
  </div>

  <div class="header">
    <div class="brand">YachtSpotter</div>
    <div class="edition">Majorca Registry</div>
    <div class="profile" id="profileText"></div>
  </div>

  <div class="top-stack">
    <div class="viewer">
      <div class="viewer-inner">
        <video id="video" autoplay playsinline muted></video>
        <img id="preview" class="preview" alt="Yacht preview" />
      </div>
    </div>

    <button class="pill hero-button" onclick="spotYacht()">
      <span class="camera-mini"></span>
      SPOT YACHT
    </button>

    <div class="retake" id="retakeButton" onclick="retakePhoto()" style="display:none;">
      Retake photo
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <input id="searchBox" placeholder="Type yacht name or swipe registry..." oninput="searchAndSwipe()" />

  <div class="registry-title">Fleet Registry</div>
  <div id="fleetCarousel" class="fleet-carousel"></div>

  <div id="detailsCard" class="details-card"></div>

  <div id="fleetShelf"></div>

  <div id="installBadge" class="home-badge" onclick="installApp()">
    <div class="home-icon"></div>
    <div class="home-text">Add YachtSpotter to Home Screen</div>
  </div>

  <div id="overlay" class="overlay" onclick="closeOverlay(event)">
    <div class="overlay-card" onclick="event.stopPropagation()">
      <div id="overlayContent"></div>
      <button class="secondary close-button" onclick="hideOverlay()">Close</button>
    </div>
  </div>

  <script src="data.js"></script>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const preview = document.getElementById("preview");
    const carousel = document.getElementById("fleetCarousel");

    let capturedImage = null;
    let selectedYacht = null;
    let currentOverlayIndex = null;
    let scrollTimer = null;

    function getSightings() {
      return JSON.parse(localStorage.getItem("sightings") || "[]");
    }

    function saveSightings(sightings) {
      localStorage.setItem("sightings", JSON.stringify(sightings));
    }

    function getSpotterName() {
      return localStorage.getItem("spotterName") || "";
    }

    function saveSpotterName() {
      const input = document.getElementById("spotterNameInput");
      const name = input.value.trim();

      if (!name) {
        alert("Enter your spotter name.");
        return;
      }

      localStorage.setItem("spotterName", name);
      document.getElementById("welcomeScreen").style.display = "none";
      updateProfile();
    }

    function changeSpotterName() {
      localStorage.removeItem("spotterName");
      document.getElementById("welcomeScreen").style.display = "flex";
    }

    function checkWelcome() {
      if (!getSpotterName()) {
        document.getElementById("welcomeScreen").style.display = "flex";
      }
    }

    function getBestInsignia(sightings) {
      if (sightings.some(s => s.rarity === "MYTHIC")) return "COMMODORE";
      if (sightings.some(s => s.rarity === "ICONIC")) return "CAPTAIN";
      return "CREW";
    }

    function getRarityCounts(sightings) {
      return {
        classic: sightings.filter(s => s.rarity === "CLASSIC").length,
        iconic: sightings.filter(s => s.rarity === "ICONIC").length,
        mythic: sightings.filter(s => s.rarity === "MYTHIC").length
      };
    }

    function updateProfile() {
      const sightings = getSightings();
      const counts = getRarityCounts(sightings);
      const insignia = getBestInsignia(sightings);
      const name = getSpotterName() || "Spotter";

      let nextLine = "Log CLASSIC yachts to build your fleet.";
      if (insignia === "CREW") nextLine = "Log an ICONIC yacht to earn Captain insignia.";
      if (insignia === "CAPTAIN") nextLine = "Log a MYTHIC yacht to earn Commodore insignia.";
      if (insignia === "COMMODORE") nextLine = "Commodore insignia achieved.";

      document.getElementById("profileText").innerHTML = `
        <div class="insignia-main">YOUR INSIGNIA: ${insignia}</div>
        <div>${name} · ${sightings.length} logged · ${counts.classic} CLASSIC · ${counts.iconic} ICONIC · ${counts.mythic} MYTHIC</div>
        <div>${nextLine} <span class="change-name" onclick="changeSpotterName()">Change name</span></div>
      `;
    }

    function yachtSilhouette() {
      return `
        <svg class="silhouette" viewBox="0 0 500 160" xmlns="http://www.w3.org/2000/svg">
          <line x1="28" y1="123" x2="462" y2="123" stroke="#d4af37" stroke-width="1" opacity=".45"/>
          <path d="M46 112 L385 112 L450 88 L422 126 L82 130 Z" fill="none" stroke="#f4e3a0" stroke-width="3"/>
          <path d="M120 95 C160 68 245 68 300 92 L362 92 C332 72 280 56 220 58 C174 60 139 74 120 95 Z" fill="none" stroke="#e8d699" stroke-width="3"/>
          <path d="M170 75 C198 52 252 52 288 74" fill="none" stroke="#e8d699" stroke-width="3"/>
          <line x1="250" y1="31" x2="250" y2="72" stroke="#f4e3a0" stroke-width="3"/>
          <circle cx="268" cy="48" r="8" fill="none" stroke="#f4e3a0" stroke-width="2"/>
          <line x1="85" y1="131" x2="430" y2="131" stroke="#b8c3d6" stroke-width="2" opacity=".65"/>
        </svg>
      `;
    }

    function renderRegistryCards() {
      carousel.innerHTML = "";

      yachts.forEach(function(yacht, index) {
        const card = document.createElement("div");
        card.className = "fleet-card";
        card.dataset.index = index;

        const rarityClass = yacht.rarity.toLowerCase();

        card.innerHTML = `
          <div class="registry-plate">
            ${yachtSilhouette()}
          </div>

          <div class="card-name">${yacht.name}</div>
          <div class="card-owner">${yacht.deepPockets}</div>
          <div class="rarity rarity-${rarityClass}">${yacht.rarity}</div>
        `;

        card.onclick = function() {
          selectYachtByIndex(index, true);
        };

        carousel.appendChild(card);
      });

      selectYachtByIndex(0, false);
    }

    function selectYachtByIndex(index, shouldScroll) {
      selectedYacht = yachts[index];

      document.querySelectorAll(".fleet-card").forEach(function(card) {
        card.classList.remove("active");
      });

      const card = document.querySelector(`.fleet-card[data-index="${index}"]`);

      if (card) {
        card.classList.add("active");

        if (shouldScroll) {
          card.scrollIntoView({
            behavior: "smooth",
            inline: "center",
            block: "nearest"
          });
        }
      }

      document.getElementById("searchBox").value = selectedYacht.name;
      renderSelectedDetails();
    }

    function getCenteredCardIndex() {
      const cards = Array.from(document.querySelectorAll(".fleet-card"));
      const center = carousel.scrollLeft + carousel.offsetWidth / 2;

      let bestIndex = 0;
      let bestDistance = Infinity;

      cards.forEach(function(card) {
        const cardCenter = card.offsetLeft + card.offsetWidth / 2;
        const distance = Math.abs(center - cardCenter);

        if (distance < bestDistance) {
          bestDistance = distance;
          bestIndex = Number(card.dataset.index);
        }
      });

      return bestIndex;
    }

    carousel.addEventListener("scroll", function() {
      clearTimeout(scrollTimer);

      scrollTimer = setTimeout(function() {
        selectYachtByIndex(getCenteredCardIndex(), false);
      }, 90);
    });

    function searchAndSwipe() {
      if (!capturedImage) {
        document.getElementById("searchBox").value = "";
        alert("First capture a yacht image using the SPOT YACHT camera.");
        return;
      }

      const q = document.getElementById("searchBox").value.toLowerCase().trim();

      if (!q) return;

      const index = yachts.findIndex(function(yacht) {
        return yacht.name.toLowerCase().includes(q) ||
               yacht.deepPockets.toLowerCase().includes(q) ||
               yacht.rarity.toLowerCase().includes(q);
      });

      if (index >= 0) {
        selectYachtByIndex(index, true);
      }
    }

    function renderSelectedDetails() {
      if (!selectedYacht) return;

      const rarityClass = selectedYacht.rarity.toLowerCase();
      const details = document.getElementById("detailsCard");

      details.style.display = "block";

      details.innerHTML = `
        <div class="pair-grid">
          <div>
            <div class="pair-title">${selectedYacht.name}</div>
            <button class="secondary" onclick="openLink('${selectedYacht.yachtLink}')">BELOW DECK</button>
          </div>

          <div>
            <div class="pair-title">${selectedYacht.deepPockets}</div>
            <button class="secondary" onclick="openLink('${selectedYacht.ownerLink}')">DEEP POCKETS</button>
          </div>
        </div>

        <div class="rarity rarity-${rarityClass}">${selectedYacht.rarity}</div>

        <div class="hint-line">
          Hit <span class="hint-hot">LOG YACHT</span> to save this sighting
        </div>

        <button class="pill log-save-button" onclick="logYacht()">LOG YACHT</button>
      `;
    }

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false
    })
    .then(function(stream) {
      video.srcObject = stream;
    })
    .catch(function() {
      alert("Camera access denied or unavailable.");
    });

    function spotYacht() {
      if (!video.videoWidth || !video.videoHeight) {
        alert("Camera is still loading. Try SPOT YACHT again in a moment.");
        return;
      }

      const ctx = canvas.getContext("2d");

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      capturedImage = canvas.toDataURL("image/jpeg", 0.7);

      if (!capturedImage || capturedImage.length < 1000) {
        alert("Photo could not be captured. Please try again.");
        return;
      }

      preview.src = capturedImage;
      preview.style.display = "block";
      video.style.display = "none";
      document.getElementById("retakeButton").style.display = "block";
    }

    function retakePhoto() {
      capturedImage = null;

      preview.src = "";
      preview.style.display = "none";
      video.style.display = "block";

      document.getElementById("retakeButton").style.display = "none";
    }

    function logYacht() {
      if (!capturedImage) {
        alert("First capture a yacht image using the SPOT YACHT camera.");
        return;
      }

      if (!selectedYacht) {
        alert("Select a yacht first.");
        return;
      }

      const sightings = getSightings();

      sightings.unshift({
        name: selectedYacht.name,
        deepPockets: selectedYacht.deepPockets,
        rarity: selectedYacht.rarity,
        thumb: selectedYacht.thumb,
        ownerLink: selectedYacht.ownerLink,
        yachtLink: selectedYacht.yachtLink,
        image: capturedImage
      });

      try {
        saveSightings(sightings);
      } catch (error) {
        alert("This photo could not be saved. Try retaking the image.");
        return;
      }

      retakePhoto();
      updateProfile();
      renderFleetShelf();
    }

    function renderFleetShelf() {
      const sightings = getSightings();
      const area = document.getElementById("fleetShelf");

      if (!sightings.length) {
        area.innerHTML = "";
        return;
      }

      let html = `
        <div class="fleet-title">FLEET</div>
        <div class="shelf">
      `;

      sightings.forEach(function(s, index) {
        html += `
          <div class="thumb" onclick="openSavedYacht(${index})">
            <div class="thumb-porthole">
              <img src="${s.image}" alt="${s.name}">
            </div>
            <div class="thumb-name">${s.name}</div>
            <div class="thumb-rarity">${s.rarity || "CLASSIC"}</div>
          </div>
        `;
      });

      html += `</div>`;
      area.innerHTML = html;
    }

    function openSavedYacht(index) {
      currentOverlayIndex = index;

      const sightings = getSightings();
      const s = sightings[index];

      if (!s) return;

      const rarityClass = (s.rarity || "CLASSIC").toLowerCase();

      document.getElementById("overlayContent").innerHTML = `
        <div class="pair-grid">
          <div>
            <div class="pair-title">${s.name}</div>
            <button class="secondary" onclick="openLink('${s.yachtLink}')">BELOW DECK</button>
          </div>

          <div>
            <div class="pair-title">${s.deepPockets}</div>
            <button class="secondary" onclick="openLink('${s.ownerLink}')">DEEP POCKETS</button>
          </div>
        </div>

        <div class="rarity rarity-${rarityClass}">${s.rarity || "CLASSIC"}</div>

        <img class="overlay-img" src="${s.image}" alt="${s.name}">

        <button class="secondary not-yacht-button" onclick="notYacht()">NOT YACHT</button>
      `;

      document.getElementById("overlay").style.display = "block";
    }

    function notYacht() {
      const sightings = getSightings();

      if (currentOverlayIndex !== null) {
        sightings.splice(currentOverlayIndex, 1);
        saveSightings(sightings);
      }

      hideOverlay();
      updateProfile();
      renderFleetShelf();
    }

    function hideOverlay() {
      document.getElementById("overlay").style.display = "none";
      currentOverlayIndex = null;
    }

    function closeOverlay(event) {
      if (event.target.id === "overlay") {
        hideOverlay();
      }
    }

    function openLink(url) {
      window.open(url, "_blank");
    }

    function installApp() {
      alert(
        "To add YachtSpotter to your phone:\n\n" +
        "iPhone:\nTap Share → Add to Home Screen\n\n" +
        "Android:\nTap Menu → Add to Home Screen"
      );
    }

    function updateInstallBadge() {
      const badge = document.getElementById("installBadge");

      if (!badge) return;

      const standalone =
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true;

      badge.style.display = standalone ? "none" : "block";
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js").catch(function() {});
    }

    checkWelcome();
    updateProfile();
    renderRegistryCards();
    renderFleetShelf();
    updateInstallBadge();
  </script>
</body>
</html>
