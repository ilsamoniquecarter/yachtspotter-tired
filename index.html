<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>YachtSpotter</title>

  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --navy: #07182f;
      --navy-dark: #020812;
      --gold: #d4af37;
      --brass: #b9932e;
      --brass-dark: #604915;
      --brass-light: #f0d36f;
      --mist: #b8c3d6;
      --glass: rgba(255,255,255,0.055);
      --line: rgba(255,255,255,0.11);
      --control-width: min(88vw, 360px);
    }

    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      background: linear-gradient(180deg, var(--navy), var(--navy-dark));
      color: white;
    }

    .header {
      padding: 18px;
      background: rgba(7,24,47,0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      font-family: "Cormorant Garamond", serif;
      font-size: 34px;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 0.7px;
    }

    .profile {
      margin-top: 8px;
      color: var(--mist);
      font-size: 12px;
      line-height: 1.45;
    }

    .insignia-main {
      font-family: "Cormorant Garamond", serif;
      font-size: 24px;
      color: var(--gold);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .top-stack {
      width: var(--control-width);
      margin: 18px auto 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .viewer {
      width: var(--control-width);
      height: var(--control-width);
      border-radius: 50%;
      padding: 14px;
      box-sizing: border-box;
      background:
        radial-gradient(circle at 32% 24%, rgba(255,255,255,0.38), transparent 15%),
        linear-gradient(145deg, var(--brass-light), var(--gold) 22%, var(--brass) 52%, var(--brass-dark));
      box-shadow:
        0 22px 58px rgba(0,0,0,0.45),
        inset 0 2px 5px rgba(255,255,255,0.35),
        inset 0 -5px 8px rgba(0,0,0,0.36);
    }

    .viewer-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background: #06101f;
      border: 2px solid rgba(255,255,255,0.14);
    }

    video,
    .preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .preview {
      display: none;
    }

    button {
      border: none;
      cursor: pointer;
      font-family: "Cormorant Garamond", serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.1px;
    }

    .pill {
      border-radius: 999px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.22), transparent 22%),
        linear-gradient(135deg, var(--brass-light), var(--gold) 28%, var(--brass) 58%, #755817);
      color: #06101f;
      border: 1px solid rgba(255,255,255,0.22);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.38),
        inset 0 -3px 7px rgba(0,0,0,0.24),
        0 10px 24px rgba(0,0,0,0.25);
    }

    .secondary {
      background: rgba(6,16,31,0.74);
      color: white;
      border: 1px solid rgba(212,175,55,0.55);
    }

    .hero-button {
      width: var(--control-width);
      margin-top: 10px;
      font-size: 24px;
      padding: 15px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .camera-mini {
      width: 22px;
      height: 14px;
      border-radius: 5px;
      border: 1px solid rgba(6,16,31,0.65);
      position: relative;
      background: rgba(6,16,31,0.18);
    }

    .camera-mini::before {
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      border: 1px solid rgba(6,16,31,0.72);
      left: 6px;
      top: 3px;
    }

    .retake {
      margin-top: 8px;
      font-size: 13px;
      color: var(--mist);
      cursor: pointer;
    }

    input {
      display: block;
      width: var(--control-width);
      margin: 10px auto 7px;
      padding: 13px 16px;
      border-radius: 999px;
      font-family: Inter, sans-serif;
      font-size: 15px;
      background: rgba(2,8,18,0.76);
      color: white;
      border: 1px solid rgba(212,175,55,0.32);
      outline: none;
      box-sizing: border-box;
    }

    .suggestions {
      width: var(--control-width);
      margin: 0 auto 8px;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(2,8,18,0.92);
      border: 1px solid rgba(212,175,55,0.24);
      display: none;
    }

    .suggestion {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      cursor: pointer;
    }

    .suggestion:last-child {
      border-bottom: none;
    }

    .suggestion-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .suggestion-thumb {
      width: 58px;
      height: 58px;
      border-radius: 14px;
      object-fit: cover;
      background: #06101f;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .suggestion-name {
      font-family: "Cormorant Garamond", serif;
      font-size: 21px;
      color: var(--gold);
    }

    .suggestion-person {
      font-size: 12px;
      color: var(--mist);
      margin-top: 1px;
    }

    .card {
      width: var(--control-width);
      margin: 9px auto;
      padding: 14px;
      border-radius: 22px;
      background: var(--glass);
      border: 1px solid var(--line);
      box-sizing: border-box;
    }

    .yacht-card-img {
      width: 100%;
      border-radius: 18px;
      margin-bottom: 12px;
      object-fit: cover;
      background: #06101f;
    }

    .pair-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      text-align: center;
    }

    .pair-title {
      font-family: "Cormorant Garamond", serif;
      font-size: 22px;
      line-height: 1.05;
    }

    .pair-grid button,
    .close-button,
    .not-yacht-button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border-radius: 999px;
      font-size: 14px;
    }

    .rarity {
      margin-top: 12px;
      text-align: center;
      font-family: "Cormorant Garamond", serif;
      letter-spacing: 2px;
      font-size: 15px;
    }

    .rarity-classic {
      color: #cdbb84;
    }

    .rarity-iconic {
      color: #f0d36f;
    }

    .rarity-mythic {
      color: #ffd700;
      text-shadow: 0 0 12px rgba(255,215,0,0.45);
    }

    .hint-line {
      text-align: center;
      margin-top: 14px;
      font-size: 12px;
      color: var(--mist);
    }

    .hint-hot {
      font-family: "Cormorant Garamond", serif;
      font-size: 22px;
      color: var(--gold);
      margin: 0 4px;
    }

    .log-save-button {
      width: 100%;
      margin-top: 12px;
      padding: 13px 18px;
      font-size: 22px;
    }

    .fleet-title {
      width: var(--control-width);
      margin: 23px auto 9px;
      font-family: "Cormorant Garamond", serif;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 3px;
      color: var(--gold);
      text-transform: uppercase;
    }

    .shelf {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 0 calc((100vw - min(88vw,360px))/2) 18px;
    }

    .thumb {
      min-width: 92px;
      cursor: pointer;
    }

    .thumb-porthole {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      padding: 7px;
      background:
        radial-gradient(circle at 32% 22%, rgba(255,255,255,0.30), transparent 16%),
        linear-gradient(145deg, var(--brass-light), var(--gold) 30%, var(--brass) 58%, var(--brass-dark));
      box-sizing: border-box;
    }

    .thumb-porthole img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .thumb-name {
      margin-top: 7px;
      font-family: "Cormorant Garamond", serif;
      font-size: 16px;
      text-align: center;
    }

    .thumb-rarity {
      text-align: center;
      font-size: 10px;
      color: var(--mist);
      margin-top: 2px;
      letter-spacing: 1px;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(2,8,18,0.88);
      backdrop-filter: blur(10px);
      padding: 18px;
      box-sizing: border-box;
    }

    .overlay-card {
      margin: 40px auto;
      max-width: 420px;
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(7,24,47,0.96), rgba(2,8,18,0.98));
      border: 1px solid rgba(212,175,55,0.32);
      padding: 16px;
    }

    .overlay-img {
      width: 100%;
      border-radius: 22px;
      margin-top: 12px;
    }

    .home-badge {
      margin: 26px auto 36px;
      text-align: center;
      color: rgba(212,175,55,0.86);
      cursor: pointer;
    }

    .home-icon {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: block;
      margin: 0 auto 8px;
      background:
        radial-gradient(circle at 32% 24%, rgba(255,255,255,0.38), transparent 16%),
        linear-gradient(145deg, var(--brass-light), var(--gold), var(--brass-dark));
    }

    .home-text {
      font-family: "Cormorant Garamond", serif;
      font-size: 17px;
    }

    .welcome {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: linear-gradient(180deg, var(--navy), var(--navy-dark));
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      box-sizing: border-box;
    }

    .welcome-card {
      width: min(88vw, 380px);
      border-radius: 28px;
      padding: 22px;
      background: rgba(255,255,255,0.055);
      border: 1px solid rgba(212,175,55,0.32);
      text-align: center;
    }

    .welcome-title {
      font-family: "Cormorant Garamond", serif;
      font-size: 38px;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .welcome-sub {
      color: var(--mist);
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 14px;
    }

    .welcome button {
      width: 100%;
      padding: 14px;
      font-size: 21px;
      margin-top: 8px;
    }

    .change-name {
      color: var(--mist);
      text-decoration: underline;
      cursor: pointer;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>

  <div class="welcome" id="welcomeScreen">
    <div class="welcome-card">
      <div class="welcome-title">YachtSpotter</div>
      <div class="welcome-sub">
        Enter your spotter name to join the fleet registry.
      </div>
      <input id="spotterNameInput" placeholder="Spotter name" />
      <button class="pill" onclick="saveSpotterName()">Begin Spotting</button>
    </div>
  </div>

  <div class="header">
    <div class="brand">YachtSpotter</div>
    <div class="profile" id="profileText"></div>
  </div>

  <div class="top-stack">
    <div class="viewer">
      <div class="viewer-inner">
        <video id="video" autoplay playsinline muted></video>
        <img id="preview" class="preview" alt="Yacht preview" />
      </div>
    </div>

    <button class="pill hero-button" onclick="spotYacht()">
      <span class="camera-mini"></span>
      SPOT YACHT
    </button>

    <div class="retake" id="retakeButton" onclick="retakePhoto()" style="display:none;">
      Retake photo
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <input id="searchBox" placeholder="Type yacht name..." oninput="showSuggestions()" />

  <div id="suggestions" class="suggestions"></div>
  <div id="yachtInfo"></div>
  <div id="fleetShelf"></div>

  <div id="installBadge" class="home-badge" onclick="installApp()">
    <div class="home-icon"></div>
    <div class="home-text">Add YachtSpotter to Home Screen</div>
  </div>

  <div id="overlay" class="overlay" onclick="closeOverlay(event)">
    <div class="overlay-card" onclick="event.stopPropagation()">
      <div id="overlayContent"></div>
      <button class="secondary close-button" onclick="hideOverlay()">Close</button>
    </div>
  </div>

  <script src="data.js"></script>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const preview = document.getElementById("preview");

    let capturedImage = null;
    let selectedYacht = null;
    let currentOverlayIndex = null;

    function getSightings() {
      return JSON.parse(localStorage.getItem("sightings") || "[]");
    }

    function saveSightings(sightings) {
      localStorage.setItem("sightings", JSON.stringify(sightings));
    }

    function getSpotterName() {
      return localStorage.getItem("spotterName") || "";
    }

    function saveSpotterName() {
      const input = document.getElementById("spotterNameInput");
      const name = input.value.trim();

      if (!name) {
        alert("Enter your spotter name.");
        return;
      }

      localStorage.setItem("spotterName", name);
      document.getElementById("welcomeScreen").style.display = "none";
      updateProfile();
    }

    function changeSpotterName() {
      localStorage.removeItem("spotterName");
      document.getElementById("welcomeScreen").style.display = "flex";
    }

    function checkWelcome() {
      if (!getSpotterName()) {
        document.getElementById("welcomeScreen").style.display = "flex";
      }
    }

    function getBestInsignia(sightings) {
      const hasMythic = sightings.some(s => s.rarity === "MYTHIC");
      const hasIconic = sightings.some(s => s.rarity === "ICONIC");

      if (hasMythic) return "COMMODORE";
      if (hasIconic) return "CAPTAIN";
      return "CREW";
    }

    function getRarityCounts(sightings) {
      return {
        classic: sightings.filter(s => s.rarity === "CLASSIC").length,
        iconic: sightings.filter(s => s.rarity === "ICONIC").length,
        mythic: sightings.filter(s => s.rarity === "MYTHIC").length
      };
    }

    function updateProfile() {
      const sightings = getSightings();
      const counts = getRarityCounts(sightings);
      const insignia = getBestInsignia(sightings);
      const name = getSpotterName() || "Spotter";

      let nextLine = "Log CLASSIC yachts to build your fleet.";

      if (insignia === "CREW") {
        nextLine = "Log an ICONIC yacht to earn Captain insignia.";
      }

      if (insignia === "CAPTAIN") {
        nextLine = "Log a MYTHIC yacht to earn Commodore insignia.";
      }

      if (insignia === "COMMODORE") {
        nextLine = "Commodore insignia achieved.";
      }

      document.getElementById("profileText").innerHTML = `
        <div class="insignia-main">YOUR INSIGNIA: ${insignia}</div>
        <div>${name} · ${sightings.length} logged · ${counts.classic} CLASSIC · ${counts.iconic} ICONIC · ${counts.mythic} MYTHIC</div>
        <div>${nextLine} <span class="change-name" onclick="changeSpotterName()">Change name</span></div>
      `;
    }

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false
    })
    .then(function(stream) {
      video.srcObject = stream;
    })
    .catch(function() {
      alert("Camera access denied or unavailable.");
    });

    function spotYacht() {
      if (!video.videoWidth || !video.videoHeight) {
        alert("Camera is still loading. Try SPOT YACHT again in a moment.");
        return;
      }

      const ctx = canvas.getContext("2d");

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      capturedImage = canvas.toDataURL("image/jpeg", 0.7);

      if (!capturedImage || capturedImage.length < 1000) {
        alert("Photo could not be captured. Please try again.");
        return;
      }

      preview.src = capturedImage;
      preview.style.display = "block";
      video.style.display = "none";

      document.getElementById("retakeButton").style.display = "block";
    }

    function retakePhoto() {
      capturedImage = null;
      selectedYacht = null;

      preview.src = "";
      preview.style.display = "none";
      video.style.display = "block";

      document.getElementById("retakeButton").style.display = "none";
      document.getElementById("searchBox").value = "";
      document.getElementById("suggestions").style.display = "none";
      document.getElementById("suggestions").innerHTML = "";
      document.getElementById("yachtInfo").innerHTML = "";
    }

    function showSuggestions() {
      if (!capturedImage) {
        document.getElementById("searchBox").value = "";
        alert("First capture a yacht image using the SPOT YACHT camera.");
        return;
      }

      const q = document.getElementById("searchBox").value.toLowerCase();
      const box = document.getElementById("suggestions");

      selectedYacht = null;
      document.getElementById("yachtInfo").innerHTML = "";

      if (!q) {
        box.style.display = "none";
        box.innerHTML = "";
        return;
      }

      const matches = yachts.filter(function(yacht) {
        return yacht.name.toLowerCase().includes(q) ||
               yacht.deepPockets.toLowerCase().includes(q) ||
               yacht.rarity.toLowerCase().includes(q);
      }).slice(0, 8);

      box.innerHTML = "";

      matches.forEach(function(yacht) {
        const item = document.createElement("div");
        item.className = "suggestion";

        item.innerHTML = `
          <div class="suggestion-row">
            <img class="suggestion-thumb" src="${yacht.thumb || ""}" alt="${yacht.name}">
            <div>
              <div class="suggestion-name">${yacht.name}</div>
              <div class="suggestion-person">${yacht.deepPockets} · ${yacht.rarity}</div>
            </div>
          </div>
        `;

        item.onclick = function() {
          selectYacht(yacht);
        };

        box.appendChild(item);
      });

      box.style.display = matches.length ? "block" : "none";
    }

    function selectYacht(yacht) {
      selectedYacht = yacht;

      document.getElementById("searchBox").value = yacht.name;
      document.getElementById("suggestions").style.display = "none";

      const rarityClass = yacht.rarity.toLowerCase();

      document.getElementById("yachtInfo").innerHTML = `
        <div class="card">
          ${yacht.thumb ? `<img class="yacht-card-img" src="${yacht.thumb}" alt="${yacht.name}">` : ""}

          <div class="pair-grid">
            <div>
              <div class="pair-title">${yacht.name}</div>
              <button class="secondary" onclick="openLink('${yacht.yachtLink}')">BELOW DECK</button>
            </div>

            <div>
              <div class="pair-title">${yacht.deepPockets}</div>
              <button class="secondary" onclick="openLink('${yacht.ownerLink}')">DEEP POCKETS</button>
            </div>
          </div>

          <div class="rarity rarity-${rarityClass}">${yacht.rarity}</div>

          <div class="hint-line">
            Hit <span class="hint-hot">LOG YACHT</span> to save this sighting
          </div>

          <button class="pill log-save-button" onclick="logYacht()">LOG YACHT</button>
        </div>
      `;
    }

    function logYacht() {
      if (!capturedImage) {
        alert("First capture a yacht image using the SPOT YACHT camera.");
        return;
      }

      if (!selectedYacht) {
        alert("Now type and select the yacht name.");
        return;
      }

      const sightings = getSightings();

      sightings.unshift({
        name: selectedYacht.name,
        deepPockets: selectedYacht.deepPockets,
        rarity: selectedYacht.rarity,
        thumb: selectedYacht.thumb,
        ownerLink: selectedYacht.ownerLink,
        yachtLink: selectedYacht.yachtLink,
        image: capturedImage
      });

      try {
        saveSightings(sightings);
      } catch (error) {
        alert("This photo could not be saved. Try retaking the image.");
        return;
      }

      retakePhoto();
      updateProfile();
      renderFleetShelf();
    }

    function renderFleetShelf() {
      const sightings = getSightings();
      const area = document.getElementById("fleetShelf");

      if (!sightings.length) {
        area.innerHTML = "";
        return;
      }

      let html = `
        <div class="fleet-title">FLEET</div>
        <div class="shelf">
      `;

      sightings.forEach(function(s, index) {
        html += `
          <div class="thumb" onclick="openSavedYacht(${index})">
            <div class="thumb-porthole">
              <img src="${s.image}" alt="${s.name}">
            </div>
            <div class="thumb-name">${s.name}</div>
            <div class="thumb-rarity">${s.rarity || "CLASSIC"}</div>
          </div>
        `;
      });

      html += `</div>`;
      area.innerHTML = html;
    }

    function openSavedYacht(index) {
      currentOverlayIndex = index;
      const sightings = getSightings();
      const s = sightings[index];

      if (!s) return;

      const rarityClass = (s.rarity || "CLASSIC").toLowerCase();

      document.getElementById("overlayContent").innerHTML = `
        <div class="pair-grid">
          <div>
            <div class="pair-title">${s.name}</div>
            <button class="secondary" onclick="openLink('${s.yachtLink}')">BELOW DECK</button>
          </div>

          <div>
            <div class="pair-title">${s.deepPockets}</div>
            <button class="secondary" onclick="openLink('${s.ownerLink}')">DEEP POCKETS</button>
          </div>
        </div>

        <div class="rarity rarity-${rarityClass}">${s.rarity || "CLASSIC"}</div>

        <img class="overlay-img" src="${s.image}" alt="${s.name}">

        <button class="secondary not-yacht-button" onclick="notYacht()">NOT YACHT</button>
      `;

      document.getElementById("overlay").style.display = "block";
    }

    function notYacht() {
      const sightings = getSightings();

      if (currentOverlayIndex !== null) {
        sightings.splice(currentOverlayIndex, 1);
        saveSightings(sightings);
      }

      hideOverlay();
      updateProfile();
      renderFleetShelf();
    }

    function hideOverlay() {
      document.getElementById("overlay").style.display = "none";
      currentOverlayIndex = null;
    }

    function closeOverlay(event) {
      if (event.target.id === "overlay") {
        hideOverlay();
      }
    }

    function openLink(url) {
      window.open(url, "_blank");
    }

    function installApp() {
      alert(
        "To add YachtSpotter to your phone:\n\n" +
        "iPhone:\nTap Share → Add to Home Screen\n\n" +
        "Android:\nTap Menu → Add to Home Screen"
      );
    }

    function isRunningStandalone() {
      return (
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true
      );
    }

    function updateInstallBadge() {
      const badge = document.getElementById("installBadge");
      if (!badge) return;

      badge.style.display = isRunningStandalone() ? "none" : "block";
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js").catch(function() {});
    }

    checkWelcome();
    updateProfile();
    renderFleetShelf();
    updateInstallBadge();
  </script>
</body>
</html>
