<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YachtSpotter</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      background: linear-gradient(180deg, #07182f, #020812);
      color: white;
    }

    .header {
      padding: 20px;
      font-size: 28px;
      font-weight: 900;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .rank {
      font-size: 14px;
      color: #d4af37;
      margin-top: 6px;
    }

    video, .preview {
      width: calc(100% - 20px);
      margin: 10px;
      border-radius: 20px;
      max-height: 360px;
      object-fit: cover;
      background: #06101f;
    }

    .preview { display: none; }

    button, select, input {
      width: calc(100% - 20px);
      margin: 8px 10px;
      padding: 15px;
      border-radius: 16px;
      border: none;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      font-weight: 850;
      cursor: pointer;
    }

    .primary {
      background: linear-gradient(135deg,#d4af37,#9c781f);
      color: #06101f;
    }

    .secondary {
      background: rgba(255,255,255,0.08);
      color: white;
      border: 1px solid rgba(255,255,255,0.12);
    }

    select, input {
      background: #06101f;
      color: white;
      border: 1px solid rgba(255,255,255,0.16);
    }

    .card {
      margin: 10px;
      padding: 16px;
      border-radius: 20px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.10);
    }

    .gold {
      color: #d4af37;
      font-weight: 900;
    }

    .small {
      color: #b8c3d6;
      font-size: 14px;
      line-height: 1.55;
    }

    .mini-buttons {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .mini-buttons button {
      width: auto;
      flex: 1;
      margin: 0;
      padding: 10px;
      font-size: 13px;
      border-radius: 12px;
    }

    .pleasure-title {
      margin: 22px 10px 8px;
      font-size: 22px;
      font-weight: 900;
      color: #d4af37;
    }

    .carousel {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 0 10px 20px;
      scroll-snap-type: x mandatory;
    }

    .port-card {
      min-width: 78%;
      scroll-snap-align: start;
      border-radius: 22px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 14px;
    }

    .port-card img {
      width: 100%;
      border-radius: 16px;
      margin-top: 10px;
    }

    .footer {
      margin: 20px 10px 30px;
      color: #91a0ba;
      font-size: 13px;
      text-align: center;
    }

    canvas { display: none; }
  </style>
</head>

<body>

  <div class="header">
    🚢 YachtSpotter
    <div class="rank" id="rankText">⚓ Crew</div>
  </div>

  <video id="video" autoplay playsinline></video>

  <button class="primary" onclick="spotYacht()">🎯 Spot Yacht</button>

  <canvas id="canvas"></canvas>
  <img id="preview" class="preview" alt="Yacht preview">

  <input id="searchBox" placeholder="Search yacht name..." oninput="filterYachts()">

  <select id="yachtSelect" onchange="showYachtInfo()">
    <option value="">Choose yacht...</option>
  </select>

  <div id="yachtInfo"></div>

  <button class="primary" onclick="gotYacht()">🚢 Got Yacht</button>

  <button class="secondary" onclick="spotAnother()">⚓ Spot Another</button>

  <div id="results"></div>

  <div id="pleasurePort"></div>

  <div class="footer" onclick="installApp()">
    📲 Add YachtSpotter to your Home Screen
  </div>

  <script src="data.js"></script>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const preview = document.getElementById("preview");
    const yachtSelect = document.getElementById("yachtSelect");

    let capturedImage = null;

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    })
    .then(function(stream) {
      video.srcObject = stream;
    })
    .catch(function() {
      navigator.mediaDevices.getUserMedia({ video: true })
      .then(function(stream) {
        video.srcObject = stream;
      })
      .catch(function() {
        alert("Camera access denied or unavailable.");
      });
    });

    function loadYachts(list = yachts) {
      yachtSelect.innerHTML = '<option value="">Choose yacht...</option>';

      list.forEach(function(yacht) {
        const option = document.createElement("option");
        option.value = yachts.indexOf(yacht);
        option.textContent = yacht.name;
        yachtSelect.appendChild(option);
      });
    }

    function filterYachts() {
      const q = document.getElementById("searchBox").value.toLowerCase();

      const filtered = yachts.filter(function(yacht) {
        return yacht.name.toLowerCase().includes(q) ||
               yacht.deepPockets.toLowerCase().includes(q);
      });

      loadYachts(filtered);
    }

    function spotYacht() {
      const ctx = canvas.getContext("2d");

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      ctx.drawImage(video, 0, 0);

      capturedImage = canvas.toDataURL("image/jpeg", 0.75);

      preview.src = capturedImage;
      preview.style.display = "block";

      document.getElementById("results").innerHTML = `
        <div class="card">
          <strong>Yacht spotted.</strong>
          <div class="small">
            Choose the yacht you think it is, then tap <span class="gold">Got Yacht</span>.
          </div>
        </div>
      `;
    }

    function showYachtInfo() {
      const index = yachtSelect.value;

      if (index === "") {
        document.getElementById("yachtInfo").innerHTML = "";
        return;
      }

      const yacht = yachts[index];

      document.getElementById("yachtInfo").innerHTML = `
        <div class="card">
          <div class="gold">${yacht.name}</div>
          <div class="small">${yacht.blurb}</div>

          <div class="mini-buttons">
            <button class="secondary" onclick="openLink('${yacht.ownerLink}')">
              💰 Deep Pockets
            </button>
            <button class="secondary" onclick="openLink('${yacht.yachtLink}')">
              🛥 Below Deck
            </button>
          </div>
        </div>
      `;
    }

    function gotYacht() {
      const index = yachtSelect.value;

      if (!capturedImage) {
        alert("Tap Spot Yacht first.");
        return;
      }

      if (index === "") {
        alert("Choose the yacht first.");
        return;
      }

      const yacht = yachts[index];

      const sighting = {
        name: yacht.name,
        deepPockets: yacht.deepPockets,
        ownerLink: yacht.ownerLink,
        yachtLink: yacht.yachtLink,
        blurb: yacht.blurb,
        image: capturedImage,
        date: new Date().toLocaleString()
      };

      const sightings = JSON.parse(localStorage.getItem("sightings") || "[]");
      sightings.unshift(sighting);

      localStorage.setItem("sightings", JSON.stringify(sightings));

      updateRank();

      document.getElementById("results").innerHTML = `
        <div class="card">
          <strong class="gold">🔥 Hot Yacht!</strong>
          <div class="small">${yacht.name} has sailed into Pleasure Port.</div>
        </div>
      `;

      renderPleasurePort();
    }

    function renderPleasurePort() {
      const sightings = JSON.parse(localStorage.getItem("sightings") || "[]");
      const area = document.getElementById("pleasurePort");

      if (sightings.length === 0) {
        area.innerHTML = "";
        return;
      }

      let html = `
        <div class="pleasure-title">⚓ Pleasure Port</div>
        <div class="carousel">
      `;

      sightings.forEach(function(s) {
        html += `
          <div class="port-card">
            <div class="gold">${s.name}</div>
            <div class="small">
              💰 Deep Pockets: ${s.deepPockets}<br>
              ${s.date}
            </div>

            <div class="mini-buttons">
              <button class="secondary" onclick="openLink('${s.ownerLink}')">
                Deep Pockets
              </button>
              <button class="secondary" onclick="openLink('${s.yachtLink}')">
                Below Deck
              </button>
            </div>

            <img src="${s.image}" alt="${s.name}">
          </div>
        `;
      });

      html += `</div>`;
      area.innerHTML = html;
    }

    function spotAnother() {
      capturedImage = null;
      preview.src = "";
      preview.style.display = "none";

      document.getElementById("searchBox").value = "";
      document.getElementById("yachtInfo").innerHTML = "";
      document.getElementById("results").innerHTML = "";

      loadYachts();
      yachtSelect.value = "";

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function updateRank() {
      const sightings = JSON.parse(localStorage.getItem("sightings") || "[]");
      const count = sightings.length;

      let rank = "⚓ Crew";

      if (count >= 20) {
        rank = "👑 Commodore";
      } else if (count >= 5) {
        rank = "🚢 Captain";
      }

      document.getElementById("rankText").textContent = rank + " · " + count + " yachts";
    }

    function openLink(url) {
      window.open(url, "_blank");
    }

    function installApp() {
      alert(
        "To add YachtSpotter to your phone:\n\n" +
        "iPhone:\nTap Share → Add to Home Screen\n\n" +
        "Android:\nTap Menu → Add to Home Screen"
      );
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }

    loadYachts();
    updateRank();
    renderPleasurePort();
  </script>

</body>
</html>
