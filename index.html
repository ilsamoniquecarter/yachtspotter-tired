<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YachtSpotter</title>
  <link rel="manifest" href="manifest.json">

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      background: linear-gradient(180deg, #07182f, #020812);
      color: white;
    }

    .header {
      padding: 22px 20px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      font-family: "Cormorant Garamond", serif;
      font-size: 34px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #d4af37;
    }

    .rank {
      font-size: 13px;
      color: #b8c3d6;
      margin-top: 4px;
    }

    video, .preview {
      width: calc(100% - 20px);
      margin: 10px;
      border-radius: 22px;
      max-height: 360px;
      object-fit: cover;
      background: #06101f;
    }

    .preview { display: none; }

    button, input {
      width: calc(100% - 20px);
      margin: 8px 10px;
      padding: 15px;
      border-radius: 16px;
      border: none;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      font-weight: 800;
      cursor: pointer;
    }

    .primary {
      background: linear-gradient(135deg,#d4af37,#9c781f);
      color: #06101f;
    }

    .secondary {
      background: rgba(255,255,255,0.08);
      color: white;
      border: 1px solid rgba(255,255,255,0.12);
    }

    input {
      background: #06101f;
      color: white;
      border: 1px solid rgba(255,255,255,0.16);
    }

    .suggestions {
      margin: 0 10px 10px;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      display: none;
    }

    .suggestion {
      padding: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      cursor: pointer;
    }

    .suggestion:last-child { border-bottom: none; }

    .card {
      margin: 10px;
      padding: 16px;
      border-radius: 22px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.10);
    }

    .gold {
      color: #d4af37;
      font-weight: 900;
    }

    .small {
      color: #b8c3d6;
      font-size: 14px;
      line-height: 1.55;
    }

    .pair-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
      text-align: center;
    }

    .pair-title {
      font-family: "Cormorant Garamond", serif;
      font-size: 22px;
      color: white;
    }

    .pair-name {
      font-size: 13px;
      color: #b8c3d6;
      min-height: 34px;
    }

    .pair-grid button {
      width: 100%;
      margin: 8px 0 0;
      padding: 10px;
      font-size: 13px;
      border-radius: 12px;
    }

    .pleasure-title {
      margin: 24px 10px 8px;
      font-family: "Cormorant Garamond", serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #d4af37;
      text-transform: uppercase;
    }

    .carousel {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 0 10px 22px;
      scroll-snap-type: x mandatory;
    }

    .port-card {
      min-width: 82%;
      scroll-snap-align: start;
      border-radius: 24px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 14px;
    }

    .pier {
      font-size: 12px;
      letter-spacing: 2px;
      color: #d4af37;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .port-card img {
      width: 100%;
      border-radius: 18px;
      margin-top: 12px;
    }

    .footer {
      margin: 22px 10px 34px;
      color: #91a0ba;
      font-size: 13px;
      text-align: center;
    }

    canvas { display: none; }
  </style>
</head>

<body>

  <div class="header">
    <div class="brand">🚢 YachtSpotter</div>
    <div class="rank" id="rankText">⚓ Crew</div>
  </div>

  <video id="video" autoplay playsinline></video>

  <button class="primary" onclick="spotYacht()">🎯 Spot Yacht</button>

  <canvas id="canvas"></canvas>
  <img id="preview" class="preview" alt="Yacht preview">

  <input id="searchBox" placeholder="Got Yacht?" oninput="showSuggestions()">

  <div id="suggestions" class="suggestions"></div>

  <div id="yachtInfo"></div>

  <div id="results"></div>

  <div id="pleasurePort"></div>

  <div class="footer" onclick="installApp()">
    📲 Add YachtSpotter to your Home Screen
  </div>

  <script src="data.js"></script>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const preview = document.getElementById("preview");

    let capturedImage = null;
    let selectedYacht = null;

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    })
    .then(function(stream) {
      video.srcObject = stream;
    })
    .catch(function() {
      navigator.mediaDevices.getUserMedia({ video: true })
      .then(function(stream) {
        video.srcObject = stream;
      })
      .catch(function() {
        alert("Camera access denied or unavailable.");
      });
    });

    function spotYacht() {
      const ctx = canvas.getContext("2d");

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      ctx.drawImage(video, 0, 0);

      capturedImage = canvas.toDataURL("image/jpeg", 0.75);

      preview.src = capturedImage;
      preview.style.display = "block";

      document.getElementById("results").innerHTML = `
        <div class="card">
          <strong>Yacht spotted.</strong>
          <div class="small">Type into <span class="gold">Got Yacht?</span> and choose the match.</div>
        </div>
      `;
    }

    function showSuggestions() {
      const q = document.getElementById("searchBox").value.toLowerCase();
      const box = document.getElementById("suggestions");

      selectedYacht = null;
      document.getElementById("yachtInfo").innerHTML = "";

      if (!q) {
        box.style.display = "none";
        box.innerHTML = "";
        return;
      }

      const matches = yachts.filter(function(yacht) {
        return yacht.name.toLowerCase().includes(q) ||
               yacht.deepPockets.toLowerCase().includes(q);
      }).slice(0, 8);

      if (matches.length === 0) {
        box.style.display = "none";
        box.innerHTML = "";
        return;
      }

      box.innerHTML = "";

      matches.forEach(function(yacht) {
        const item = document.createElement("div");
        item.className = "suggestion";
        item.innerHTML = `<span class="gold">${yacht.name}</span><br><span class="small">${yacht.deepPockets}</span>`;
        item.onclick = function() {
          selectYacht(yacht);
        };
        box.appendChild(item);
      });

      box.style.display = "block";
    }

    function selectYacht(yacht) {
      selectedYacht = yacht;

      document.getElementById("searchBox").value = yacht.name;
      document.getElementById("suggestions").style.display = "none";

      document.getElementById("yachtInfo").innerHTML = `
        <div class="card">
          <div class="pair-grid">
            <div>
              <div class="pair-title">${yacht.name}</div>
              <div class="pair-name">Yacht</div>
              <button class="secondary" onclick="openLink('${yacht.yachtLink}')">🛥 Below Deck</button>
            </div>

            <div>
              <div class="pair-title">${yacht.deepPockets}</div>
              <div class="pair-name">Deep Pockets</div>
              <button class="secondary" onclick="openLink('${yacht.ownerLink}')">💰 Deep Pockets</button>
            </div>
          </div>

          <button class="primary" onclick="hotYacht()">🔥 Hot Yacht</button>
        </div>
      `;
    }

    function hotYacht() {
      if (!capturedImage) {
        alert("Tap Spot Yacht first.");
        return;
      }

      if (!selectedYacht) {
        alert("Choose your yacht first.");
        return;
      }

      const sightings = JSON.parse(localStorage.getItem("sightings") || "[]");

      const pierNumber = sightings.length + 1;

      const sighting = {
        pier: pierNumber,
        name: selectedYacht.name,
        deepPockets: selectedYacht.deepPockets,
        ownerLink: selectedYacht.ownerLink,
        yachtLink: selectedYacht.yachtLink,
        image: capturedImage,
        date: new Date().toLocaleString()
      };

      sightings.unshift(sighting);
      localStorage.setItem("sightings", JSON.stringify(sightings));

      updateRank();

      document.getElementById("results").innerHTML = `
        <div class="card">
          <strong class="gold">🔥 Hot Yacht!</strong>
          <div class="small">${selectedYacht.name} at Pier ${pierNumber}.</div>
        </div>
      `;

      document.getElementById("searchBox").value = "";
      document.getElementById("yachtInfo").innerHTML = "";
      document.getElementById("suggestions").innerHTML = "";
      document.getElementById("suggestions").style.display = "none";
      selectedYacht = null;

      renderPleasurePort();
    }

    function renderPleasurePort() {
      const sightings = JSON.parse(localStorage.getItem("sightings") || "[]");
      const area = document.getElementById("pleasurePort");

      if (sightings.length === 0) {
        area.innerHTML = "";
        return;
      }

      let html = `
        <div class="pleasure-title">Pleasure Port</div>
        <div class="carousel">
      `;

      sightings.forEach(function(s) {
        html += `
          <div class="port-card">
            <div class="pier">Pier ${s.pier}</div>

            <div class="pair-grid">
              <div>
                <div class="pair-title">${s.name}</div>
                <div class="pair-name">Yacht</div>
                <button class="secondary" onclick="openLink('${s.yachtLink}')">🛥 Below Deck</button>
              </div>

              <div>
                <div class="pair-title">${s.deepPockets}</div>
                <div class="pair-name">Deep Pockets</div>
                <button class="secondary" onclick="openLink('${s.ownerLink}')">💰 Deep Pockets</button>
              </div>
            </div>

            <img src="${s.image}" alt="${s.name}">
          </div>
        `;
      });

      html += `</div>`;
      area.innerHTML = html;
    }

    function updateRank() {
      const sightings = JSON.parse(localStorage.getItem("sightings") || "[]");
      const count = sightings.length;

      let rank = "⚓ Crew";

      if (count >= 20) {
        rank = "👑 Commodore";
      } else if (count >= 5) {
        rank = "🚢 Captain";
      }

      document.getElementById("rankText").textContent = rank + " · " + count + " yachts";
    }

    function openLink(url) {
      window.open(url, "_blank");
    }

    function installApp() {
      alert(
        "To add YachtSpotter to your phone:\n\n" +
        "iPhone:\nTap Share → Add to Home Screen\n\n" +
        "Android:\nTap Menu → Add to Home Screen"
      );
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }

    updateRank();
    renderPleasurePort();
  </script>

</body>
</html>
