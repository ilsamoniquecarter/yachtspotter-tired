<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YachtSpotter</title>
    <style>
        :root {
            --deep-marine: rgba(10, 15, 25, 0.9);
            --quartz-amber: #d4af37;
        }
        body {
            background: radial-gradient(circle at center, #1a2533, #0a0f19);
            color: #d1d5db;
            font-family: 'Inter', sans-serif;
            margin: 0; 
            height: 100vh;
            display: flex;
            align-items: center;
            overflow: hidden;
        }
        #yacht-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 40px;
            padding: 0 50vw; /* Keeps active lens in center */
            scrollbar-width: none;
        }
        #yacht-container::-webkit-scrollbar { display: none; }
        
        .lens {
            flex: 0 0 250px;
            height: 250px;
            border-radius: 50%;
            border: 4px solid var(--quartz-amber);
            background: var(--deep-marine);
            scroll-snap-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        h3 { font-size: 13px; text-transform: uppercase; margin: 8px 0; color: var(--quartz-amber); letter-spacing: 1px; }
        a { color: #fff; font-size: 10px; text-decoration: none; border-bottom: 1px solid var(--quartz-amber); margin-top: 5px; opacity: 0.8; }
        a:hover { opacity: 1; }
    </style>
</head>
<body>

<div id="yacht-container"></div>

<script src="data.js"></script>
<script>
    const container = document.getElementById('yacht-container');
    yachts.forEach(yacht => {
        const div = document.createElement('div');
        div.className = 'lens';
        div.innerHTML = `
            <h3>${yacht.name}</h3>
            <a href="${yacht.yachtLink}" target="_blank">VESSEL</a>
            <h3>${yacht.deepPockets}</h3>
            <a href="${yacht.ownerLink}" target="_blank">OWNER</a>
        `;
        container.appendChild(div);
    });
</script>

</body>
</html>
