<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YachtSpotter Majorca</title>

<link rel="manifest" href="manifest.json" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#07182f;
  --navy-dark:#020812;
  --gold:#d4af37;
  --brass:#b9932e;
  --mist:#b8c3d6;
  --glass:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.11);
}

*{box-sizing:border-box;}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter,sans-serif;
  background:
    radial-gradient(circle at top,#12305a 0%,#07182f 36%,#020812 100%);
  color:white;
}

/* MAIN BINOCULARS */

.binocular-stage{
  width:min(96vw,760px);
  margin:72px auto 0;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
}

.binoculars{
  width:min(94vw,720px);
  height:min(48vw,330px);
  position:relative;
}

.bridge{
  position:absolute;
  left:50%;
  top:44%;
  width:18%;
  height:22%;
  transform:translate(-50%,-50%);
  border-radius:999px;
  background:
    radial-gradient(circle at 28% 24%,rgba(255,255,255,.42),transparent 22%),
    linear-gradient(145deg,#f8df83 0%,#d4af37 34%,#9d7624 70%,#47320c 100%);
  box-shadow:
    0 16px 32px rgba(0,0,0,.48),
    inset 0 4px 7px rgba(255,255,255,.36),
    inset 0 -8px 13px rgba(0,0,0,.45);
  z-index:1;
}

.barrel{
  position:absolute;
  top:0;
  width:48%;
  height:100%;
  border-radius:50%;
  padding:3.3%;
  background:
    radial-gradient(circle at 27% 17%,rgba(255,255,255,.55),transparent 13%),
    radial-gradient(circle at 72% 82%,rgba(0,0,0,.36),transparent 30%),
    linear-gradient(145deg,#ffe990 0%,#d4af37 30%,#a57b23 58%,#47320c 100%);
  box-shadow:
    0 28px 60px rgba(0,0,0,.54),
    inset 0 5px 9px rgba(255,255,255,.44),
    inset 0 -11px 16px rgba(0,0,0,.48);
  z-index:2;
}

.barrel-left{left:1.5%;}
.barrel-right{right:1.5%;}

.lens{
  width:100%;
  height:100%;
  border-radius:50%;
  overflow:hidden;
  background:#06101f;
  border:2px solid rgba(255,255,255,.15);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    inset 0 0 36px rgba(0,0,0,.86),
    inset 0 0 7px rgba(212,175,55,.48);
}

video,.preview{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.preview{display:none;}

#diagramViewer{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,rgba(212,175,55,.08),transparent 55%),
    #06101f;
}

.dynamic-yacht-svg{
  width:90%;
  height:90%;
}

/* SPOT / SEARCH */

.spot-section{
  width:min(88vw,520px);
  margin:42px auto 42px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.camera-button{
  width:46px;
  height:46px;
  border-radius:50%;
  border:none;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 30% 22%,rgba(255,255,255,.44),transparent 18%),
    linear-gradient(145deg,#f0d36f,#d4af37 36%,#b9932e 70%,#674d17);
  color:#06101f;
  font-size:19px;
  box-shadow:
    0 9px 18px rgba(0,0,0,.28),
    inset 0 2px 4px rgba(255,255,255,.28),
    inset 0 -4px 7px rgba(0,0,0,.25);
  cursor:pointer;
}

.spot-plaque{
  margin-top:15px;
  padding:10px 28px;
  border-radius:999px;
  font-family:"Cormorant Garamond",serif;
  font-size:19px;
  letter-spacing:1.6px;
  color:#06101f;
  background:
    linear-gradient(145deg,#f0d36f,#d4af37 36%,#b9932e 70%,#674d17);
  box-shadow:0 8px 18px rgba(0,0,0,.22);
}

.search{
  margin-top:18px;
  width:min(72vw,280px);
  height:44px;
  padding:0 15px;
  border-radius:999px;
  border:1px solid rgba(212,175,55,.32);
  background:rgba(2,8,18,.78);
  color:white;
  font-size:12px;
  outline:none;
  text-align:center;
}

.search::placeholder{
  color:rgba(184,195,214,.72);
}

.retake{
  margin-top:8px;
  color:var(--mist);
  font-size:12px;
  cursor:pointer;
  text-align:center;
}

/* IDENTIFICATION */

.info-card{
  width:min(88vw,520px);
  margin:0 auto 44px;
  padding:0;
  background:transparent;
  border:none;
  text-align:center;
}

.vessel-hull{
  display:block;
  width:min(78vw,380px);
  margin:0 auto 16px;
  padding:13px 24px 15px;
  text-decoration:none;
  color:#06101f;
  font-family:"Cormorant Garamond",serif;
  font-size:26px;
  line-height:1;
  letter-spacing:1px;
  background:
    linear-gradient(145deg,#f0d36f,#d4af37 36%,#b9932e 70%,#674d17);
  clip-path:polygon(9% 0%,91% 0%,100% 48%,91% 100%,9% 100%,0% 48%);
  box-shadow:0 10px 22px rgba(0,0,0,.24);
}

.owner-plaque{
  display:inline-block;
  min-width:min(72vw,320px);
  padding:10px 20px;
  border-radius:999px;
  border:1px solid rgba(212,175,55,.42);
  background:rgba(6,16,31,.58);
  color:var(--gold);
  text-decoration:none;
  font-family:"Cormorant Garamond",serif;
  font-size:21px;
  line-height:1.05;
}

.got-button{
  width:min(78vw,380px);
  margin:30px auto 0;
  padding:12px;
  border-radius:999px;
  border:none;
  background:
    linear-gradient(145deg,#f0d36f,#d4af37 36%,#b9932e 70%,#674d17);
  color:#06101f;
  font-family:"Cormorant Garamond",serif;
  font-weight:700;
  font-size:20px;
  letter-spacing:1.2px;
  box-shadow:0 8px 18px rgba(0,0,0,.22);
  cursor:pointer;
}

/* GOT YACHT COLLECTION */

.spotted-section{
  width:min(88vw,520px);
  margin:18px auto 54px;
  display:none;
}

.spotted-heading{
  font-family:"Cormorant Garamond",serif;
  font-size:21px;
  letter-spacing:3px;
  color:var(--gold);
  text-align:center;
  margin-bottom:13px;
}

.fleet-row{
  display:flex;
  gap:13px;
  overflow-x:auto;
  padding:0 6px 8px;
}

.fleet-card{
  min-width:96px;
}

.fleet-porthole{
  width:86px;
  height:86px;
  border-radius:50%;
  padding:6px;
  background:
    linear-gradient(145deg,#f0d36f,#d4af37,#b9932e,#674d17);
}

.fleet-porthole img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
}

.fleet-name{
  margin-top:7px;
  text-align:center;
  font-family:"Cormorant Garamond",serif;
  font-size:15px;
}

/* OVERLAY */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(2,8,18,.9);
  backdrop-filter:blur(10px);
  display:none;
  z-index:50;
  padding:18px;
}

.overlay-card{
  max-width:420px;
  margin:40px auto;
  border-radius:26px;
  background:linear-gradient(180deg,#0a1d37,#020812);
  border:1px solid rgba(212,175,55,.3);
  padding:18px;
  text-align:center;
}

.overlay-img{
  width:100%;
  border-radius:20px;
  margin-top:15px;
}

.overlay-close,
.home-close{
  width:100%;
  margin-top:16px;
  padding:10px;
  border-radius:999px;
  background:
    linear-gradient(145deg,#f0d36f,#d4af37 36%,#b9932e 70%,#674d17);
  color:#06101f;
  border:none;
  font-family:"Cormorant Garamond",serif;
  font-weight:700;
  font-size:16px;
  letter-spacing:1px;
}

.home-title{
  font-family:"Cormorant Garamond",serif;
  font-size:30px;
  color:var(--gold);
  margin-bottom:16px;
}

.home-steps{
  color:var(--mist);
  font-size:15px;
  line-height:1.8;
}

/* LIGHTHOUSE FOOTER */

.install{
  text-align:center;
  margin:82px auto 42px;
  color:var(--mist);
  font-family:"Cormorant Garamond",serif;
  font-size:17px;
  letter-spacing:.6px;
  cursor:pointer;
}

.lighthouse{
  width:58px;
  height:58px;
  margin:0 auto 11px;
  position:relative;
  border-radius:50%;
  background:
    radial-gradient(circle at 30% 22%,rgba(255,255,255,.44),transparent 18%),
    linear-gradient(145deg,#f0d36f,#d4af37 36%,#b9932e 70%,#674d17);
  box-shadow:
    0 13px 24px rgba(0,0,0,.35),
    inset 0 2px 4px rgba(255,255,255,.28),
    inset 0 -5px 8px rgba(0,0,0,.28);
}

.lighthouse::before{
  content:"";
  position:absolute;
  left:22px;
  top:13px;
  width:14px;
  height:30px;
  background:#06101f;
  clip-path:polygon(30% 0%,70% 0%,100% 100%,0% 100%);
  opacity:.9;
}

.lighthouse::after{
  content:"";
  position:absolute;
  left:18px;
  top:9px;
  width:22px;
  height:9px;
  border-radius:2px;
  background:#06101f;
  opacity:.9;
}

canvas{display:none;}

@media(max-width:560px){
  .binocular-stage{
    margin-top:62px;
  }

  .binoculars{
    height:min(49vw,230px);
  }

  .barrel{
    padding:2.8%;
  }

  .spot-section{
    margin-top:38px;
    margin-bottom:42px;
  }

  .vessel-hull{
    font-size:23px;
  }

  .owner-plaque{
    font-size:19px;
  }

  .install{
    margin-top:86px;
  }
}
</style>
</head>

<body>

<div class="binocular-stage">
  <div class="binoculars">
    <div class="bridge"></div>

    <div class="barrel barrel-left">
      <div class="lens">
        <video id="video" autoplay playsinline muted></video>
        <img id="preview" class="preview" alt="Captured yacht">
      </div>
    </div>

    <div class="barrel barrel-right">
      <div class="lens">
        <div id="diagramViewer"></div>
      </div>
    </div>
  </div>
</div>

<div class="spot-section">
  <button class="camera-button" onclick="spotYacht()">📷</button>
  <div id="retakeButton" class="retake" onclick="retakePhoto()" style="display:none;">Retake</div>

  <div class="spot-plaque">SPOT YACHT</div>

  <input
    id="searchBox"
    class="search"
    placeholder="Vessel name"
    oninput="searchYacht()"
    autocorrect="off"
    autocapitalize="none"
    spellcheck="false"
    autocomplete="off"
  />
</div>

<div id="infoCard" class="info-card"></div>
<div id="fleetArea" class="spotted-section"></div>

<div id="installFooter" class="install" onclick="showHomeHelp()">
  <div class="lighthouse"></div>
  Add YachtSpotter<br>to Home Screen
</div>

<div id="overlay" class="overlay" onclick="closeOverlay(event)">
  <div class="overlay-card" onclick="event.stopPropagation()">
    <div id="overlayContent"></div>
    <button class="overlay-close" onclick="hideOverlay()">Close</button>
  </div>
</div>

<div id="homeOverlay" class="overlay" onclick="closeHomeHelp(event)">
  <div class="overlay-card" onclick="event.stopPropagation()">
    <div class="lighthouse"></div>
    <div class="home-title">Add YachtSpotter<br>to Home Screen</div>
    <div class="home-steps">
      1. Tap Share ⬆<br>
      2. Tap Add to Home Screen<br>
      3. Tap Add
    </div>
    <button class="home-close" onclick="hideHomeHelp()">GOT IT</button>
  </div>
</div>

<canvas id="canvas"></canvas>

<script src="data.js?v=22"></script>

<script>
const video = document.getElementById("video");
const preview = document.getElementById("preview");
const canvas = document.getElementById("canvas");

let currentIndex = 0;
let selectedYacht = yachts[0];
let capturedImage = null;

navigator.mediaDevices.getUserMedia({
  video:{facingMode:{ideal:"environment"}},
  audio:false
})
.then(stream=>{video.srcObject=stream;})
.catch(()=>{alert("Camera unavailable.");});

// Engine to dynamically calculate architectural vectors for all yacht varieties
function generateYachtSVG(name) {
  const normalized = name.toUpperCase().trim();
  
  // Base configuration definitions
  let hullPath = "M 40 120 L 380 120 L 450 90 L 420 125 L 80 128 Z";
  let superstructureHtml = `<path d="M 120 90 C 160 60 240 62 300 85 L 360 85 L 380 100 Z" fill="none" stroke="#f0d36f" stroke-width="3"/>`;
  let accessoriesHtml = "";
  let detailsHtml = "";

  // 1. Futuristic Hull Designs (e.g., Motor Yacht "A")
  if (normalized === "A") {
    hullPath = "M 50 125 L 110 85 L 320 85 L 440 115 L 450 125 L 70 125 Z";
    superstructureHtml = `
      <path d="M 160 85 L 180 62 L 280 62 L 310 85 Z" fill="none" stroke="#f0d36f" stroke-width="3" />
      <path d="M 200 62 L 210 48 L 260 48 L 270 62 Z" fill="none" stroke="#f0d36f" stroke-width="2" />
    `;
    accessoriesHtml = `<line x1="235" y1="48" x2="235" y2="30" stroke="#f0d36f" stroke-width="2"/>`;
  }
  
  // 2. High-Mast Dynarig / Sailing Superyachts (Sailing Yacht A, Maltese Falcon, Black Pearl, Eos, Athena)
  else if (normalized.includes("SAILING YACHT A")) {
    hullPath = "M 50 125 L 80 95 L 380 95 L 440 115 L 430 128 L 70 128 Z";
    superstructureHtml = `<path d="M 120 95 L 140 75 L 340 75 L 360 95 Z" fill="none" stroke="#f0d36f" stroke-width="3" />`;
    accessoriesHtml = `
      <line x1="150" y1="75" x2="135" y2="15" stroke="#f0d36f" stroke-width="3"/>
      <line x1="240" y1="75" x2="235" y2="10" stroke="#f0d36f" stroke-width="3"/>
      <line x1="320" y1="75" x2="315" y2="15" stroke="#f0d36f" stroke-width="3"/>
    `;
  } 
  else if (normalized.includes("MALTESE FALCON") || normalized.includes("BLACK PEARL")) {
    hullPath = "M 45 120 L 60 100 L 400 100 L 450 85 L 410 125 Z";
    superstructureHtml = `<path d="M 150 100 L 170 85 L 330 85 L 350 100 Z" fill="none" stroke="#f0d36f" stroke-width="2"/>`;
    accessoriesHtml = `
      <g stroke="#f0d36f" stroke-width="2">
        <line x1="140" y1="100" x2="140" y2="25" />
        <line x1="240" y1="85" x2="240" y2="15" />
        <line x1="340" y1="100" x2="340" y2="25" />
        <!-- Horizontal Yardarms mapping -->
        <line x1="110" y1="45" x2="170" y2="45" opacity="0.7"/><line x1="115" y1="70" x2="165" y2="70" opacity="0.7"/>
        <line x1="205" y1="35" x2="275" y2="35" opacity="0.7"/><line x1="210" y1="60" x2="270" y2="60" opacity="0.7"/>
        <line x1="310" y1="45" x2="370" y2="45" opacity="0.7"/><line x1="315" y1="70" x2="365" y2="70" opacity="0.7"/>
      </g>
    `;
  }
  else if (normalized.includes("EOS") || normalized.includes("ATHENA") || normalized.includes("SEA CLOUD") || normalized.includes("AQUIJO")) {
    hullPath = "M 40 120 L 55 105 L 410 105 L 455 85 L 415 125 Z";
    superstructureHtml = `<path d="M 160 105 L 180 92 L 320 92 L 340 105 Z" fill="none" stroke="#f0d36f" stroke-width="2"/>`;
    accessoriesHtml = `
      <g stroke="#f0d36f" stroke-width="1.5">
        <line x1="120" y1="105" x2="105" y2="30" stroke-width="2" />
        <line x1="220" y1="105" x2="210" y2="20" stroke-width="2" />
        <line x1="320" y1="105" x2="310" y2="30" stroke-width="2" />
        <!-- Basic Rigging Lines -->
        <line x1="45" y1="120" x2="105" y2="30" opacity="0.4"/>
        <line x1="105" y1="30" x2="210" y2="20" opacity="0.4"/>
        <line x1="210" y1="20" x2="310" y2="30" opacity="0.4"/>
        <line x1="310" y1="30" x2="415" y2="125" opacity="0.4"/>
      </g>
    `;
  }

  // 3. Ultra-Long Ultra-Sleek Profiles (Azzam, Eclipse, Nord)
  else if (normalized === "AZZAM" || normalized === "ECLIPSE" || normalized === "NORD") {
    hullPath = "M 35 124 L 390 124 L 465 102 L 440 128 L 65 130 Z";
    superstructureHtml = `
      <path d="M 100 110 L 140 86 L 350 86 L 390 110 Z" fill="none" stroke="#f0d36f" stroke-width="2.5" />
      <path d="M 150 86 L 180 68 L 310 68 L 335 86 Z" fill="none" stroke="#f0d36f" stroke-width="2" />
      <path d="M 195 68 L 210 54 L 275 54 L 290 68 Z" fill="none" stroke="#f0d36f" stroke-width="1.5" />
    `;
    accessoriesHtml = `<line x1="240" y1="54" x2="240" y2="34" stroke="#f0d36f" stroke-width="2"/>`;
  }

  // 4. Custom Dark-Hulled Master Superstructures (Limitless, Venus)
  else if (normalized === "LIMITLESS") {
    hullPath = "M 45 122 L 385 122 L 455 95 L 430 126 L 75 128 Z";
    superstructureHtml = `
      <path d="M 150 110 L 150 78 L 330 78 L 375 110 Z" fill="none" stroke="#f0d36f" stroke-width="3" />
      <path d="M 190 78 L 205 58 L 305 58 L 325 78 Z" fill="none" stroke="#f0d36f" stroke-width="2" />
    `;
    accessoriesHtml = `<line x1="250" y1="58" x2="250" y2="38" stroke="#f0d36f" stroke-width="2"/>`;
  }
  else if (normalized === "VENUS") {
    hullPath = "M 50 120 L 410 120 L 450 100 L 430 125 L 70 125 Z";
    superstructureHtml = `
      <rect x="140" y="80" width="220" height="40" fill="none" stroke="#f0d36f" stroke-width="3" rx="4"/>
      <rect x="200" y="58" width="110" height="22" fill="none" stroke="#f0d36f" stroke-width="2" rx="2"/>
    `;
    accessoriesHtml = `<line x1="255" y1="58" x2="255" y2="38" stroke="#f0d36f" stroke-width="2"/>`;
  }

  // 5. Classic Steam/Retro Conversions (Christina O)
  else if (normalized.includes("CHRISTINA O")) {
    hullPath = "M 40 122 L 405 122 L 445 92 L 420 126 L 65 127 Z";
    superstructureHtml = `
      <path d="M 110 112 L 130 82 L 360 82 L 380 112 Z" fill="none" stroke="#f0d36f" stroke-width="2.5" />
      <!-- Distinctive Vintage Central Funnel Stack -->
      <path d="M 220 82 L 230 52 L 265 52 L 260 82 Z" fill="#06101f" stroke="#f0d36f" stroke-width="2.5" />
    `;
    accessoriesHtml = `
      <line x1="135" y1="82" x2="135" y2="40" stroke="#f0d36f" stroke-width="2"/>
      <line x1="355" y1="82" x2="355" y2="35" stroke="#f0d36f" stroke-width="2"/>
    `;
  }

  // 6. Multi-Deck Commercial Scale Mega-Yachts (Dilbar, Rising Sun, Scheherazade, Blue, Opera, Dubai, Al Said)
  else if (["DILBAR", "RISING SUN", "SCHEHERAZADE", "BLUE", "OPERA", "DUBAI", "AL SAID", "PRINCE ABDULAZIZ"].includes(normalized)) {
    hullPath = "M 35 124 L 380 124 L 450 96 L 425 127 L 65 130 Z";
    superstructureHtml = `
      <path d="M 90 114 L 125 76 L 340 76 L 380 114 Z" fill="none" stroke="#f0d36f" stroke-width="3" />
      <path d="M 135 76 L 165 54 L 310 54 L 335 76 Z" fill="none" stroke="#f0d36f" stroke-width="2" />
      <path d="M 180 54 L 200 38 L 275 38 L 295 54 Z" fill="none" stroke="#f0d36f" stroke-width="1.5" />
    `;
    accessoriesHtml = `<line x1="235" y1="38" x2="235" y2="20" stroke="#f0d36f" stroke-width="2"/>`;
    detailsHtml = `
      <circle cx="395" cy="110" r="10" fill="none" stroke="#f0d36f" stroke-width="1" stroke-dasharray="2,2"/>
      <text x="391" y="113" fill="#f0d36f" font-size="8" font-family="sans-serif">H</text>
    `;
  }

  // 7. General Custom Profile Baseline for standard hulls
  else {
    hullPath = "M 40 122 L 380 122 L 445 94 L 420 126 L 75 128 Z";
    superstructureHtml = `
      <path d="M 110 110 L 145 82 L 340 82 L 380 110 Z" fill="none" stroke="#f0d36f" stroke-width="3"/>
      <path d="M 160 82 L 185 60 L 300 60 L 325 82 Z" fill="none" stroke="#f0d36f" stroke-width="2"/>
    `;
    accessoriesHtml = `<line x1="240" y1="60" x2="240" y2="40" stroke="#f0d36f" stroke-width="2"/>`;
  }

  // Assemble dynamic grid, paths and waterlines together
  return `
    <svg class="dynamic-yacht-svg" viewBox="0 0 500 160" xmlns="http://www.w3.org/2000/svg">
      <!-- Blueprint Grid Line -->
      <line x1="20" y1="136" x2="480" y2="136" stroke="#d4af37" stroke-width="1" opacity="0.35" stroke-dasharray="4,4"/>
      
      <!-- Primary Waterline -->
      <line x1="20" y1="124" x2="480" y2="124" stroke="#d4af37" stroke-width="1" opacity="0.45"/>
      
      <!-- Generated Structural Profile Shapes -->
      <path d="${hullPath}" fill="none" stroke="#f0d36f" stroke-width="3.5"/>
      ${superstructureHtml}
      ${accessoriesHtml}
      ${detailsHtml}
      
      <!-- Calibration Layout Elements -->
      <line x1="45" y1="145" x2="445" y2="145" stroke="#f0d36f" stroke-width="1" opacity="0.4"/>
      <line x1="45" y1="141" x2="45" y2="149" stroke="#f0d36f" stroke-width="1"/>
      <line x1="445" y1="141" x2="445" y2="149" stroke="#f0d36f" stroke-width="1"/>
    </svg>
  `;
}

function renderDiagram(){
  if (selectedYacht) {
    document.getElementById("diagramViewer").innerHTML = generateYachtSVG(selectedYacht.name);
  } else {
    document.getElementById("diagramViewer").innerHTML = generateYachtSVG("");
  }
  renderInfo();
}

function renderInfo(){
  if(!selectedYacht) return;

  document.getElementById("infoCard").innerHTML = `
    <a class="vessel-hull" href="${selectedYacht.yachtLink}" target="_blank">
      ${selectedYacht.name}
    </a>

    <a class="owner-plaque" href="${selectedYacht.ownerLink}" target="_blank">
      ◇ ${selectedYacht.deepPockets} ◇
    </a>

    <button class="got-button" onclick="gotYacht()">GOT YACHT!</button>
  `;
}

function searchYacht(){
  const q = document.getElementById("searchBox").value.toLowerCase().trim();
  if(!q) return;

  let index = yachts.findIndex(y => y.name.toLowerCase() === q);

  if(index < 0){
    index = yachts.findIndex(y => y.name.toLowerCase().startsWith(q));
  }

  if(index < 0){
    index = yachts.findIndex(y =>
      y.name.toLowerCase().includes(q) ||
      y.deepPockets.toLowerCase().includes(q)
    );
  }

  if(index >= 0){
    currentIndex = index;
    selectedYacht = yachts[index];
    renderDiagram();
  }
}

function spotYacht(){
  if(!video.videoWidth){
    alert("Camera loading.");
    return;
  }

  const ctx = canvas.getContext("2d");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video,0,0,canvas.width,canvas.height);

  capturedImage = canvas.toDataURL("image/jpeg",0.7);
  preview.src = capturedImage;
  preview.style.display = "block";
  video.style.display = "none";
  document.getElementById("retakeButton").style.display = "block";
}

function retakePhoto(){
  capturedImage = null;
  preview.src = "";
  preview.style.display = "none";
  video.style.display = "block";
  document.getElementById("retakeButton").style.display = "none";
}

function gotYacht(){
  if(!capturedImage){
    alert("Capture yacht photo first.");
    return;
  }

  const sightings = JSON.parse(localStorage.getItem("fleet") || "[]");

  sightings.unshift({
    name:selectedYacht.name,
    deepPockets:selectedYacht.deepPockets,
    yachtLink:selectedYacht.yachtLink,
    ownerLink:selectedYacht.ownerLink,
    image:capturedImage
  });

  localStorage.setItem("fleet",JSON.stringify(sightings));
  renderFleet();
}

function renderFleet(){
  const sightings = JSON.parse(localStorage.getItem("fleet") || "[]");
  const area = document.getElementById("fleetArea");

  if(!sightings.length){
    area.style.display = "none";
    area.innerHTML = "";
    return;
  }

  area.style.display = "block";

  let html = `
    <div class="spotted-heading">GOT YACHT!</div>
    <div class="fleet-row">
  `;

  sightings.forEach((s,index)=>{
    html += `
      <div class="fleet-card" onclick="openFleet(${index})">
        <div class="fleet-porthole"><img src="${s.image}" alt="${s.name}"></div>
        <div class="fleet-name">${s.name}</div>
      </div>
    `;
  });

  html += `</div>`;
  area.innerHTML = html;
}

function openFleet(index){
  const sightings = JSON.parse(localStorage.getItem("fleet") || "[]");
  const s = sightings[index];

  document.getElementById("overlayContent").innerHTML = `
    <a class="vessel-hull" href="${s.yachtLink}" target="_blank">
      ${s.name}
    </a>

    <a class="owner-plaque" href="${s.ownerLink}" target="_blank">
      ◇ ${s.deepPockets} ◇
    </a>

    <img class="overlay-img" src="${s.image}" alt="${s.name}">
  `;

  document.getElementById("overlay").style.display = "block";
}

function hideOverlay(){
  document.getElementById("overlay").style.display = "none";
}

function closeOverlay(e){
  if(e.target.id === "overlay") hideOverlay();
}

function showHomeHelp(){
  document.getElementById("homeOverlay").style.display = "block";
}

function hideHomeHelp(){
  document.getElementById("homeOverlay").style.display = "none";
}

function closeHomeHelp(e){
  if(e.target.id === "homeOverlay") hideHomeHelp();
}

function updateInstallFooter(){
  const standalone =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;

  const footer = document.getElementById("installFooter");
  if(footer){
    footer.style.display = standalone ? "none" : "block";
  }
}

renderDiagram();
renderFleet();
updateInstallFooter();
</script>

</body>
</html>
