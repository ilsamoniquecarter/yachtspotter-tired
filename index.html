<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YachtSpotter Majorca</title>

<link rel="manifest" href="manifest.json" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght=600;700&family=Inter:wght=400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#051122;
  --navy-dark:#02070f;
  --gold:#d4af37;
  --brass:#b9932e;
  --mist:#b8c3d6;
  --panel-bg:#0a192f;
  --panel-border:#1e3557;
  --error:#ff3b30;
  --success:#00ff66;
}

*{box-sizing:border-box;}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter,sans-serif;
  background:radial-gradient(circle at top,#112746 0%,#051122 60%,#01050a 100%);
  color:white;
  padding-bottom: 100px; /* Increased padding to ensure no overlaps with footer */
  position: relative;
}

/* MAIN BINOCULARS STAGE */
.binocular-stage{
  width:min(96vw,760px);
  margin:30px auto 0;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
}

.binoculars{
  width:min(94vw,720px);
  height:min(48vw,330px);
  position:relative;
}

.bridge{
  position:absolute;
  left:50%;
  top:44%;
  width:18%;
  height:22%;
  transform:translate(-50%,-50%);
  border-radius:999px;
  background:
    radial-gradient(circle at 28% 24%,rgba(255,255,255,.42),transparent 22%),
    linear-gradient(145deg,#f8df83 0%,#d4af37 34%,#9d7624 70%,#47320c 100%);
  box-shadow:
    0 16px 32px rgba(0,0,0,.48),
    inset 0 4px 7px rgba(255,255,255,.36),
    inset 0 -8px 13px rgba(0,0,0,.45);
  z-index:1;
}

.barrel{
  position:absolute;
  top:0;
  width:48%;
  height:100%;
  border-radius:50%;
  padding:3.3%;
  background:
    radial-gradient(circle at 27% 17%,rgba(255,255,255,.55),transparent 13%),
    radial-gradient(circle at 72% 82%,rgba(0,0,0,.36),transparent 30%),
    linear-gradient(145deg,#ffe990 0%,#d4af37 30%,#a57b23 58%,#47320c 100%);
  box-shadow:
    0 28px 60px rgba(0,0,0,.54),
    inset 0 5px 9px rgba(255,255,255,.44),
    inset 0 -11px 16px rgba(0,0,0,.48);
  z-index:2;
}

.barrel-left{left:1.5%;}
.barrel-right{right:1.5%;}

.lens{
  width:100%;
  height:100%;
  border-radius:50%;
  overflow:hidden;
  background:#06101f;
  border:2px solid rgba(255,255,255,.15);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    inset 0 0 36px rgba(0,0,0,.86),
    inset 0 0 7px rgba(212,175,55,.48);
}

video,.preview{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.preview{display:none;}

#diagramViewer{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,rgba(212,175,55,.08),transparent 55%),
    #06101f;
}

.dynamic-yacht-svg{
  width:90%;
  height:90%;
}

/* HIGH-DELINEATION TELEMETRY GLASS CONSOLE */
.telemetry-dashboard {
  width: min(92vw, 560px);
  margin: 35px auto 10px;
  display: flex;
  justify-content: space-between;
  gap: 16px;
  background: linear-gradient(180deg, #040d1a 0%, #01050d 100%);
  border: 2px solid var(--panel-border);
  padding: 12px;
  border-radius: 16px;
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
}

.round-gauge {
  flex: 1;
  background: radial-gradient(circle at center, rgba(14, 34, 61, 0.4) 0%, rgba(5, 15, 28, 0.9) 100%);
  border: 3px solid var(--brass);
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px 10px;
  min-height: 85px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.4);
  position: relative;
  text-align: center;
}

.gauge-title {
  font-family: monospace;
  font-size: 9px;
  color: var(--mist);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 6px;
  opacity: 0.6;
}

.gauge-link {
  text-decoration: none;
  color: #ffcc33;
  font-family: "Cormorant Garamond", serif;
  font-weight: 700;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.15;
  text-shadow: 0 0 4px rgba(255, 204, 51, 0.4);
}

.gauge-link.vessel-name-text {
  font-size: 21px;
  letter-spacing: 0.5px;
}

.gauge-link.owner-name-text {
  font-size: 16px;
  color: #e6d39a;
}

/* MAIN SHIP DASHBOARD CONSOLE */
.dashboard-console{
  width:min(92vw,560px);
  margin:15px auto;
  background:linear-gradient(180deg, var(--panel-bg) 0%, #050d1a 100%);
  border:3px solid var(--panel-border);
  border-radius:24px;
  padding:24px;
  box-shadow:0 20px 45px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
  text-align:center;
  position: relative;
}

.dial-grid{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin-bottom:20px;
}

.dial-wrapper{
  display:flex;
  flex-direction:column;
  align-items:center;
  flex: 1;
}

/* Round Dial Interface Elements */
.nautical-dial{
  width:78px;
  height:78px;
  border-radius:50%;
  border:4px solid var(--brass);
  background:radial-gradient(circle at center, #0e223d 0%, #050f1c 100%);
  box-shadow:0 8px 16px rgba(0,0,0,0.4), inset 0 4px 8px rgba(0,0,0,0.6);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  position:relative;
  transition:transform 0.1s ease, border-color 0.2s;
}

.nautical-dial:active{
  transform:scale(0.94);
}

.nautical-dial::before {
  content:'';
  position:absolute;
  inset:2px;
  border-radius:50%;
  border:1px dashed rgba(212, 175, 55, 0.3);
}

/* Status Indicator Beacon */
.dial-status-light {
  position: absolute;
  top: 5px;
  right: 14px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background-color: var(--error);
  box-shadow: 0 0 6px var(--error);
  transition: background-color 0.2s, box-shadow 0.2s;
}

.dial-status-light.armed {
  background-color: var(--success);
  box-shadow: 0 0 10px var(--success);
}

.dial-icon{
  font-size:24px;
  line-height:1;
}

.dial-label{
  font-family:monospace;
  font-size:10px;
  color:var(--gold);
  letter-spacing:1px;
  margin-top:10px;
  text-transform:uppercase;
  font-weight:bold;
  text-align: center;
  max-width: 95px;
  line-height: 1.2;
}

.search-field-wrapper {
  position:relative;
  width:100%;
}

.search{
  width:100%;
  height:44px;
  padding:0 15px;
  border-radius:8px;
  border:2px solid var(--panel-border);
  background:#030812;
  color:white;
  font-family:monospace;
  font-size:13px;
  outline:none;
  text-align:center;
  letter-spacing:1px;
}

.search:focus{
  border-color:var(--gold);
}

.search::placeholder{
  color:rgba(184,195,214,0.4);
}

.retake{
  margin-top:12px;
  color:var(--mist);
  font-family:monospace;
  font-size:11px;
  text-decoration:underline;
  cursor:pointer;
}

/* STORAGE PORTEHOLES ROW */
.spotted-section{
  width:min(92vw,560px);
  margin:25px auto;
  display:none;
  background:rgba(4, 11, 22, 0.4);
  border:1px dashed var(--panel-border);
  border-radius:16px;
  padding:16px;
}

.fleet-row{
  display:flex;
  gap:16px;
  overflow-x:auto;
  padding-bottom:6px;
}

.fleet-card{
  min-width:90px;
  display:flex;
  flex-direction:column;
  align-items:center;
  cursor:pointer;
}

.fleet-porthole{
  width:80px;
  height:80px;
  border-radius:50%;
  padding:5px;
  background:linear-gradient(145deg,#f0d36f,#d4af37,#674d17);
  box-shadow:0 6px 12px rgba(0,0,0,0.4);
}

.fleet-porthole .porthole-asset-frame {
  width:100%;
  height:100%;
  border-radius:50%;
  background:#06101f;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.fleet-porthole img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.fleet-name{
  margin-top:6px;
  text-align:center;
  font-family:"Cormorant Garamond",serif;
  font-size:14px;
  color:var(--mist);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  width:86px;
}

/* POPUP MODULE OVERLAYS */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(2,8,18,.94);
  backdrop-filter:blur(10px);
  display:none;
  z-index:100;
  padding:18px;
}

.overlay-card{
  max-width:420px;
  margin:60px auto;
  border-radius:26px;
  background:linear-gradient(180deg,#0a1d37,#020812);
  border:2px solid var(--brass);
  padding:24px;
  text-align:center;
  box-shadow: 0 20px 50px rgba(0,0,0,0.7);
}

.alert-icon-header {
  font-size: 40px;
  margin-bottom: 12px;
}

.alert-message-text {
  font-size: 16px;
  color: var(--mist);
  line-height: 1.5;
  margin-bottom: 20px;
  font-family: sans-serif;
}

.overlay-img-frame{
  width:100%;
  border-radius:16px;
  margin-top:15px;
  overflow:hidden;
  background:#06101f;
  border:1px solid var(--panel-border);
}

.overlay-img-frame img{
  width:100%;
  display:block;
}

.overlay-close,
.home-close{
  width:100%;
  padding:12px;
  border-radius:999px;
  background:linear-gradient(145deg,#f0d36f,#d4af37 36%,#b9932e 70%,#674d17);
  color:#06101f;
  border:none;
  font-family:"Cormorant Garamond",serif;
  font-weight:700;
  font-size:18px;
  letter-spacing:1px;
  cursor:pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

.home-title{
  font-family:"Cormorant Garamond",serif;
  font-size:28px;
  color:var(--gold);
  margin-top:10px;
  margin-bottom:16px;
}

.home-steps{
  color:var(--mist);
  font-size:15px;
  line-height:1.8;
  margin-bottom: 20px;
}

/* FIX: Absolute baseline placement guarantees visibility across all viewports */
.install{
  position: relative;
  text-align:center;
  margin: 50px auto 30px;
  color:var(--mist);
  font-family:"Cormorant Garamond",serif;
  font-size:15px;
  letter-spacing:1px;
  cursor:pointer;
  width:180px;
  display: block !important;
  visibility: visible !important;
  opacity: 1 !important;
  z-index: 10;
}

.lighthouse-img-icon{
  width:48px !important;
  height:48px !important;
  display: inline-block !important;
  margin-bottom:6px;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,0.5));
}

canvas{display:none;}

@media (max-width: 480px) {
  .telemetry-dashboard {
    gap: 10px;
    padding: 8px;
  }
  .round-gauge {
    padding: 10px 6px;
    min-height: 75px;
  }
  .gauge-link.vessel-name-text {
    font-size: 17px;
  }
  .gauge-link.owner-name-text {
    font-size: 13px;
  }
  .nautical-dial {
    width: 68px;
    height: 68px;
  }
  .dial-label {
    font-size: 9px;
    width: 80px;
  }
}
</style>
</head>

<body>

<div class="binocular-stage">
  <div class="binoculars">
    <div class="bridge"></div>

    <div class="barrel barrel-left">
      <div class="lens">
        <video id="video" autoplay playsinline muted></video>
        <img id="preview" class="preview" alt="Captured viewport frame">
      </div>
    </div>

    <div class="barrel barrel-right">
      <div class="lens">
        <div id="diagramViewer"></div>
      </div>
    </div>
  </div>
</div>

<div class="telemetry-dashboard">
  <div class="round-gauge">
    <div class="gauge-title">Target Ship</div>
    <div id="vesselGaugeContent"></div>
  </div>
  <div class="round-gauge">
    <div class="gauge-title">Registry Owner</div>
    <div id="ownerGaugeContent"></div>
  </div>
</div>

<div class="dashboard-console">
  <div class="dial-grid">
    
    <div class="dial-wrapper">
      <div class="nautical-dial" onclick="captureLivePhoto()">
        <span class="dial-icon">📷</span>
      </div>
      <div class="dial-label">Take Photo</div>
    </div>

    <div class="dial-wrapper">
      <div class="nautical-dial" onclick="browseDatabaseNext()">
        <span class="dial-icon">🧭</span>
      </div>
      <div class="dial-label">Browse Boats</div>
    </div>

    <div class="dial-wrapper">
      <div class="nautical-dial" onclick="triggerLogValidation()">
        <div id="statusLight" class="dial-status-light"></div>
        <span class="dial-icon">⚓</span>
      </div>
      <div class="dial-label">Log Craft</div>
    </div>

  </div>

  <div class="search-field-wrapper">
    <input
      id="searchBox"
      class="search"
      placeholder="STERN SEARCH..."
      oninput="searchYacht()"
      autocorrect="off"
      autocapitalize="none"
      spellcheck="false"
      autocomplete="off"
    />
  </div>
  <div id="retakeButton" class="retake" onclick="retakePhoto()" style="display:none;">Clear Snapshot Frame</div>
</div>

<div id="fleetArea" class="spotted-section"></div>

<div id="installFooter" class="install" onclick="showHomeHelp()">
  <img src="lighthouse.png" class="lighthouse-img-icon" alt="Lighthouse"><br>
  ADD TO HOME SCREEN
</div>

<div id="overlay" class="overlay" onclick="closeOverlay(event)">
  <div class="overlay-card" onclick="event.stopPropagation()">
    <div id="overlayContent"></div>
    <button class="overlay-close" onclick="hideOverlay()" style="margin-top:20px;">Close Sheet</button>
  </div>
</div>

<div id="homeOverlay" class="overlay" onclick="closeHomeHelp(event)">
  <div class="overlay-card" onclick="event.stopPropagation()">
    <img src="lighthouse.png" class="lighthouse-img-icon" alt="Lighthouse">
    <div class="home-title">System Installer</div>
    <div class="home-steps">
      1. Open your browser options menu ⬆<br>
      2. Tap "Add to Home Screen"<br>
      3. Confirm profile link assignment
    </div>
    <button class="home-close" onclick="hideHomeHelp()">Acknowledge</button>
  </div>
</div>

<canvas id="canvas"></canvas>

<script src="data.js?v=22"></script>

<script>
const video = document.getElementById("video");
const preview = document.getElementById("preview");
const canvas = document.getElementById("canvas");

let currentIndex = 0;
let selectedYacht = null;
let capturedImage = null;

// Hardware Camera Initialization 
navigator.mediaDevices.getUserMedia({
  video:{facingMode:{ideal:"environment"}},
  audio:false
})
.then(stream=>{
  video.srcObject = stream;
  video.setAttribute("playsinline", true);
  video.play();
})
.catch(()=>{});

function generateYachtSVG(name, length = 120) {
  const normalized = name ? name.toUpperCase().trim() : "UNKNOWN";
  const yachtLength = length || 120;
  
  let hullPath = "M 40 115 L 370 115 L 450 88 L 420 122 L 75 125 Z";
  let superstructure = `
    <path d="M 110 115 L 140 82 L 340 82 L 375 115 Z" fill="none" stroke="#f0d36f" stroke-width="1.75"/>
    <path d="M 160 82 L 180 56 L 295 56 L 320 82 Z" fill="none" stroke="#f0d36f" stroke-width="1.5"/>
    <path d="M 200 56 L 210 38 L 265 38 L 275 56 Z" fill="none" stroke="#f0d36f" stroke-width="1.5"/>
  `;
  let details = `
    <rect x="175" y="90" width="130" height="8" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.7"/>
    <circle cx="95" cy="120" r="1.5" fill="none" stroke="#d4af37"/>
  `;

  if (normalized === "A" || normalized.includes("MOTOR YACHT A ")) {
    hullPath = "M 45 122 L 105 78 L 340 78 L 440 112 L 455 122 L 70 124 Z";
    superstructure = `
      <path d="M 155 78 L 175 48 L 280 48 L 315 78 Z" fill="none" stroke="#f0d36f" stroke-width="2" />
      <path d="M 195 48 L 205 32 L 255 32 L 265 48 Z" fill="none" stroke="#f0d36f" stroke-width="1.5" />
    `;
    details = `
      <path d="M 210 56 L 240 56 L 255 68 L 225 68 Z" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.8"/>
    `;
  }
  else if (normalized.includes("SAILING YACHT A")) {
    hullPath = "M 50 124 L 80 92 L 390 92 L 445 114 L 435 126 L 70 126 Z";
    superstructure = `
      <path d="M 130 92 L 150 70 L 350 70 L 370 92 Z" fill="none" stroke="#f0d36f" stroke-width="2" />
    `;
    details = `
      <line x1="245" y1="56" x2="240" y2="2" stroke="#f0d36f" stroke-width="2.5"/>
    `;
  } 

  return `
    <svg class="dynamic-yacht-svg" viewBox="0 0 500 160" xmlns="http://www.w3.org/2000/svg">
      <line x1="15" y1="124" x2="485" y2="124" stroke="#f0d36f" stroke-width="1.25" opacity="0.75"/>
      <g fill="none">
        <path d="${hullPath}" stroke="#f0d36f" stroke-width="2"/>
        ${superstructure}
        ${details}
      </g>
    </svg>
  `;
}

/* FIX: Synchronized render pipeline triggers database reads simultaneously */
function refreshDashboard() {
  if (typeof yachts !== 'undefined' && yachts.length > 0) {
    selectedYacht = yachts[currentIndex];
  }
  
  if (!selectedYacht) return;

  // 1. Force reload vector canvas view frame
  document.getElementById("diagramViewer").innerHTML = generateYachtSVG(selectedYacht.name, selectedYacht.length);
  
  // 2. Refresh active digital telemetry outputs
  document.getElementById("vesselGaugeContent").innerHTML = `
    <a class="gauge-link vessel-name-text" href="${selectedYacht.yachtLink}" target="_blank">
      ${selectedYacht.name}
    </a>
  `;

  document.getElementById("ownerGaugeContent").innerHTML = `
    <a class="gauge-link owner-name-text" href="${selectedYacht.ownerLink}" target="_blank">
      ${selectedYacht.deepPockets}
    </a>
  `;
}

function searchYacht(){
  const q = document.getElementById("searchBox").value.toLowerCase().trim();
  if(!q || typeof yachts === 'undefined') return;

  let index = yachts.findIndex(y => y.name.toLowerCase() === q);
  if(index < 0){
    index = yachts.findIndex(y => y.name.toLowerCase().startsWith(q));
  }
  if(index < 0){
    index = yachts.findIndex(y =>
      y.name.toLowerCase().includes(q) ||
      y.deepPockets.toLowerCase().includes(q)
    );
  }

  if(index >= 0){
    currentIndex = index;
    refreshDashboard();
  }
}

/* FIX: Increments array loop pointers safely and commands an immediate unified refresh */
function browseDatabaseNext(){
  if (typeof yachts === 'undefined' || yachts.length === 0) return;
  
  currentIndex = (currentIndex + 1) % yachts.length;
  document.getElementById("searchBox").value = yachts[currentIndex].name;
  
  refreshDashboard(); 
}

function captureLivePhoto() {
  if(!video.videoWidth || !video.videoHeight){
    return;
  }
  
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  
  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  capturedImage = canvas.toDataURL("image/jpeg", 0.85);
  
  preview.src = capturedImage;
  preview.style.display = "block";
  video.style.display = "none";
  document.getElementById("retakeButton").style.display = "block";

  document.getElementById("statusLight").className = "dial-status-light armed";
}

function retakePhoto(){
  capturedImage = null;
  preview.src = "";
  preview.style.display = "none";
  video.style.display = "block";
  document.getElementById("retakeButton").style.display = "none";

  document.getElementById("statusLight").className = "dial-status-light";
}

function triggerLogValidation() {
  if (!selectedYacht) return;

  // 1. Missing Photo Alert Prompt
  if (!capturedImage) {
    triggerConsoleAlert("📷 CAPTURE REQUIRED", "Photo capture required! Please snap a picture using the Camera Shutter dial before logging this craft.");
    return;
  }

  // 2. Duplicate Processing Scan
  const currentFleet = JSON.parse(localStorage.getItem("fleet") || "[]");
  const alreadyLogged = currentFleet.some(item => item.name.toLowerCase() === selectedYacht.name.toLowerCase());

  if (alreadyLogged) {
    triggerConsoleAlert("⚓ CRAFT RECORDED", `Operation Aborted: <strong>${selectedYacht.name}</strong> is already anchored in your fleet data bank.`);
    return;
  }

  commitFleetEntry();
}

function triggerConsoleAlert(header, message) {
  document.getElementById("overlayContent").innerHTML = `
    <div class="alert-icon-header">⚠️</div>
    <div style="font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:700; color:var(--gold); margin-bottom:10px;">${header}</div>
    <div class="alert-message-text">${message}</div>
  `;
  document.getElementById("overlay").style.display = "block";
}

function commitFleetEntry(){
  const sightings = JSON.parse(localStorage.getItem("fleet") || "[]");
  sightings.unshift({
    name: selectedYacht.name,
    deepPockets: selectedYacht.deepPockets,
    yachtLink: selectedYacht.yachtLink,
    ownerLink: selectedYacht.ownerLink,
    asset: capturedImage
  });

  localStorage.setItem("fleet", JSON.stringify(sightings));
  renderFleet();
  retakePhoto();
}

function renderFleet(){
  const sightings = JSON.parse(localStorage.getItem("fleet") || "[]");
  const area = document.getElementById("fleetArea");

  if(!sightings.length){
    area.style.display = "none";
    area.innerHTML = "";
    return;
  }

  area.style.display = "block";

  let html = `<div class="fleet-row">`;
  sightings.forEach((s,index)=>{
    html += `
      <div class="fleet-card" onclick="openFleet(${index})">
        <div class="fleet-porthole">
          <div class="porthole-asset-frame">
             <img src="${s.asset}" alt="Craft Photo">
          </div>
        </div>
        <div class="fleet-name">${s.name}</div>
      </div>
    `;
  });
  html += `</div>`;
  area.innerHTML = html;
}

function openFleet(index){
  const sightings = JSON.parse(localStorage.getItem("fleet") || "[]");
  const s = sightings[index];

  document.getElementById("overlayContent").innerHTML = `
    <div style="font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:700; color:var(--gold); margin-bottom:4px;">
      ${s.name}
    </div>
    <div style="font-family:'Cormorant Garamond',serif; font-size:18px; color:var(--mist); margin-bottom:12px;">
      Owner: ${s.deepPockets}
    </div>
    <div class="overlay-img-frame">
       <img src="${s.asset}" alt="Craft Snapshot">
    </div>
  `;
  document.getElementById("overlay").style.display = "block";
}

function hideOverlay(){
  document.getElementById("overlay").style.display = "none";
}

function closeOverlay(e){
  if(e.target.id === "overlay") hideOverlay();
}

function showHomeHelp(){
  document.getElementById("homeOverlay").style.display = "block";
}

function hideHomeHelp(){
  document.getElementById("homeOverlay").style.display = "none";
}

function closeHomeHelp(e){
  if(e.target.id === "homeOverlay") hideHomeHelp();
}

// Initial Boot Sequence Execution
window.addEventListener("DOMContentLoaded", () => {
  refreshDashboard();
  renderFleet();
});
</script>

</body>
</html>
