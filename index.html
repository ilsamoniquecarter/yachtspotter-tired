<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YachtSpotter</title>
</head>
<body>
    <h1>YachtSpotter // Tactical Matrix</h1>
    <div id="yacht-container"></div>

    <script src="data.js" defer></script>
    
    <script>
        // This waits for the window to fully load, then tries to read the data
        window.addEventListener('load', () => {
            console.log("Checking data...");
            if (typeof yachts !== 'undefined') {
                console.log("Data found:", yachts);
                const container = document.getElementById('yacht-container');
                yachts.forEach(yacht => {
                    const div = document.createElement('div');
                    div.innerHTML = `<h3>${yacht.name}</h3><p>Owner: ${yacht.deepPockets}</p>`;
                    container.appendChild(div);
                });
            } else {
                console.error("Data still undefined. Check file path or file content.");
            }
        });
    </script>
</body>
</html>
