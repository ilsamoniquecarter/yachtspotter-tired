<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YachtSpotter Majorca</title>

<link rel="manifest" href="manifest.json" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght=500;600;700&family=Inter:wght=400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#051122;
  --navy-dark:#02070f;
  --gold:#d4af37;
  --brass:#b9932e;
  --mist:#b8c3d6;
  --panel-bg:#0a192f;
  --panel-border:#1e3557;
}

*{box-sizing:border-box;}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter,sans-serif;
  background:radial-gradient(circle at top,#112746 0%,#051122 60%,#01050a 100%);
  color:white;
  padding-bottom: 40px;
}

/* MAIN BINOCULARS */
.binocular-stage{
  width:min(96vw,760px);
  margin:40px auto 0;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
}

.binoculars{
  width:min(94vw,720px);
  height:min(48vw,330px);
  position:relative;
}

.bridge{
  position:absolute;
  left:50%;
  top:44%;
  width:18%;
  height:22%;
  transform:translate(-50%,-50%);
  border-radius:999px;
  background:
    radial-gradient(circle at 28% 24%,rgba(255,255,255,.42),transparent 22%),
    linear-gradient(145deg,#f8df83 0%,#d4af37 34%,#9d7624 70%,#47320c 100%);
  box-shadow:
    0 16px 32px rgba(0,0,0,.48),
    inset 0 4px 7px rgba(255,255,255,.36),
    inset 0 -8px 13px rgba(0,0,0,.45);
  z-index:1;
}

.barrel{
  position:absolute;
  top:0;
  width:48%;
  height:100%;
  border-radius:50%;
  padding:3.3%;
  background:
    radial-gradient(circle at 27% 17%,rgba(255,255,255,.55),transparent 13%),
    radial-gradient(circle at 72% 82%,rgba(0,0,0,.36),transparent 30%),
    linear-gradient(145deg,#ffe990 0%,#d4af37 30%,#a57b23 58%,#47320c 100%);
  box-shadow:
    0 28px 60px rgba(0,0,0,.54),
    inset 0 5px 9px rgba(255,255,255,.44),
    inset 0 -11px 16px rgba(0,0,0,.48);
  z-index:2;
}

.barrel-left{left:1.5%;}
.barrel-right{right:1.5%;}

.lens{
  width:100%;
  height:100%;
  border-radius:50%;
  overflow:hidden;
  background:#06101f;
  border:2px solid rgba(255,255,255,.15);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    inset 0 0 36px rgba(0,0,0,.86),
    inset 0 0 7px rgba(212,175,55,.48);
}

video,.preview{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.preview{display:none;}

#diagramViewer{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,rgba(212,175,55,.08),transparent 55%),
    #06101f;
}

.dynamic-yacht-svg{
  width:90%;
  height:90%;
}

/* INSTRUMENT PANEL / SHIP DASHBOARD */
.dashboard-console{
  width:min(92vw,560px);
  margin:30px auto;
  background:linear-gradient(180deg, var(--panel-bg) 0%, #050d1a 100%);
  border:3px solid var(--panel-border);
  border-radius:24px;
  padding:24px;
  box-shadow:0 20px 45px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
  text-align:center;
}

.console-heading{
  font-family:monospace;
  font-size:11px;
  color:var(--panel-border);
  letter-spacing:3px;
  text-transform:uppercase;
  margin-bottom:20px;
}

.dial-grid{
  display:flex;
  justify-content:space-around;
  align-items:center;
  gap:10px;
  margin-bottom:25px;
}

.dial-wrapper{
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* Round Dial Interface Elements */
.nautical-dial{
  width:72px;
  height:72px;
  border-radius:50%;
  border:4px solid #b9932e;
  background:radial-gradient(circle at center, #0e223d 0%, #050f1c 100%);
  box-shadow:0 8px 16px rgba(0,0,0,0.4), inset 0 4px 8px rgba(0,0,0,0.6);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  position:relative;
  transition:transform 0.1s ease;
}

.nautical-dial:active{
  transform:scale(0.95);
}

.nautical-dial::before {
  content:'';
  position:absolute;
  inset:2px;
  border-radius:50%;
  border:1px dashed rgba(212, 175, 55, 0.3);
}

.dial-icon{
  font-size:24px;
  line-height:1;
}

.dial-label{
  font-family:monospace;
  font-size:10px;
  color:var(--gold);
  letter-spacing:1px;
  margin-top:8px;
  text-transform:uppercase;
  font-weight:bold;
}

/* Heavy Mechanical Toggle Toggle Mechanism */
.toggle-switch-box {
  width:65px;
  height:72px;
  background:#040a12;
  border:2px solid var(--panel-border);
  border-radius:8px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  align-items:center;
  padding:6px 0;
  cursor:pointer;
}

.toggle-indicator{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#203311;
  box-shadow:inset 0 1px 2px rgba(0,0,0,0.8);
  transition:background 0.2s, box-shadow 0.2s;
}

.toggle-indicator.active{
  background:#00ff66;
  box-shadow:0 0 8px #00ff66, inset 0 1px 0 rgba(255,255,255,0.4);
}

.toggle-lever{
  width:12px;
  height:26px;
  background:linear-gradient(90deg, #8c96a3, #cbd3de, #59616b);
  border-radius:4px;
  border-bottom:4px solid #333;
  box-shadow:0 4px 6px rgba(0,0,0,0.4);
  transform:translateY(2px);
  transition:transform 0.15s;
}

.toggle-switch-box:active .toggle-lever{
  transform:translateY(-2px);
}

.search-field-wrapper {
  position:relative;
  width:100%;
}

.search{
  width:100%;
  height:44px;
  padding:0 15px;
  border-radius:8px;
  border:2px solid var(--panel-border);
  background:#030812;
  color:white;
  font-family:monospace;
  font-size:13px;
  outline:none;
  text-align:center;
  letter-spacing:1px;
}

.search:focus{
  border-color:var(--gold);
}

.search::placeholder{
  color:rgba(184,195,214,0.4);
}

.retake{
  margin-top:12px;
  color:var(--mist);
  font-family:monospace;
  font-size:11px;
  text-decoration:underline;
  cursor:pointer;
}

/* IDENTIFICATION DISPLAY */
.info-card{
  width:min(92vw,560px);
  margin:0 auto 24px;
  text-align:center;
}

.vessel-hull{
  display:block;
  width:min(88vw,420px);
  margin:0 auto 12px;
  padding:14px;
  text-decoration:none;
  color:#06101f;
  font-family:"Cormorant Garamond",serif;
  font-size:26px;
  line-height:1;
  font-weight:700;
  letter-spacing:1.5px;
  background:linear-gradient(145deg,#f0d36f,#d4af37 36%,#b9932e 70%,#674d17);
  clip-path:polygon(6% 0%,94% 0%,100% 50%,94% 100%,6% 100%,0% 50%);
}

.owner-plaque{
  display:inline-block;
  min-width:min(82vw,340px);
  padding:10px 20px;
  border-radius:999px;
  border:1px solid rgba(212,175,55,.42);
  background:rgba(6,16,31,.75);
  color:var(--gold);
  text-decoration:none;
  font-family:"Cormorant Garamond",serif;
  font-size:20px;
}

/* STORAGE PORTEHOLES ROW */
.spotted-section{
  width:min(92vw,560px);
  margin:30px auto;
  display:none;
  background:rgba(4, 11, 22, 0.4);
  border:1px dashed var(--panel-border);
  border-radius:16px;
  padding:16px;
}

.fleet-row{
  display:flex;
  gap:16px;
  overflow-x:auto;
  padding-bottom:6px;
}

.fleet-card{
  min-width:90px;
  display:flex;
  flex-direction:column;
  align-items:center;
  cursor:pointer;
}

.fleet-porthole{
  width:80px;
  height:80px;
  border-radius:50%;
  padding:5px;
  background:linear-gradient(145deg,#f0d36f,#d4af37,#674d17);
  box-shadow:0 6px 12px rgba(0,0,0,0.4);
}

.fleet-porthole .porthole-asset-frame {
  width:100%;
  height:100%;
  border-radius:50%;
  background:#06101f;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.fleet-porthole img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.fleet-porthole svg {
  width:115%;
  height:115%;
}

.fleet-name{
  margin-top:6px;
  text-align:center;
  font-family:"Cormorant Garamond",serif;
  font-size:14px;
  color:var(--mist);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  width:86px;
}

/* POPUP MODULE OVERLAYS */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(2,8,18,.92);
  backdrop-filter:blur(10px);
  display:none;
  z-index:50;
  padding:18px;
}

.overlay-card{
  max-width:420px;
  margin:40px auto;
  border-radius:26px;
  background:linear-gradient(180deg,#0a1d37,#020812);
  border:1px solid rgba(212,175,55,.3);
  padding:20px;
  text-align:center;
}

.overlay-img-frame{
  width:100%;
  border-radius:16px;
  margin-top:15px;
  overflow:hidden;
  background:#06101f;
  border:1px solid var(--panel-border);
}

.overlay-img-frame img{
  width:100%;
  display:block;
}

.overlay-img-frame svg{
  width:100%;
  padding:10px;
}

.overlay-close,
.home-close{
  width:100%;
  margin-top:20px;
  padding:12px;
  border-radius:999px;
  background:linear-gradient(145deg,#f0d36f,#d4af37 36%,#b9932e 70%,#674d17);
  color:#06101f;
  border:none;
  font-family:"Cormorant Garamond",serif;
  font-weight:700;
  font-size:18px;
  letter-spacing:1px;
  cursor:pointer;
}

.home-title{
  font-family:"Cormorant Garamond",serif;
  font-size:28px;
  color:var(--gold);
  margin-top:10px;
  margin-bottom:16px;
}

.home-steps{
  color:var(--mist);
  font-size:15px;
  line-height:1.8;
}

/* SHIPS LIGHTHOUSE ANCHOR FOOTER */
.install{
  text-align:center;
  margin:50px auto 20px;
  color:var(--mist);
  font-family:"Cormorant Garamond",serif;
  font-size:16px;
  letter-spacing:1px;
  cursor:pointer;
  width:fit-content;
}

.lighthouse-img-icon{
  width:50px;
  height:50px;
  object-fit:contain;
  margin-bottom:8px;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,0.5));
}

canvas{display:none;}
</style>
</head>

<body>

<div class="binocular-stage">
  <div class="binoculars">
    <div class="bridge"></div>

    <div class="barrel barrel-left">
      <div class="lens">
        <video id="video" autoplay playsinline muted></video>
        <img id="preview" class="preview" alt="Captured viewport frame">
      </div>
    </div>

    <div class="barrel barrel-right">
      <div class="lens">
        <div id="diagramViewer"></div>
      </div>
    </div>
  </div>
</div>

<div class="dashboard-console">
  <div class="console-heading">Bridge Control Console</div>
  
  <div class="dial-grid">
    <div class="dial-wrapper">
      <div class="nautical-dial" onclick="captureLivePhoto()">
        <span class="dial-icon">📷</span>
      </div>
      <div class="dial-label">Shutter</div>
    </div>

    <div class="dial-wrapper">
      <div class="nautical-dial" onclick="browseDatabaseNext()">
        <span class="dial-icon">🧭</span>
      </div>
      <div class="dial-label">Browse</div>
    </div>

    <div class="dial-wrapper">
      <div class="toggle-switch-box" onclick="triggerToggleCommit()">
        <div id="toggleIndicator" class="toggle-indicator"></div>
        <div class="toggle-lever"></div>
      </div>
      <div class="dial-label">Log Vessel</div>
    </div>
  </div>

  <div class="search-field-wrapper">
    <input
      id="searchBox"
      class="search"
      placeholder="SYS REGISTRY SEARCH..."
      oninput="searchYacht()"
      autocorrect="off"
      autocapitalize="none"
      spellcheck="false"
      autocomplete="off"
    />
  </div>
  <div id="retakeButton" class="retake" onclick="retakePhoto()" style="display:none;">Clear Snapshot Frame</div>
</div>

<div id="infoCard" class="info-card"></div>

<div id="fleetArea" class="spotted-section"></div>

<div id="installFooter" class="install" onclick="showHomeHelp()">
  <img src="lighthouse.png" class="lighthouse-img-icon" alt="Lighthouse"><br>
  ADD TO HOME SCREEN
</div>

<div id="overlay" class="overlay" onclick="closeOverlay(event)">
  <div class="overlay-card" onclick="event.stopPropagation()">
    <div id="overlayContent"></div>
    <button class="overlay-close" onclick="hideOverlay()">Close Sheet</button>
  </div>
</div>

<div id="homeOverlay" class="overlay" onclick="closeHomeHelp(event)">
  <div class="overlay-card" onclick="event.stopPropagation()">
    <img src="lighthouse.png" class="lighthouse-img-icon" alt="Lighthouse">
    <div class="home-title">System Installer</div>
    <div class="home-steps">
      1. Open your browser options menu ⬆<br>
      2. Tap "Add to Home Screen"<br>
      3. Confirm profile link assignment
    </div>
    <button class="home-close" onclick="hideHomeHelp()">Acknowledge</button>
  </div>
</div>

<canvas id="canvas"></canvas>

<script src="data.js?v=22"></script>

<script>
const video = document.getElementById("video");
const preview = document.getElementById("preview");
const canvas = document.getElementById("canvas");

let currentIndex = 0;
let selectedYacht = yachts[0];
let capturedImage = null;

// Clean stream acquisition initializer 
navigator.mediaDevices.getUserMedia({
  video:{facingMode:{ideal:"environment"}},
  audio:false
})
.then(stream=>{
  video.srcObject = stream;
  video.setAttribute("playsinline", true);
  video.play();
})
.catch(()=>{/* Standby state if hardware blocks */});

function generateYachtSVG(name, length = 120) {
  const normalized = name ? name.toUpperCase().trim() : "UNKNOWN";
  const yachtLength = length || 120;
  
  let hullPath = "M 40 115 L 370 115 L 450 88 L 420 122 L 75 125 Z";
  let superstructure = `
    <path d="M 110 115 L 140 82 L 340 82 L 375 115 Z" fill="none" stroke="#f0d36f" stroke-width="1.75"/>
    <path d="M 160 82 L 180 56 L 295 56 L 320 82 Z" fill="none" stroke="#f0d36f" stroke-width="1.5"/>
    <path d="M 200 56 L 210 38 L 265 38 L 275 56 Z" fill="none" stroke="#f0d36f" stroke-width="1.5"/>
    <path d="M 250 38 L 262 18 L 274 18 L 268 38" fill="none" stroke="#f0d36f" stroke-width="1"/>
  `;
  let details = `
    <rect x="175" y="90" width="130" height="8" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.7"/>
    <rect x="200" y="64" width="65" height="6" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.7"/>
    <circle cx="95" cy="120" r="1.5" fill="none" stroke="#d4af37"/><circle cx="115" cy="120" r="1.5" fill="none" stroke="#d4af37"/><circle cx="135" cy="120" r="1.5" fill="none" stroke="#d4af37"/>
  `;

  if (normalized === "A" || normalized.includes("MOTOR YACHT A ")) {
    hullPath = "M 45 122 L 105 78 L 340 78 L 440 112 L 455 122 L 70 124 Z";
    superstructure = `
      <path d="M 155 78 L 175 48 L 280 48 L 315 78 Z" fill="none" stroke="#f0d36f" stroke-width="2" />
      <path d="M 195 48 L 205 32 L 255 32 L 265 48 Z" fill="none" stroke="#f0d36f" stroke-width="1.5" />
      <path d="M 120 78 L 140 68 L 155 78" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.6"/>
    `;
    details = `
      <path d="M 210 56 L 240 56 L 255 68 L 225 68 Z" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.8"/>
      <path d="M 185 86 L 295 86 L 285 96 L 195 96 Z" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.4"/>
      <rect x="330" y="90" width="35" height="15" fill="none" stroke="#d4af37" stroke-width="0.75" stroke-dasharray="2,1" opacity="0.6"/>
      <rect x="75" y="96" width="20" height="10" fill="none" stroke="#d4af37" stroke-width="0.75" stroke-dasharray="2,1" opacity="0.6"/>
    `;
  }
  else if (normalized.includes("SAILING YACHT A")) {
    hullPath = "M 50 124 L 80 92 L 390 92 L 445 114 L 435 126 L 70 126 Z";
    superstructure = `
      <path d="M 130 92 L 150 70 L 350 70 L 370 92 Z" fill="none" stroke="#f0d36f" stroke-width="2" />
      <path d="M 180 70 L 195 56 L 310 56 L 325 70 Z" fill="none" stroke="#f0d36f" stroke-width="1.5" />
    `;
    details = `
      <line x1="160" y1="70" x2="142" y2="8" stroke="#f0d36f" stroke-width="2.5"/>
      <line x1="245" y1="56" x2="240" y2="2" stroke="#f0d36f" stroke-width="2.5"/>
      <line x1="330" y1="70" x2="322" y2="8" stroke="#f0d36f" stroke-width="2.5"/>
      <path d="M 142 8 Q 185 35 160 70 M 240 2 Q 290 30 245 56 M 322 8 Q 365 35 330 70" fill="none" stroke="#d4af37" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.5"/>
      <circle cx="241" cy="20" r="3" fill="#06101f" stroke="#f0d36f" stroke-width="1"/>
    `;
  } 
  else if (normalized.includes("MALTESE FALCON") || normalized.includes("BLACK PEARL")) {
    hullPath = "M 42 118 L 58 96 L 410 96 L 452 80 L 415 124 Z";
    superstructure = `
      <path d="M 160 96 L 175 78 L 340 78 L 360 96 Z" fill="none" stroke="#f0d36f" stroke-width="2"/>
      <path d="M 210 78 L 220 64 L 295 64 L 305 78 Z" fill="none" stroke="#f0d36f" stroke-width="1.25"/>
    `;
    details = `
      <g stroke="#f0d36f" fill="none">
        <line x1="145" y1="96" x2="145" y2="15" stroke-width="2" />
        <line x1="245" y1="78" x2="245" y2="5" stroke-width="2" />
        <line x1="345" y1="96" x2="345" y2="15" stroke-width="2" />
        <path d="M 120 30 Q 145 37 170 30 M 115 50 Q 145 57 175 50 M 110 70 Q 145 77 180 70 M 105 90 Q 145 97 185 90" stroke-width="1" opacity="0.85"/>
        <path d="M 220 20 Q 245 27 270 20 M 215 40 Q 245 47 275 40 M 210 60 Q 245 67 280 60 M 205 76 Q 245 83 285 76" stroke-width="1" opacity="0.85"/>
        <path d="M 320 30 Q 345 37 370 30 M 315 50 Q 345 57 375 50 M 310 70 Q 345 77 380 70 M 305 90 Q 345 97 385 90" stroke-width="1" opacity="0.85"/>
      </g>
    `;
  }
  else if (normalized === "AZZAM" || normalized === "ECLIPSE" || normalized === "NORD") {
    hullPath = "M 35 120 L 400 120 L 470 98 L 445 125 L 65 126 Z";
    superstructure = `
      <path d="M 95 120 L 135 92 L 365 92 L 400 120 Z" fill="none" stroke="#f0d36f" stroke-width="2.5" />
      <path d="M 145 92 L 175 70 L 325 70 L 350 92 Z" fill="none" stroke="#f0d36f" stroke-width="2" />
      <path d="M 190 70 L 205 52 L 290 52 L 305 70 Z" fill="none" stroke="#f0d36f" stroke-width="1.5" />
      <path d="M 220 52 L 230 38 L 270 38 L 280 52 Z" fill="none" stroke="#f0d36f" stroke-width="1" />
    `;
    details = `
      <line x1="155" y1="104" x2="340" y2="104" stroke="#d4af37" stroke-width="1.75" opacity="0.8"/>
      <line x1="190" y1="80" x2="300" y2="80" stroke="#d4af37" stroke-width="1.5" opacity="0.8"/>
      <line x1="235" y1="60" x2="275" y2="60" stroke="#d4af37" stroke-width="1" opacity="0.7"/>
      <line x1="40" y1="121" x2="55" y2="121" stroke="#d4af37" stroke-width="0.5"/>
      <line x1="42" y1="123" x2="52" y2="123" stroke="#d4af37" stroke-width="0.5"/>
    `;
  }
  else if (["DILBAR", "BLUE", "SCHEHERAZADE", "OPERA", "DUBAI"].includes(normalized)) {
    hullPath = "M 35 122 L 385 122 L 455 92 L 425 125 L 65 127 Z";
    superstructure = `
      <path d="M 85 122 L 115 80 L 355 80 L 390 122 Z" fill="none" stroke="#f0d36f" stroke-width="2.5" />
      <path d="M 120 80 L 142 54 L 325 54 L 345 80 Z" fill="none" stroke="#f0d36f" stroke-width="2" />
      <path d="M 165 54 L 185 34 L 290 34 L 305 54 Z" fill="none" stroke="#f0d36f" stroke-width="1.5" />
      <path d="M 205 34 L 215 18 L 265 18 L 275 34 Z" fill="none" stroke="#f0d36f" stroke-width="1" />
    `;
    details = `
      <line x1="395" y1="108" x2="445" y2="108" stroke="#d4af37" stroke-width="1"/>
      <circle cx="420" cy="108" r="9" fill="none" stroke="#d4af37" stroke-width="0.75" stroke-dasharray="2,2"/>
      <text x="420" y="111" font-family="monospace" font-size="5" fill="#d4af37" text-anchor="middle" opacity="0.7">H</text>
      <rect x="145" y="92" width="180" height="6" fill="none" stroke="#d4af37" stroke-width="0.75" opacity="0.8"/>
      <rect x="175" y="64" width="120" height="5" fill="none" stroke="#d4af37" stroke-width="0.75" opacity="0.8"/>
    `;
  }

  return `
    <svg class="dynamic-yacht-svg" viewBox="0 0 500 160" xmlns="http://www.w3.org/2000/svg">
      <g stroke="#d4af37" stroke-width="0.25" opacity="0.12">
        <line x1="0" y1="10" x2="500" y2="10" /><line x1="0" y1="30" x2="500" y2="30" /><line x1="0" y1="50" x2="500" y2="50" /><line x1="0" y1="70" x2="500" y2="70" /><line x1="0" y1="90" x2="500" y2="90" /><line x1="0" y1="110" x2="500" y2="110" /><line x1="0" y1="130" x2="500" y2="130" /><line x1="0" y1="150" x2="500" y2="150" />
      </g>
      <g stroke="#d4af37" stroke-width="0.5" opacity="0.22">
        <line x1="0" y1="20" x2="500" y2="20" /><line x1="0" y1="40" x2="500" y2="40" /><line x1="0" y1="60" x2="500" y2="60" /><line x1="0" y1="80" x2="500" y2="80" /><line x1="0" y1="100" x2="500" y2="100" /><line x1="0" y1="140" x2="500" y2="140" />
        <line x1="50" y1="0" x2="50" y2="160" /><line x1="100" y1="0" x2="100" y2="160" /><line x1="150" y1="0" x2="150" y2="160" /><line x1="200" y1="0" x2="200" y2="160" /><line x1="250" y1="0" x2="250" y2="160" /><line x1="300" y1="0" x2="300" y2="160" /><line x1="350" y1="0" x2="350" y2="160" /><line x1="400" y1="0" x2="400" y2="160" /><line x1="450" y1="0" x2="450" y2="160" />
      </g>
      <line x1="15" y1="124" x2="485" y2="124" stroke="#f0d36f" stroke-width="1.25" opacity="0.75"/>
      <g fill="none">
        <path d="${hullPath}" stroke="#f0d36f" stroke-width="2"/>
        ${superstructure}
        ${details}
      </g>
      <g font-family="Inter, sans-serif" font-size="6.5" fill="#d4af37" font-weight="600" text-anchor="middle">
        <text x="50" y="156">AFT 0m</text>
        <text x="245" y="156">${yachtLength}m FRAME</text>
        <text x="440" y="156">FWD</text>
      </g>
    </svg>
  `;
}

function renderDiagram(){
  if (selectedYacht) {
    document.getElementById("diagramViewer").innerHTML = generateYachtSVG(selectedYacht.name, selectedYacht.length);
  } else {
    document.getElementById("diagramViewer").innerHTML = generateYachtSVG("", 120);
  }
  renderInfo();
}

function renderInfo(){
  if(!selectedYacht) return;

  document.getElementById("infoCard").innerHTML = `
    <a class="vessel-hull" href="${selectedYacht.yachtLink}" target="_blank">
      ${selectedYacht.name}
    </a>
    <a class="owner-plaque" href="${selectedYacht.ownerLink}" target="_blank">
      ◇ ${selectedYacht.deepPockets} ◇
    </a>
  `;
}

function searchYacht(){
  const q = document.getElementById("searchBox").value.toLowerCase().trim();
  if(!q) return;

  let index = yachts.findIndex(y => y.name.toLowerCase() === q);
  if(index < 0){
    index = yachts.findIndex(y => y.name.toLowerCase().startsWith(q));
  }
  if(index < 0){
    index = yachts.findIndex(y =>
      y.name.toLowerCase().includes(q) ||
      y.deepPockets.toLowerCase().includes(q)
    );
  }

  if(index >= 0){
    currentIndex = index;
    selectedYacht = yachts[index];
    renderDiagram();
  }
}

/* FIX: Refactored target dimension sampling maps to guarantee accurate extraction */
function captureLivePhoto() {
  if(!video.videoWidth || !video.videoHeight){
    alert("Instrument Sync Error: Camera stream not stable yet.");
    return;
  }
  
  // Set dimensions directly to canvas element context properties
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  
  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  capturedImage = canvas.toDataURL("image/jpeg", 0.85);
  
  // Update viewports
  preview.src = capturedImage;
  preview.style.display = "block";
  video.style.display = "none";
  document.getElementById("retakeButton").style.display = "block";
}

function browseDatabaseNext(){
  currentIndex = (currentIndex + 1) % yachts.length;
  selectedYacht = yachts[currentIndex];
  
  document.getElementById("searchBox").value = selectedYacht.name;
  renderDiagram();
}

function retakePhoto(){
  capturedImage = null;
  preview.src = "";
  preview.style.display = "none";
  video.style.display = "block";
  document.getElementById("retakeButton").style.display = "none";
}

/* Mechanical Lever Switch Action Logic */
function triggerToggleCommit() {
  const ind = document.getElementById("toggleIndicator");
  ind.classList.add("active");
  
  // Commit sequence dispatch
  setTimeout(() => {
    gotYacht();
    ind.classList.remove("active");
  }, 250);
}

function gotYacht(){
  let finalAssetData = null;
  let isVectorDraft = false;

  if (capturedImage) {
    finalAssetData = capturedImage;
    isVectorDraft = false;
  } else {
    // Generate code block map string for blueprint recovery instead of empty profile name labels
    finalAssetData = generateYachtSVG(selectedYacht.name, selectedYacht.length);
    isVectorDraft = true;
  }

  const sightings = JSON.parse(localStorage.getItem("fleet") || "[]");
  sightings.unshift({
    name:selectedYacht.yachtName || selectedYacht.name,
    deepPockets:selectedYacht.deepPockets,
    yachtLink:selectedYacht.yachtLink,
    ownerLink:selectedYacht.ownerLink,
    asset:finalAssetData,
    isVector:isVectorDraft
  });

  localStorage.setItem("fleet",JSON.stringify(sightings));
  renderFleet();
}

function renderFleet(){
  const sightings = JSON.parse(localStorage.getItem("fleet") || "[]");
  const area = document.getElementById("fleetArea");

  if(!sightings.length){
    area.style.display = "none";
    area.innerHTML = "";
    return;
  }

  area.style.display = "block";

  // CLEANED: Redundant text titles removed completely
  let html = `<div class="fleet-row">`;

  sightings.forEach((s,index)=>{
    let previewRenderBlock = "";
    if(s.isVector) {
       previewRenderBlock = s.asset; // Inject raw inline blueprint vector lines straight into porthole
    } else {
       previewRenderBlock = `<img src="${s.asset}" alt="Sighting photo">`;
    }

    html += `
      <div class="fleet-card" onclick="openFleet(${index})">
        <div class="fleet-porthole">
          <div class="porthole-asset-frame">
             ${previewRenderBlock}
          </div>
        </div>
        <div class="fleet-name">${s.name}</div>
      </div>
    `;
  });

  html += `</div>`;
  area.innerHTML = html;
}

function openFleet(index){
  const sightings = JSON.parse(localStorage.getItem("fleet") || "[]");
  const s = sightings[index];

  let displayBlock = "";
  if(s.isVector) {
    displayBlock = s.asset;
  } else {
    displayBlock = `<img src="${s.asset}" alt="Vessel frame snapshot">`;
  }

  document.getElementById("overlayContent").innerHTML = `
    <a class="vessel-hull" href="${s.yachtLink}" target="_blank">
      ${s.name}
    </a>
    <a class="owner-plaque" href="${s.ownerLink}" target="_blank">
      ◇ ${s.deepPockets} ◇
    </a>
    <div class="overlay-img-frame">
       ${displayBlock}
    </div>
  `;

  document.getElementById("overlay").style.display = "block";
}

function hideOverlay(){
  document.getElementById("overlay").style.display = "none";
}

function closeOverlay(e){
  if(e.target.id === "overlay") hideOverlay();
}

function showHomeHelp(){
  document.getElementById("homeOverlay").style.display = "block";
}

function hideHomeHelp(){
  document.getElementById("homeOverlay").style.display = "none";
}

function closeHomeHelp(e){
  if(e.target.id === "homeOverlay") hideHomeHelp();
}

function updateInstallFooter(){
  const standalone =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;

  const footer = document.getElementById("installFooter");
  if(footer){
    footer.style.display = standalone ? "none" : "block";
  }
}

renderDiagram();
renderFleet();
updateInstallFooter();
</script>
